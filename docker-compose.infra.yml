# LIMIT Connect — Infrastructure Stack
# Dev/Test na 37.27.248.86, blueprint za produkcijski bare metal
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml logs -f
#   docker compose -f docker-compose.infra.yml down

version: "3.8"

services:
  # ── MinIO S3 (Arhiva — 11 godina retencija) ──
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Console
    volumes:
      - /var/www/fina-connect/minio-data:/data
    environment:
      MINIO_ROOT_USER: limitconnect
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-LimitConnect2026S3Archive}
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── WhatsApp Gateway (WAHA) ──
  waha:
    image: devlikeapro/waha:latest
    container_name: fina_waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/www/fina-connect/waha-data:/app/data
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis (Celery broker + cache) ──
  # Koristimo systemd redis jer je već instaliran
  # Ovaj entry je za produkcijski compose na bare metal
