{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ action }}{% endblock %}
{% block page_title %}{{ action }}{% endblock %}
{% block extra_css %}
<!-- responsive: fenix-tokens.css -->
{% endblock %}
{% block content %}
<!-- lang: topbar -->
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary mt-2" onclick="addRow()">
          <i class="fas fa-plus me-1"></i>{% trans "Dodaj stavku" %}
        </button>
      </div>
    </div>

    <div class="col-md-4">
      <div class="fenix-filters">
        <h6 class="fw-bold mb-3">{% trans "Kupac i dostava" %}</h6>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Kupac *" %}</label>
          <select name="customer" class="form-select" required>
            <option value="">{% trans "-- odaberi kupca --" %}</option>
            {% for c in customers %}
            <option value="{{ c.pk }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Status" %}</label>
          <select name="status" class="form-select">
            {% for val,label in status_choices %}
            <option value="{{ val }}" {% if val == "confirmed" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Način dostave" %}</label>
          <select name="shipping_method" class="form-select">
            {% for val,label in shipping_choices %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Adresa dostave" %}</label>
          <textarea name="shipping_address" class="form-control form-control-sm" rows="2"></textarea>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Napomene" %}</label>
          <textarea name="notes" class="form-control form-control-sm" rows="2"></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="fas fa-check me-2"></i>{% trans "Kreiraj narudžbu" %}
      </button>
    </div>
  </div>
</form>
{% endblock %}
{% block extra_js %}
<script>
function addRow() {
  var template = document.querySelector('.item-row').cloneNode(true);
  template.querySelectorAll('select, input[type=number]').forEach(el => {
    if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '1';
  });
  document.getElementById('items-container').appendChild(template);
}
function removeRow(btn) {
  var rows = document.querySelectorAll('.item-row');
  if (rows.length > 1) btn.closest('.item-row').remove();
}
</script>
{% endblock %}
