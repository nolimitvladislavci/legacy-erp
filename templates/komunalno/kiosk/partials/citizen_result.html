{% load i18n %}
{% if cards %}
<div class="list-group mt-3">
    {% for card in cards %}
    <a href="{% url 'komunalno:kiosk_citizen' station_id=request.resolver_match.kwargs.station_id card_id=card.pk %}"
       class="list-group-item list-group-item-action d-flex align-items-center fx-fs-xl fx-text-body"
       style="background:var(--kiosk-surface);border-color:var(--kiosk-accent);padding:15px">
        <i class="fas fa-user fa-lg me-3 opacity-50"></i>
        <div>
            <strong>{{ card.partner.name }}</strong>
            <br><small class="opacity-70">{{ card.card_number }} &middot; {{ card.address }}</small>
        </div>
        <i class="fas fa-chevron-right ms-auto opacity-50"></i>
    </a>
    {% endfor %}
</div>
{% endif %}
