{% extends "base.html" %}
{% load i18n %}

{% block title %}Komunalno — Izvještaji{% endblock %}

{% block content %}
<div class="fx-m-auto fx-max-800">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="fas fa-chart-bar me-2 fx-text-amber"></i>Izvještaji</h4>
        <a href="{% url 'komunalno:dashboard' %}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Nazad
        </a>
    </div>

    <div class="row g-3">
        <div class="col-12 col-md-6">
            <a href="{% url 'komunalno:daily_report' %}" class="action-card">
                <i class="fas fa-calendar-day fx-text-blue" style="background:rgba(33,150,243,.1)"></i>
                <div>
                    Dnevni izvještaj
                    <div class="desc">Pregled zaprimanja po datumu i kategoriji</div>
                </div>
            </a>
        </div>
        <div class="col-12 col-md-6">
            <a href="{% url 'komunalno:onto_dashboard' %}" class="action-card">
                <i class="fas fa-cloud-upload-alt fx-text-green" style="background:rgba(76,175,80,.1)"></i>
                <div>
                    e-ONTO status
                    <div class="desc">Pregled slanja prema Ministarstvu</div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
