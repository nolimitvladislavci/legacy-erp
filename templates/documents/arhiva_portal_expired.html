{% load i18n %}
<!DOCTYPE html>
<html lang="hr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% trans "Link nije valjan" %} | LIMIT Connect</title>
<style>
:root{--gold:#C9A84C;--bg:#0a0a0a;--text:#e0e0e0;--text-dim:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{text-align:center;padding:3rem 2rem;max-width:400px}
.icon{font-size:4rem;margin-bottom:1.5rem;opacity:.6}
h1{font-size:1.3rem;margin-bottom:.5rem;color:var(--gold)}
p{color:var(--text-dim);font-size:.9rem;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#128274;</div>
  <h1>{% trans "Link nije valjan" %}</h1>
  <p>{% trans "Ovaj link za pristup arhivi je istekao ili je deaktiviran. Kontaktirajte svoje računovodstvo za novi link." %}</p>
</div>
</body></html>
