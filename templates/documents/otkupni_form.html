{% extends "base.html" %}
{% load i18n %}
{% block extra_css %}
<style>
@media(max-width:768px){
  .container-fluid{padding-left:.5rem;padding-right:.5rem}
  .table-responsive{font-size:.78rem}
  .table th,.table td{padding:.4rem .5rem}
  .btn-sm{font-size:.7rem;padding:3px 8px}
  .row.g-2>div,.row.g-3>div{flex:0 0 100%;max-width:100%}
  .stat-card,.card{margin-bottom:.5rem}
  h2,.h2{font-size:1.2rem}
  h4,.h4{font-size:1rem}
  .d-flex.justify-content-between{flex-wrap:wrap;gap:.5rem}
}
@media(max-width:480px){
  .table th:nth-child(n+5),.table td:nth-child(n+5){display:none}
  .btn{font-size:.75rem}
  .stat-card .fs-4,.stat-mini .val,.exp-stat-value,.flock-stat-value{font-size:1.2rem}
}
</style>
{% endblock %}
{% block content %}
<h2 class="mb-3"><i class="fas fa-file-alt text-warning me-2"></i>Novi otkupni blok</h2>
<form method="post">
{% csrf_token %}
<div class="row g-3 mb-3">
  <div class="col-md-4">
    <label class="form-label">Datum</label>
    <input type="date" name="date_issued" class="form-control" value="{% now "Y-m-d" %}">
  </div>
  <div class="col-md-3"><label class="form-label">Poljoprivrednik</label><input type="text" name="farmer_name" class="form-control" required></div><div class="col-md-2"><label class="form-label">OIB</label><input type="text" name="farmer_oib" class="form-control" maxlength="11"></div><div class="col-md-3"><label class="form-label">Adresa</label><input type="text" name="farmer_address" class="form-control"></div><div class="col-md-2"><label class="form-label">IBAN</label><input type="text" name="farmer_iban" class="form-control"></div><div class="col-md-2"><label class="form-label">Plaćanje</label><select name="payment_method" class="form-select"><option value="virman">Virman</option><option value="gotovina">Gotovina</option></select></div>
</div>
<h5 class="mt-4 mb-3">Stavke</h5>
<div id="items-container">
  <div class="row g-2 mb-2 item-row">
    <div class="col-md-4"><input type="text" name="item_name" class="form-control" placeholder="Naziv"></div>
    <div class="col-md-2"><input type="number" name="item_qty" class="form-control" placeholder="Kol." step="0.01" value="1"></div>
    <div class="col-md-1"><input type="text" name="item_unit" class="form-control" value="kg"></div>
    <div class="col-md-2"><input type="number" name="item_price" class="form-control" placeholder="Cijena" step="0.01"></div>
    <div class="col-md-1"><input type="number" name="item_vat" class="form-control" value="25"></div>
    <div class="col-md-2"><button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('.item-row').remove()"><i class="fas fa-trash"></i></button></div>
  </div>
</div>
<button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="document.getElementById('items-container').appendChild(document.querySelector('.item-row').cloneNode(true))"><i class="fas fa-plus me-1"></i>Dodaj stavku</button>
<div class="mb-3"><label class="form-label">Napomena</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
<button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Spremi</button>
</form>
{% endblock %}
