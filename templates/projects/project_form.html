{% extends "base.html" %}
{% load i18n l10n %}
{% block title %}{{ action }}{% endblock %}
{% block page_title %}{{ action }}{% endblock %}
{% block extra_css %}
<!-- responsive: fenix-tokens.css -->
{% endblock %}
{% block content %}
<!-- lang: topbar -->
      </div>
    </div>

    <div class="col-md-4">
      <div class="fenix-filters">
        <h6 class="fw-bold mb-3">{% trans "Status i budžet" %}</h6>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Status" %}</label>
          <select name="status" class="form-select">
            {% for val,label in status_choices %}
            <option value="{{ val }}" {% if project.status == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Budžet (EUR)" %}</label>
          <input type="number" step="0.01" name="budget" class="form-control" value="{{ project.budget|default:'0'|unlocalize }}">
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label fw-bold">{% trans "Početak" %}</label>
            <input type="date" name="start_date" class="form-control" value="{{ project.start_date|date:'Y-m-d'|default:'' }}">
          </div>
          <div class="col-6">
            <label class="form-label fw-bold">{% trans "Rok" %}</label>
            <input type="date" name="end_date" class="form-control" value="{{ project.end_date|date:'Y-m-d'|default:'' }}">
          </div>
        </div>
        <div class="form-check mt-2">
          <input type="checkbox" name="is_public" class="form-check-input" id="isPublic" {% if project.is_public %}checked{% endif %}>
          <label class="form-check-label" for="isPublic">{% trans "Javno vidljivo" %}</label>
        </div>
      </div>

      <div class="fenix-stat">
        <h6 class="fw-bold mb-3">{% trans "Veze" %}</h6>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Tvrtka" %}</label>
          <select name="company" class="form-select">
            <option value="">--</option>
            {% for c in companies %}
            <option value="{{ c.pk }}" {% if project.company_id == c.pk %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Klijent" %}</label>
          <select name="client" class="form-select">
            <option value="">--</option>
            {% for c in clients %}
            <option value="{{ c.pk }}" {% if project.client_id == c.pk %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold">{% trans "Voditelj" %}</label>
          <select name="manager" class="form-select">
            <option value="">--</option>
            {% for u in managers %}
            <option value="{{ u.pk }}" {% if project.manager_id == u.pk %}selected{% endif %}>{{ u.get_full_name|default:u.username }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>{% trans "Spremi" %}</button>
      <a href="{% url 'projects_index' %}" class="btn btn-outline-secondary ms-2">{% trans "Odustani" %}</a>
    </div>
  </div>
</form>
{% endblock %}
