{# templates/konto/_panel_row.html — jedan redak u financijskom panelu
   Parametri: label, val (Decimal/int), suffix, color #}
<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(51,65,85,.35);font-size:.82rem">
  <span style="color:var(--text-dim,#94a3b8)">{{ label }}</span>
  <span style="font-weight:700;color:{{ color|default:'var(--text,#e2e8f0)' }}">{{ val|floatformat:2 }}{% if suffix %} {{ suffix }}{% endif %}</span>
</div>
