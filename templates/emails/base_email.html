{% load i18n %}
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LIMIT Connect{% endblock %}</title>
</head>
<body class="fx-m-0 fx-p-0" style="background:#f4f4f4;font-family:'Barlow',Helvetica,Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;">
<tr><td align="center" style="padding:30px 10px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" class="fx-rounded fx-bg-card fx-overflow-hidden" style="box-shadow:0 2px 8px rgba(0,0,0,0.08)">
<tr><td class="fx-bg-body text-center" style="padding:24px 30px">
  <span class="fx-text-gold fx-fw-bold" style="font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;letter-spacing:2px">LIMIT CONNECT</span>
  <br><span class="fx-text-muted fx-uppercase" style="font-size:11px;letter-spacing:3px">Visković Group</span>
</td></tr>
<tr><td style="padding:30px;">
  {% block content %}{% endblock %}
</td></tr>
<tr><td class="fx-bg-body text-center" style="padding:20px 30px">
  <p class="fx-text-muted" style="margin:0 0 6px;font-size:12px">limit-connect.com &middot; Visković Group d.o.o.</p>
  <p class="fx-text-dim" style="margin:0 0 6px;font-size:11px">Ova poruka je automatski generirana. Molimo ne odgovarajte izravno.</p>
  <p class="fx-m-0" style="font-size:11px"><a href="https://limit-connect.com/pricing/" class="fx-text-gold fx-no-underline">Automatizirajte i vi svoje poslovanje &rarr; limit-connect.com</a></p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
