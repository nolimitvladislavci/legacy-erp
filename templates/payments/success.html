<!DOCTYPE html>
<html lang="hr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placanje uspjesno</title>
<style>
:root{--bg:#0a0a0a;--gold:#c9a84c;--green:#22c55e;--text:#e8e8e8;--muted:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.icon{font-size:4rem;margin-bottom:1rem}
h1{color:var(--green);font-size:1.5rem;margin-bottom:.5rem}
p{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
.amount{font-size:2rem;font-weight:800;color:var(--gold);margin-bottom:.3rem}
.method{font-size:.8rem;color:var(--muted)}
</style>
</head><body>
<div>
  <div class="icon">&#9989;</div>
  <h1>Placanje uspjesno!</h1>
  {% if payment %}
  <div class="amount">&euro;{{ payment.amount|floatformat:2 }}</div>
  <div class="method">{{ payment.get_method_display }}{% if payment.crypto_currency %} ({{ payment.crypto_currency }}){% endif %}</div>
  {% endif %}
  <p>Hvala vam. Mozete zatvoriti ovu stranicu.</p>
</div>
</body></html>
