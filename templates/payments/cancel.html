<!DOCTYPE html>
<html lang="hr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placanje otkazano</title>
<style>
:root{--bg:#0a0a0a;--gold:#c9a84c;--red:#ef4444;--text:#e8e8e8;--muted:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.icon{font-size:4rem;margin-bottom:1rem}
h1{color:var(--red);font-size:1.5rem;margin-bottom:.5rem}
p{color:var(--muted);font-size:.9rem}
a{color:var(--gold);text-decoration:none}
</style>
</head><body>
<div>
  <div class="icon">&#10060;</div>
  <h1>Placanje otkazano</h1>
  <p>Niste naplaceni. Mozete se vratiti i pokusati ponovo.</p>
</div>
</body></html>
