{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#c9a84c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FinaConnect">
    <link rel="apple-touch-icon" href="{% static 'img/icons/icon-192x192.png' %}">
    <link rel="stylesheet" href="{% static 'css/global_themes.css' %}">
    <link rel="stylesheet" href="{% static 'css/fenix-ui.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% block head_extra %}{% endblock %}
    <title>{% block title %}FinaConnect{% endblock %}</title>
</head>
<body data-theme="dark"> {# This data-theme will be overwritten by JS init #}
    <header>
        {% include 'snippets/header.html' %}
        <div class="theme-switcher">
            <button id="dark-theme-btn" class="theme-btn active" onclick="setTheme('dark')">
                <i class="fa fa-moon"></i> Dark
            </button>
            <button id="light-theme-btn" class="theme-btn" onclick="setTheme('light')">
                <i class="fa fa-sun"></i> Light
            </button>
        </div>
    </header>

    <main id="content">
        {% block content %}{% endblock %}
    </main>

    <footer>
        {% include 'snippets/footer.html' %}
    </footer>

    <script>
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            document.getElementById('dark-theme-btn').classList.remove('active');
            document.getElementById('light-theme-btn').classList.remove('active');

            if (theme === 'dark') {
                document.getElementById('dark-theme-btn').classList.add('active');
            } else {
                document.getElementById('light-theme-btn').classList.add('active');
            }
        }

        // Init script
        document.addEventListener('DOMContentLoaded', () => {
            const storedTheme = localStorage.getItem('theme') || 'dark'; // Default to dark
            setTheme(storedTheme);
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
