{% load i18n %}
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Prijava - LIMIT CONNECT" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif; margin: 0;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .logo-text {
            color: white; font-weight: 800; font-size: 1.8rem;
            text-align: center; margin-bottom: 30px; letter-spacing: 1px;
        }
        .logo-text span { color: var(--gold,#c9a84c); }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 12px 15px; border-radius: 8px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8); border-color: var(--gold,#c9a84c);
            box-shadow: 0 0 0 0.25rem rgba(201, 168, 76, 0.25); color: white;
        }
        .btn-primary {
            background: var(--gold,#c9a84c); border: none; color: #0f172a;
            font-weight: 700; padding: 12px; border-radius: 8px;
            letter-spacing: 0.5px; transition: all 0.3s;
        }
        .btn-primary:hover { background: #e8c96a; transform: translateY(-2px); }
        .form-label { color: #94a3b8; font-size: 0.9rem; margin-bottom: 5px; }
    </style>

<style>
.pwd-wrap{position:relative;display:block}
.pwd-wrap input{width:100%;padding-right:40px;box-sizing:border-box}
.pwd-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);
background:none;border:none;cursor:pointer;color:var(--gold,#c9a84c);font-size:18px;padding:0}
</style>
</head>
<body>
    <div class="login-card">
        <div class="logo-text">{% trans "FINA-" %}<span>{% trans "CONNECT" %}</span></div>
        {% if form.errors or error %}
        <div class="alert alert-danger border-0 bg-danger text-white" style="background-color: rgba(220,53,69,0.2) !important;">
            {% trans "Pogrešno korisničko ime ili lozinka." %}
        </div>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label">{% trans "Korisničko ime" %}</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: rgba(255,255,255,0.1); color: #94a3b8;"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">{% trans "Lozinka" %}</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0" style="border-color: rgba(255,255,255,0.1); color: #94a3b8;"><i class="fas fa-lock"></i></span>
                    <div class="pwd-wrap"><input type="password" id="pwd_2" name="password" class="form-control border-start-0" required><button type="button" class="pwd-eye" onclick="togglePwd('pwd_2',this)">👁</button></div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">{% trans "Prijava u ERP sustav" %}</button>
        </form>
        <div class="text-center mt-4">
            <a href="{% url 'dashboard' %}" class="text-decoration-none" style="color: #64748b; font-size: 0.85rem;"><i class="fas fa-arrow-left me-1"></i> {% trans "Povratak na naslovnicu" %}</a>
        </div>
    </div>
<script>
/* pw-toggle: auto-add show/hide eye icon to all password inputs */
(function(){
  var EO='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:block"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EC='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:block"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  function addToggle(inp){
    if(inp._pwDone) return; inp._pwDone=true;
    var w=document.createElement('div');
    w.style.cssText='position:relative;display:block;';
    inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    inp.style.paddingRight='40px';
    var b=document.createElement('button');
    b.type='button'; b.tabIndex=-1; b.title='Prikaži/sakrij lozinku';
    b.style.cssText='position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#888;line-height:0;z-index:2;';
    b.innerHTML=EO;
    b.onclick=function(e){e.preventDefault();if(inp.type==='password'){inp.type='text';b.innerHTML=EC;}else{inp.type='password';b.innerHTML=EO;}};
    w.appendChild(b);
  }
  function init(){document.querySelectorAll('input[type="password"]').forEach(addToggle);}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>

<script>
function togglePwd(id,btn){
    var f=document.getElementById(id);
    if(!f)return;
    f.type=f.type==='password'?'text':'password';
    btn.textContent=f.type==='password'?'👁':'🙈';
}
</script>
</body>
</html>
