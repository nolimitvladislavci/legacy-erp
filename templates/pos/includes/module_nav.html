{% load i18n %}
{% comment %}
Module Navigation Bar — 38px traka ispod headera.
Otvara module u novom tabu. Compliance dot desno.
{% endcomment %}
<style>
.pos-module-nav{display:flex;align-items:center;height:38px;background:#0d0d12;border-bottom:1px solid rgba(255,255,255,.06);padding:0 8px;gap:2px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.pos-module-nav::-webkit-scrollbar{display:none}
.mn-btn{display:flex;align-items:center;gap:5px;padding:4px 10px;color:var(--text-dim);font-size:.7rem;font-weight:600;text-decoration:none;border-radius:5px;white-space:nowrap;transition:all .12s;-webkit-tap-highlight-color:transparent}
.mn-btn:hover{background:rgba(201,168,76,.08);color:var(--gold,#c9a84c)}
.mn-btn i{font-size:.82rem}
.mn-spacer{flex:1}
.mn-compliance{position:relative;cursor:pointer;padding:4px 10px;display:flex;align-items:center;gap:5px}
.mn-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s}
.mn-dot.warn{background:var(--amber);animation:compBlink 1.5s infinite}
.mn-dot.critical{background:var(--red);animation:compBlink .7s infinite}
@keyframes compBlink{0%,100%{opacity:1}50%{opacity:.3}}
.mn-label{font-size:.65rem;color:var(--text-dim);font-weight:600}
</style>

<div class="pos-module-nav">
  <a class="mn-btn" href="{% url 'invoicing:index' %}" target="_blank" title="Fakture"><i class="fas fa-file-invoice-dollar"></i><span class="hide-mobile">Fakture</span></a>
  <a class="mn-btn" href="{% url 'partners:list' %}" target="_blank" title="Partneri"><i class="fas fa-handshake"></i></a>
  <a class="mn-btn" href="{% url 'inventory:list' %}" target="_blank" title="Inventar"><i class="fas fa-boxes"></i></a>
  {% if session %}
  <a class="mn-btn" href="{{ session_report_url }}" target="_blank" title="Izvjestaj smjene"><i class="fas fa-chart-pie"></i></a>
  {% endif %}
  {% if is_gastro %}
  <a class="mn-btn" href="{% url 'pos:gastro_kitchen' %}" target="_blank" title="Kuhinja"><i class="fas fa-utensils"></i></a>
  {% endif %}
  <a class="mn-btn" href="{% url 'pos:prigovori_list' %}" target="_blank" title="Knjiga boljitaka"><i class="fas fa-book"></i></a>
  <a class="mn-btn" href="{% url 'pos:pos_settings' %}" target="_blank" title="Postavke"><i class="fas fa-cog"></i></a>

  <div class="mn-spacer"></div>

  <div class="mn-compliance" onclick="toggleCompliancePanel()" title="Compliance status">
    <div class="mn-dot" id="complianceDot"></div>
    <span class="mn-label" id="complianceDotLabel">OK</span>
  </div>
</div>
