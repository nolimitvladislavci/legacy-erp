{% extends "pos/base_pos.html" %}
{% load i18n %}
{% block title %}Dodaj rok trajanja{% endblock %}
{% block extra_css %}<style>
.exp-form{max-width:540px;margin:1.5rem auto;padding:0 1rem}
.exp-form h2{color:var(--gold);font-size:1.1rem;margin-bottom:1rem}
.f-group{margin-bottom:.8rem}
.f-group label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.3rem;font-weight:600}
.f-group select,.f-group input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:.55rem .75rem;color:var(--text);font-size:.85rem;font-family:inherit}
.f-group select:focus,.f-group input:focus{outline:none;border-color:var(--gold)}
.f-actions{display:flex;gap:.5rem;margin-top:1.2rem}
</style>{% endblock %}
{% block content %}
<div class="exp-form">
  <h2>&#128197; {% trans "Dodaj sarzni rok" %}</h2>
  <form method="post">
    {% csrf_token %}
    <div class="f-group">
      <label>{% trans "Artikl" %}</label>
      <select name="inventory_item_id" required>
        <option value="">-- {% trans "Odaberi artikl" %} --</option>
        {% for item in items %}
        <option value="{{ item.pk }}">{{ item.name }}{% if item.sku %} ({{ item.sku }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="f-group">
      <label>{% trans "Broj sarze" %}</label>
      <input type="text" name="batch_number" placeholder="LOT-2026-001">
    </div>
    <div class="f-group">
      <label>{% trans "Kolicina" %}</label>
      <input type="number" name="quantity" value="1" min="0" step="0.01">
    </div>
    <div class="f-group">
      <label>{% trans "Datum isteka" %}</label>
      <input type="date" name="expiry_date" required>
    </div>
    <div class="f-group">
      <label>{% trans "Upozorenje dana prije" %}</label>
      <input type="number" name="alert_days_before" value="3" min="0" max="90">
    </div>
    <div class="f-actions">
      <button type="submit" class="btn btn-gold">{% trans "Spremi" %}</button>
      <a href="{% url 'pos:expiry_dashboard' %}" class="btn btn-ghost">{% trans "Odustani" %}</a>
    </div>
  </form>
</div>
{% endblock %}
