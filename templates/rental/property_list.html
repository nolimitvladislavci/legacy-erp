{% extends "pos/base_pos.html" %}
{% block title %}Sobe{% endblock %}
{% block content %}
<div style="padding:1rem;max-width:800px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <h2 style="color:var(--gold);font-size:1.1rem">Sobe i nekretnine</h2>
    <a href="{% url 'rental:property_create' %}" class="btn btn-gold btn-sm">+ Nova</a>
  </div>
  {% for p in properties %}
  <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem;margin-bottom:.4rem;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-weight:700">{{ p.name }} <span style="font-size:.75rem;color:var(--muted)">({{ p.get_type_display }})</span></div>
      <div style="font-size:.75rem;color:var(--muted)">{{ p.floor|default:"" }} &middot; {{ p.capacity }} osoba &middot; &euro;{{ p.price_per_night }}/noc</div>
    </div>
    <a href="{% url 'rental:property_edit' p.pk %}" class="btn btn-ghost btn-sm">&#9998;</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
