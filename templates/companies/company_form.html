{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ action }}{% endblock %}
{% block page_title %}{{ action }}{% endblock %}
{% block extra_css %}
<!-- responsive: fenix-tokens.css -->
{% endblock %}
{% block content %}
<!-- lang: topbar -->
      <div class="col-md-6">
        <label class="form-label fw-bold">{% trans "IBAN" %}</label>
        <input type="text" name="iban" class="form-control" value="{{ company.iban|default:'' }}" placeholder="HR...">
      </div>
      <div class="col-12">
        <label class="form-label fw-bold">{% trans "Adresa" %}</label>
        <input type="text" name="address" class="form-control" value="{{ company.address|default:'' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold">{% trans "Poštanski broj" %}</label>
        <input type="text" name="zip_code" class="form-control" value="{{ company.zip_code|default:'' }}">
      </div>
      <div class="col-md-8">
        <label class="form-label fw-bold">{% trans "Grad" %}</label>
        <input type="text" name="city" class="form-control" value="{{ company.city|default:'' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold">{% trans "Logo" %}</label>
        <input type="file" name="logo" class="form-control" accept="image/*">
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <div class="form-check">
          <input type="checkbox" name="is_vat_registered" class="form-check-input" id="isVat"
            {% if company.is_vat_registered|default:True %}checked{% endif %}>
          <label class="form-check-label fw-bold" for="isVat">{% trans "U sustavu PDV-a" %}</label>
        </div>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>{% trans "Spremi" %}</button>
        <a href="{% url 'companies:list' %}" class="btn btn-outline-secondary ms-2">{% trans "Odustani" %}</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
