{% extends "base.html" %}
{% block title %}{{ action }}{% endblock %}
{% block extra_css %}
<style>
@media(max-width:768px){
  .container-fluid{padding-left:.5rem;padding-right:.5rem}
  .table-responsive{font-size:.78rem}
  .table th,.table td{padding:.4rem .5rem}
  .btn-sm{font-size:.7rem;padding:3px 8px}
  .row.g-2>div,.row.g-3>div{flex:0 0 100%;max-width:100%}
  .stat-card,.card{margin-bottom:.5rem}
  h2,.h2{font-size:1.2rem}
  h4,.h4{font-size:1rem}
  .d-flex.justify-content-between{flex-wrap:wrap;gap:.5rem}
}
@media(max-width:480px){
  .table th:nth-child(n+5),.table td:nth-child(n+5){display:none}
  .btn{font-size:.75rem}
  .stat-card .fs-4,.stat-mini .val,.exp-stat-value,.flock-stat-value{font-size:1.2rem}
}
</style>
{% endblock %}
{% block content %}
<div class="container py-3" style="max-width:800px">
<a href="{% url 'companies:komitent_dashboard' %}" class="text-muted small"><i class="fas fa-arrow-left"></i> Natrag</a>
<h2 style="color:var(--gold)"><i class="fas fa-user-plus"></i> {{ action }}</h2>

<div class="stat-card mt-3">
<form method="post">
{% csrf_token %}

<h5 style="color:var(--gold)">Podaci firme</h5>
<div class="row g-2 mb-3">
  <div class="col-md-6"><label class="form-label small">Naziv firme *</label><input type="text" name="name" required class="form-control form-control-sm"></div>
  <div class="col-md-3"><label class="form-label small">OIB</label><input type="text" name="oib" class="form-control form-control-sm"></div>
  <div class="col-md-3"><label class="form-label small">Tip</label>
    <select name="business_type" class="form-select form-select-sm">
      <option value="obrt">Obrt</option><option value="doo">d.o.o.</option><option value="jdoo">j.d.o.o.</option>
      <option value="opg">OPG</option><option value="udruga">Udruga</option><option value="other">Ostalo</option>
    </select>
  </div>
</div>
<div class="row g-2 mb-3">
  <div class="col-md-4"><label class="form-label small">Adresa</label><input type="text" name="address" class="form-control form-control-sm"></div>
  <div class="col-md-2"><label class="form-label small">Poštanski</label><input type="text" name="zip_code" class="form-control form-control-sm"></div>
  <div class="col-md-3"><label class="form-label small">Grad</label><input type="text" name="city" class="form-control form-control-sm"></div>
  <div class="col-md-3"><label class="form-label small">IBAN</label><input type="text" name="iban" class="form-control form-control-sm"></div>
</div>
<div class="row g-2 mb-4">
  <div class="col-md-4"><label class="form-label small">Email firme</label><input type="email" name="email" class="form-control form-control-sm"></div>
  <div class="col-md-4"><label class="form-label small">Telefon firme</label><input type="text" name="phone" class="form-control form-control-sm"></div>
</div>

<hr>
<h5 style="color:var(--gold)">Komitent profil</h5>
<div class="row g-2 mb-3">
  <div class="col-md-4"><label class="form-label small">Kontakt osoba</label><input type="text" name="contact_person" class="form-control form-control-sm"></div>
  <div class="col-md-4"><label class="form-label small">Telefon kontakta</label><input type="text" name="contact_phone" class="form-control form-control-sm"></div>
  <div class="col-md-4"><label class="form-label small">Email kontakta</label><input type="email" name="contact_email" class="form-control form-control-sm"></div>
</div>
<div class="row g-2 mb-3">
  <div class="col-md-3"><label class="form-label small">Kategorija</label>
    <select name="category" class="form-select form-select-sm">
      <option value="obrt">Obrt</option><option value="doo">d.o.o.</option><option value="opg">OPG</option>
      <option value="udruga">Udruga</option><option value="fizicka">Fizička osoba</option><option value="strano">Strano</option>
    </select>
  </div>
  <div class="col-md-3"><label class="form-label small">Tip ugovora</label>
    <select name="contract_type" class="form-select form-select-sm">
      <option value="mjesecni">Mjesečni</option><option value="godisnji">Godišnji</option>
      <option value="pausal">Paušal</option><option value="po_satu">Po satu</option><option value="besplatno">Besplatno</option>
    </select>
  </div>
  <div class="col-md-3"><label class="form-label small">Naknada (€/mj)</label><input type="number" step="0.01" name="monthly_fee" value="0" class="form-control form-control-sm"></div>
  <div class="col-md-3"><label class="form-label small">Preporuka od</label><input type="text" name="referred_by" class="form-control form-control-sm"></div>
</div>
<div class="mb-3"><label class="form-label small">Bilješke</label><textarea name="notes" rows="3" class="form-control form-control-sm" placeholder="Napomene o komitentu..."></textarea></div>

<button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> Kreiraj komitenta</button>
</form>
</div>
</div>
{% endblock %}
