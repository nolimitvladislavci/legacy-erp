{% extends "base.html" %}
{% load i18n %}
{% block page_title %}{% trans "Novi obracun placa" %}{% endblock %}

{% block content %}
<div class="fx-m-auto" style="max-width:500px">
    <h2 class="fx-text-gold mb-4">
        <i class="fas fa-plus-circle"></i> {% trans "Novi obracun placa" %}
    </h2>

    <form method="post" class="fx-rounded fx-bg-card" style="padding:32px;box-shadow:var(--shadow-sm)">
        {% csrf_token %}
        <div class="mb-4">
            <label class="fx-fw-semibold d-block mb-1" style="color:var(--muted2)">{% trans "Godina" %}</label>
            <select name="year" class="fx-w-full fx-rounded fx-fs-lg fx-p-10 fx-b">
                {% for y in years %}
                <option value="{{ y }}" {% if y == default_year %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-4">
            <label class="fx-fw-semibold d-block mb-1" style="color:var(--muted2)">{% trans "Mjesec" %}</label>
            <select name="month" class="fx-w-full fx-rounded fx-fs-lg fx-p-10 fx-b">
                {% for m in months %}
                <option value="{{ m }}" {% if m == default_month %}selected{% endif %}>{{ m|stringformat:"02d" }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="fx-w-full fx-text-dark fx-border-none fx-rounded fx-fs-lg fx-fw-bold fx-pointer fx-p-12 fx-bg-gold">
            <i class="fas fa-calculator"></i> {% trans "Kreiraj obracun" %}
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'payroll:list' %}" class="fx-text-dim fx-no-underline">
            <i class="fas fa-arrow-left"></i> {% trans "Natrag" %}
        </a>
    </div>
</div>
{% endblock %}
