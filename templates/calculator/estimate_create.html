{% extends "worktime/base_worktime.html" %}
{% load i18n %}
{% block title %}Nova ponuda{% endblock %}
{% block page_title %}<h1 class="text-xl font-bold">{% trans "📝 Nova ponuda" %}</h1>{% endblock %}
{% block worktime_content %}
<div class="max-w-2xl">
<form method="post" class="bg-white rounded-xl shadow-sm border p-6 space-y-4">{% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium mb-1">{% trans "Klijent *" %}</label><input type="text" name="client_name" required class="w-full px-3 py-2 border rounded-xl text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">{% trans "Tvrtka" %}</label><input type="text" name="client_company" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">{% trans "Email" %}</label><input type="email" name="client_email" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">{% trans "Telefon" %}</label><input type="text" name="client_phone" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
    </div>
    <div><label class="block text-sm font-medium mb-1">{% trans "Naziv projekta *" %}</label><input type="text" name="project_name" required class="w-full px-3 py-2 border rounded-xl text-sm"></div>
    <div><label class="block text-sm font-medium mb-1">{% trans "Lokacija" %}</label><input type="text" name="project_location" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
    <div><label class="block text-sm font-medium mb-1">{% trans "Opis" %}</label><textarea name="project_description" rows="3" class="w-full px-3 py-2 border rounded-xl text-sm"></textarea></div>
    <div class="grid grid-cols-3 gap-4">
        <div><label class="block text-sm font-medium mb-1">{% trans "Radnih dana" %}</label><input type="number" name="duration_days" value="22" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">{% trans "Marža %" %}</label><input type="number" name="margin_pct" value="25" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
        <div><label class="block text-sm font-medium mb-1">{% trans "PDV %" %}</label><input type="number" name="tax_rate" value="19" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
    </div>
    <div class="flex gap-3 pt-4">
        <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-semibold">{% trans "Kreiraj ponudu" %}</button>
        <a href="{% url 'estimate_list' %}" class="px-6 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-semibold">{% trans "Odustani" %}</a>
    </div>
</form>
</div>
{% endblock %}
