{% load i18n %}
{% load fenix_ai %}
<div id="ai-action-{{ action.id }}"
     class="d-flex align-items-start fx-gap-3" style="padding:.65rem 1rem;border-bottom:1px solid var(--border-light);opacity:.6">
  <div class="fx-fs-lg flex-shrink-0" style="margin-top:.1rem">&#x2705;</div>
  <div class="fx-flex-1 min-w-0">
    <div class="fx-fs-note fx-text-body">{{ action.description }}</div>
    <div class="fx-fs-sm fx-text-muted" style="margin-top:.2rem">
      Pregledano {{ action.reviewed_at|timesince }} ago
      {% if action.reviewed_by %} od {{ action.reviewed_by.get_full_name|default:action.reviewed_by.username }}{% endif %}
    </div>
  </div>
  <div>{% ai_status_pill "done" %}</div>
</div>
