{% load i18n %}
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email poslan - LIMIT CONNECT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --text: #ffffff;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --gold: #c9a84c;
            --gold2: #e8c96a;
            --red: #f87171;
            --green: #10b981;
            --blue: #3b82f6;
            --amber: #f59e0b;
            --border: #334155;
            --border2: #2a2f45;
            --surface: #1e293b;
            --surface2: #111827;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --black: #0a0a0a;
            --white: #f0ede8;
            --muted: #64748b;
            --muted2: #94a3b8;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif; margin: 0;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 36px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo-text {
            color:var(--text); font-weight: 800; font-size: 1.8rem;
            margin-bottom: 24px; letter-spacing: 1px;
        }
        .logo-text span { color: var(--gold,#c9a84c); }
        .icon-big { font-size: 3rem; color:var(--green); margin-bottom: 16px; }
        .msg { color:var(--text-muted); font-size: 0.9rem; line-height: 1.6; }
        .link-muted { color:var(--text-dim); text-decoration: none; font-size: 0.85rem; }
        .link-muted:hover { color:var(--text-muted); }
    
        /* Visible input text — all browsers */
        input, select, textarea {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #c9a84c !important;
        }
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #1e293b inset !important;
        }
        input::placeholder { color: #64748b !important; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-text">LIMIT <span>CONNECT</span></div>
        <div class="icon-big"><i class="fas fa-envelope-circle-check"></i></div>
        <p class="msg">
            Ako postoji racun s unesenom email adresom, poslali smo vam link za resetiranje lozinke.
            Provjerite inbox i spam folder.
        </p>
        <div class="mt-4">
            <a href="{% url 'login' %}" class="link-muted"><i class="fas fa-arrow-left me-1"></i>Natrag na prijavu</a>
        </div>
    </div>
</body>
</html>
