<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roditeljski portal — {{ company.name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{background:#0d0d1a;font-family:Barlow,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.portal-box{background:#1a1a2e;border:1px solid #c8a24e33;border-radius:16px;padding:2.5rem;max-width:400px;width:100%;text-align:center}
.portal-box h2{color:#c8a24e;font-family:"Cormorant Garamond",serif;margin-bottom:.5rem}
.portal-box p{color:#888;font-size:.9rem}
.portal-box a.btn{background:#c8a24e;color:#1a1a2e;font-weight:600;padding:.6rem 2rem;border-radius:8px;text-decoration:none;display:inline-block;margin-top:1rem}
.portal-box a.btn:hover{background:#d4b05e}
.logo{font-size:2.5rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="portal-box">
  <div class="logo">🏫</div>
  <h2>{{ company.name }}</h2>
  <p>Roditeljski portal</p>
  <p style="color:#aaa;font-size:.85rem">Prijavite se kako biste vidjeli izvještaje, obavijesti i račune za vaše dijete.</p>
  <a href="/accounts/login/?next=/vrtic/{{ slug }}/portal/" class="btn">Prijava</a>
</div>
</body>
</html>
