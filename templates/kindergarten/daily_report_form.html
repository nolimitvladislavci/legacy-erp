{% extends "base.html" %}
{% load i18n %}
{% block title %}Dnevni izvještaj — Vrtić{% endblock %}
{% block page_title %}Dnevni izvještaj{% endblock %}
{% block extra_css %}
<style>
.kg-form{background:#1a1a2e;border:1px solid #c8a24e22;border-radius:10px;padding:1.5rem}
.kg-form label{color:#c8a24e;font-size:.85rem;font-weight:600;margin-bottom:.3rem}
.kg-form input,.kg-form select,.kg-form textarea{background:#16213e;color:#f0e6d3;border:1px solid #c8a24e33;border-radius:6px;padding:.5rem .8rem;width:100%}
.kg-form input:focus,.kg-form select:focus,.kg-form textarea:focus{border-color:#c8a24e;outline:none}
</style>
{% endblock %}
{% block content %}
<a href="{% url 'kindergarten:dashboard' %}" style="color:#c8a24e;font-size:.85rem"><i class="bi bi-arrow-left"></i> Dashboard</a>
<h2 style="color:#c8a24e;font-family:Cormorant Garamond,serif;margin:.5rem 0 1rem"><i class="bi bi-journal-text"></i> Dnevni izvještaj</h2>
<form method="post" class="kg-form">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-6">
      <label>Grupa *</label>
      <select name="group" required>{% for g in groups %}<option value="{{ g.pk }}">{{ g.name }}</option>{% endfor %}</select>
    </div>
    <div class="col-md-6">
      <label>Datum</label>
      <input type="date" name="date" value="{{ today|date:"Y-m-d" }}">
    </div>
    <div class="col-12">
      <label>Izvještaj *</label>
      <textarea name="content" rows="8" required placeholder="Što smo danas radili, učili, jeli... Roditelji vide ovo na portalu."></textarea>
    </div>
    <div class="col-12">
      <div class="form-check">
        <input type="checkbox" name="is_published" class="form-check-input" id="pub" checked>
        <label for="pub" style="color:#f0e6d3;font-weight:400">Objavi na roditeljskom portalu</label>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn" style="background:#c8a24e;color:#1a1a2e;font-weight:600"><i class="bi bi-check-lg"></i> Spremi izvještaj</button>
  </div>
</form>
{% endblock %}
