{% extends "base.html" %}
{% load i18n %}
{% block title %}Nova obavijest — Vrtić{% endblock %}
{% block page_title %}Nova obavijest{% endblock %}
{% block extra_css %}
<style>
.kg-form{background:#1a1a2e;border:1px solid #c8a24e22;border-radius:10px;padding:1.5rem}
.kg-form label{color:#c8a24e;font-size:.85rem;font-weight:600;margin-bottom:.3rem}
.kg-form input,.kg-form select,.kg-form textarea{background:#16213e;color:#f0e6d3;border:1px solid #c8a24e33;border-radius:6px;padding:.5rem .8rem;width:100%}
.kg-form input:focus,.kg-form select:focus,.kg-form textarea:focus{border-color:#c8a24e;outline:none}
</style>
{% endblock %}
{% block content %}
<a href="{% url 'kindergarten:dashboard' %}" style="color:#c8a24e;font-size:.85rem"><i class="bi bi-arrow-left"></i> Dashboard</a>
<h2 style="color:#c8a24e;font-family:Cormorant Garamond,serif;margin:.5rem 0 1rem"><i class="bi bi-megaphone"></i> Nova obavijest</h2>
<form method="post" class="kg-form">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-8"><label>Naslov *</label><input type="text" name="title" required></div>
    <div class="col-md-4">
      <label>Prioritet</label>
      <select name="priority"><option value="normal">Normalno</option><option value="important">Važno</option><option value="urgent">Hitno</option></select>
    </div>
    <div class="col-md-6">
      <label>Grupa (prazno = sve)</label>
      <select name="group"><option value="">Sve grupe</option>{% for g in groups %}<option value="{{ g.pk }}">{{ g.name }}</option>{% endfor %}</select>
    </div>
    <div class="col-12">
      <label>Sadržaj *</label>
      <textarea name="content" rows="5" required></textarea>
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn" style="background:#c8a24e;color:#1a1a2e;font-weight:600"><i class="bi bi-megaphone"></i> Objavi</button>
    <a href="{% url 'kindergarten:dashboard' %}" class="btn btn-outline-secondary ms-2">Odustani</a>
  </div>
</form>
{% endblock %}
