<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMIT Connect</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0a;
  color: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
}
.card {
  text-align: center;
  padding: 48px 40px;
  max-width: 440px;
  background: #141414;
  border: 1px solid #252830;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(201,168,76,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 24px;
}
h2 {
  color: #c9a84c;
  font-size: 1.3rem;
  margin: 0 0 12px;
  font-weight: 600;
}
p {
  color: #94a3b8;
  font-size: 0.92rem;
  line-height: 1.6;
  margin: 0 0 24px;
}
.btn {
  display: inline-block;
  background: #c9a84c;
  color: #000;
  padding: 12px 32px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.95rem;
  transition: background 0.2s;
}
.btn:hover { background: #b8963c; }
.sub {
  margin-top: 16px;
  font-size: 0.78rem;
  color: #64748b;
}
</style>
<script>
// Auto-redirect na početnu za 4 sekunde
setTimeout(function() { window.location.href = '/'; }, 4000);
</script>
</head>
<body>
<div class="card">
  <div class="icon">&#9888;</div>
  <h2>Ups, nešto je krenulo krivo</h2>
  <p>
    Dogodila se neočekivana greška. Tim je automatski obaviješten
    i već radi na rješenju.<br>
    Za par sekundi vraćamo vas na početnu.
  </p>
  <a href="/" class="btn">Natrag na početnu</a>
  <div class="sub">
    Ako se problem ponavlja, javite se na
    <strong>info@limit-connect.com</strong>
  </div>
</div>
</body>
</html>
