{% load i18n %}
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMIT Connect — Greska</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body{font-family:'Barlow',system-ui,sans-serif;background:#0a0a0a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{text-align:center;padding:40px;max-width:440px;background:#111827;border:1px solid #1e293b;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);margin:16px}
.icon{width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
h2{color:var(--gold,#c9a84c);font-size:1.3rem;margin:0 0 12px;font-weight:600}
p{color:#94a3b8;font-size:.9rem;line-height:1.6;margin:0 0 20px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:700;font-size:.9rem;transition:all .2s;border:none;cursor:pointer}
.btn-gold{background:var(--gold,#c9a84c);color:#000}.btn-gold:hover{background:#d4b55a}
.btn-ghost{background:transparent;border:1px solid #1e293b;color:#94a3b8}.btn-ghost:hover{border-color:var(--gold,#c9a84c);color:var(--gold,#c9a84c)}
#result{margin-top:12px;font-size:.78rem}
.sub{margin-top:16px;font-size:.72rem;color:#475569}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><i class="fas fa-exclamation-triangle" style="color:#ef4444"></i></div>
  <h2>Doslo je do greske</h2>
  <p>Tim je automatski obavijesten i vec radi na rjesenju. Mozete nastaviti rad na radnoj povrsini.</p>
  <div class="btns">
    <a href="{% url 'dashboard' %}" class="btn btn-gold"><i class="fas fa-home"></i> Radna povrsina</a>
    <button onclick="borgReport500()" class="btn btn-ghost"><i class="fas fa-flag" style="color:var(--gold,#c9a84c)"></i> Prijavi detalje</button>
  </div>
  <div id="result"></div>
  <div class="sub">
    Ako se problem ponavlja: <strong style="color:var(--gold,#c9a84c)">info@limit-connect.com</strong>
    ili <strong style="color:var(--gold,#c9a84c)">WhatsApp 097-609-1655</strong>
  </div>
</div>
<script>
function borgReport500(){
  var btn=event.target.closest('button');btn.disabled=true;btn.textContent='Saljem...';
  var msg=prompt('Sto ste radili kad se greska pojavila? (opcionalno)');
  fetch('/hr/ai-cockpit/api/signal/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    type:'bug',message:'500 greska'+(msg?' — '+msg:''),page_url:document.referrer||location.href,
    context:{type:'500',referrer:document.referrer,viewport:innerWidth+'x'+innerHeight}
  })}).then(r=>r.json()).then(d=>{
    document.getElementById('result').innerHTML=d.ok?'<span style="color:#22c55e">Hvala! BORG analizira vasu prijavu.</span>':'<span style="color:#ef4444">Greska pri slanju</span>';
    btn.textContent='Poslano';
  }).catch(()=>{document.getElementById('result').textContent='Greska mreze';btn.disabled=false;btn.textContent='Prijavi detalje';});
}
setTimeout(function(){window.location.href='/';},8000);
</script>
</body>
</html>
