{% extends "zeleni_otok/public_base.html" %}
{% load i18n %}
{% block extra_head %}
<meta name="csrf-token" content="{{ csrf_token }}">
{% endblock %}

{% block content %}
<section class="hero-section text-center" style="padding: 3rem 0 2.5rem;">
    <div class="container">
        <h1 class="display-6 fw-bold mb-2"><i class="fas fa-check-circle me-2"></i>R-1 Validator</h1>
        <p class="lead opacity-90">Provjerite ispravnost fiskalnog računa prema Zakonu o fiskalizaciji</p>
    </div>
</section>

<section class="py-5">
    <div class="container" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form hx-post="{% url 'zeleni_otok:r1_validate' %}"
                      hx-target="#r1-result"
                      hx-swap="innerHTML">
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">OIB prodavatelja *</label>
                            <input type="text" name="seller_oib" class="form-control" maxlength="11" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Naziv prodavatelja *</label>
                            <input type="text" name="seller_name" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Broj računa * <small class="text-muted">(BROJ/PP/NU)</small></label>
                            <input type="text" name="invoice_number" class="form-control" placeholder="1/1/1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Datum i vrijeme *</label>
                            <input type="datetime-local" name="date_time" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ukupni iznos (EUR) *</label>
                            <input type="number" name="total" class="form-control" step="0.01" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Način plaćanja *</label>
                            <select name="payment_method" class="form-select" required>
                                <option value="">— Odaberite —</option>
                                <option value="G">Gotovina (G)</option>
                                <option value="K">Kartica (K)</option>
                                <option value="T">Transakcijski račun (T)</option>
                                <option value="O">Ostalo (O)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">OIB operatera *</label>
                            <input type="text" name="operator_oib" class="form-control" maxlength="11" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">ZKI <small class="text-muted">(32 znaka)</small></label>
                            <input type="text" name="zki" class="form-control" maxlength="32">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">JIR <small class="text-muted">(UUID format)</small></label>
                            <input type="text" name="jir" class="form-control" maxlength="36">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-lc w-100">
                                <i class="fas fa-check-circle me-2"></i>Validiraj račun
                                <span class="htmx-indicator"><i class="fas fa-spinner fa-spin ms-2"></i></span>
                            </button>
                        </div>
                    </div>
                </form>
                
                <div id="r1-result" class="mt-4"></div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
