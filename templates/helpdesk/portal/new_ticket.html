{% load i18n %}
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novi tiket - {{ partner.name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--primary:#0f172a;--accent: #c9a84c;--bg:#f8fafc}
body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;margin:0;min-height:100vh}
.portal-header{background:var(--primary);color:var(--white);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.portal-header h1{font-size:1rem;margin:0;font-weight:700}.portal-header .accent{color:var(--accent)}
.portal-body{max-width:600px;margin:0 auto;padding:20px}
.card{background:var(--bg-card);border-radius:10px;border:1px solid var(--border);padding:16px;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:.85rem}
.form-group textarea{resize:vertical}
</style>
</head>
<body>
<div class="portal-header">
  <h1><i class="fas fa-headset"></i> <span class="accent">Podrska</span> - {{ partner.name }}</h1>
  <a href="{% url 'helpdesk_portal' token=token %}" class="btn btn-sm btn-outline-light fx-fs-body-sm"><i class="fas fa-arrow-left"></i> Natrag</a>
</div>
<div class="portal-body"><div class="card">
  <div class="fx-fw-bold fx-fs-lg mb-3"><i class="fas fa-plus-circle fx-text-gold"></i> Novi zahtjev za podrsku</div>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    <div class="form-group"><label>Naslov *</label><input type="text" name="subject" required maxlength="300" placeholder="Kratak opis problema"></div>
    <div class="form-group"><label>Kategorija</label><select name="category"><option value="delivery">Dostava</option><option value="quality">Kvaliteta robe</option><option value="invoice">Racun/Faktura</option><option value="pos">POS/Blagajna</option><option value="technical">Tehnicki problem</option><option value="complaint">Reklamacija</option><option value="other" selected>Ostalo</option></select></div>
    <div class="fx-gap-3 d-grid fx-grid-2-equal">
      <div class="form-group"><label>Kontakt osoba</label><input type="text" name="contact_name" maxlength="200"></div>
      <div class="form-group"><label>Email</label><input type="email" name="contact_email" maxlength="254"></div>
    </div>
    <div class="form-group"><label>Opis *</label><textarea name="description" rows="6" required placeholder="Opisite problem ili zahtjev..."></textarea></div>
    <div class="form-group"><label>Prilog (opcionalno)</label>
      <button type="button" onclick="if(window.FenixCamera){FenixCamera.quick('helpdesk-new-preview',{onReady:function(r){document.getElementById('helpdesk_photo_b64').value=r.b64}})}else{document.getElementById('helpdesk-file-input').click()}" class="fx-rounded fx-pointer fx-fs-base mb-2 fx-text-cyan" style="background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);padding:.5rem 1rem">📷 Kamera</button>
      <div id="helpdesk-new-preview" class="fx-hidden" style="margin:.5rem 0"></div>
      <input type="hidden" name="photo_b64" id="helpdesk_photo_b64">
      <input type="file" name="attachment" id="helpdesk-file-input"></div>
    <div class="d-flex fx-gap-2 justify-content-end mt-3">
      <a href="{% url 'helpdesk_portal' token=token %}" class="btn btn-outline-secondary btn-sm">Odustani</a>
      <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-paper-plane"></i> Posalji</button>
    </div>
  </form>
</div></div>
</body></html>
