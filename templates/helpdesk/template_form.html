{% extends "base.html" %}
{% load i18n %}
{% block title %}Novi predlozak{% endblock %}
{% block page_title %}Novi predlozak{% endblock %}
{% block extra_css %}
<!-- responsive: fenix-tokens.css -->
{% endblock %}
{% block content %}
<style>
.stat-card{background:var(--bg-card);border-radius:10px;padding:16px;border:1px solid var(--border);margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:.85rem}
.form-group textarea{resize:vertical}
</style>
<a href="{% url 'helpdesk:list' %}" class="fx-fs-compact fx-text-dim fx-no-underline"><i class="fas fa-arrow-left"></i> Natrag</a>
<div class="fenix-stat fx-mt-10" style="max-width:600px">
  <div class="fx-fw-bold fx-fs-lg mb-3"><i class="fas fa-file-alt fx-text-gold"></i> Novi predlozak</div>
  <form method="post">{% csrf_token %}
    <div class="form-group"><label>Naziv *</label><input type="text" name="name" required maxlength="200"></div>
    <div class="form-group"><label>Kategorija</label><select name="category"><option value="delivery">Dostava</option><option value="quality">Kvaliteta robe</option><option value="invoice">Racun/Faktura</option><option value="pos">POS/Blagajna</option><option value="technical">Tehnicki problem</option><option value="complaint">Reklamacija</option><option value="other" selected>Ostalo</option></select></div>
    <div class="form-group"><label>Tekst *</label><textarea name="body" rows="8" required placeholder="Tekst predloska..."></textarea></div>
    <div class="d-flex fx-gap-2 justify-content-end"><a href="{% url 'helpdesk:list' %}" class="btn btn-outline-secondary btn-sm">Odustani</a><button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-check"></i> Spremi</button></div>
  </form>
</div>
{% endblock %}
