{% extends "base.html" %}
{% load i18n %}
{% block title %}Link iskoristen{% endblock %}
{% block content %}
<div class="text-center fx-p-20" style="max-width:500px;margin:80px auto">
  <div class="mb-3" style="font-size:4rem">&#10003;</div>
  <h2 class="fx-text-green mb-3" style="font-weight:900">{% trans "Narudzba vec kreirana" %}</h2>
  <p class="fx-fs-normal" style="color:var(--text-muted, #94a3b8)">
    {% trans "Ovaj link je vec iskoristen." %}
    {% if order %}
    {% trans "Narudzba" %}: <strong class="fx-text-gold">{{ order.order_number }}</strong>
    {% endif %}
  </p>
</div>
{% endblock %}
