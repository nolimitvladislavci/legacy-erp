{% extends "base.html" %}
{% load i18n %}
{% block title %}Link iskoristen{% endblock %}
{% block content %}
<div style="max-width:500px;margin:80px auto;text-align:center;padding:20px;">
  <div style="font-size:4rem;margin-bottom:16px;">&#10003;</div>
  <h2 style="font-weight:900;color:#22c55e;margin-bottom:12px;">{% trans "Narudzba vec kreirana" %}</h2>
  <p style="color:var(--text-muted, #94a3b8);font-size:.95rem;">
    {% trans "Ovaj link je vec iskoristen." %}
    {% if order %}
    {% trans "Narudzba" %}: <strong style="color:var(--gold,#c9a84c);">{{ order.order_number }}</strong>
    {% endif %}
  </p>
</div>
{% endblock %}
