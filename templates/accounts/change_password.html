{% extends 'base.html' %}
{% load i18n %}
{% block title %}Promjena lozinke{% endblock %}
{% block page_title %}🔑 Promjena lozinke{% endblock %}
{% block content %}
<!-- lang: topbar -->

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="fx-fs-sm fx-fw-bold fx-text-muted d-block fx-uppercase" style="letter-spacing:.06em;margin-bottom:.35rem">{% trans "Nova lozinka" %}</label>
        <div class="fx-relative"><div class="pwd-wrap"><input type="password" id="new_password1" name="new_password1" class="form-control" placeholder="{% trans "Min. 10 znakova" %}" required minlength="10" autofocus><button type="button" class="pwd-eye" onclick="togglePwd('new_password1',this)">👁</button></div><button type="button" onclick="togglePassword('new_password1', this)" class="fx-border-none fx-pointer fx-bg-transparent" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px">👁</button></div>
      </div>
      <div class="fx-mb-6">
        <label class="fx-fs-sm fx-fw-bold fx-text-muted d-block fx-uppercase" style="letter-spacing:.06em;margin-bottom:.35rem">{% trans "Potvrdi lozinku" %}</label>
        <div class="fx-relative"><div class="pwd-wrap"><input type="password" id="new_password2" name="new_password2" class="form-control" placeholder="{% trans "Ponovite lozinku" %}" required minlength="10"><button type="button" class="pwd-eye" onclick="togglePwd('new_password2',this)">👁</button></div><button type="button" onclick="togglePassword('new_password2', this)" class="fx-border-none fx-pointer fx-bg-transparent" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px">👁</button></div>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-bold">{% trans "🔑 Spremi novu lozinku" %}</button>
    </form>
  </div>

  <div class="text-center mt-3">
    <a href="javascript:history.back()" class="fx-text-muted fx-fs-base fx-no-underline">{% trans "← Natrag" %}</a>
  </div>
</div>
{% endblock %}

<script>
function togglePassword(fieldId, btn) {
    var f = document.getElementById(fieldId);
    if (f.type === 'password') {
        f.type = 'text';
        btn.innerHTML = '🙈';
    } else {
        f.type = 'password';
        btn.innerHTML = '👁';
    }
}
</script>
<script>
function togglePwd(id,btn){
    var f=document.getElementById(id);
    if(!f)return;
    f.type=f.type==='password'?'text':'password';
    btn.textContent=f.type==='password'?'👁':'🙈';
}
</script>
