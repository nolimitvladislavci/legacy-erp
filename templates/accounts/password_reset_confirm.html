{% extends 'base.html' %}
{% load i18n %}
{% block title %}Nova lozinka – LIMIT CONNECT{% endblock %}
{% block page_title %}Postavite novu lozinku{% endblock %}
{% block content %}
<!-- lang: see topbar -->

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="fenix-stat">
      {% if messages %}{% for msg in messages %}<div class="alert alert-{% if 'error' in msg.tags %}danger{% else %}success{% endif %}">{{ msg }}</div>{% endfor %}{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label fw-bold">{% trans "Nova lozinka" %}</label>
          <div class="pwd-wrap"><input type="password" id="pwd_6" name="password1" class="form-control" placeholder="{% trans "Min. 10 znakova" %}" required><button type="button" class="pwd-eye" onclick="togglePwd('pwd_6',this)">👁</button></div></div>
        <div class="mb-3"><label class="form-label fw-bold">{% trans "Ponovi lozinku" %}</label>
          <div class="pwd-wrap"><input type="password" id="pwd_7" name="password2" class="form-control" required><button type="button" class="pwd-eye" onclick="togglePwd('pwd_7',this)">👁</button></div></div>
        <button type="submit" class="btn btn-primary w-100">{% trans "✓ Spremi novu lozinku" %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

<script>
function togglePwd(id,btn){
    var f=document.getElementById(id);
    if(!f)return;
    f.type=f.type==='password'?'text':'password';
    btn.textContent=f.type==='password'?'👁':'🙈';
}
</script>
