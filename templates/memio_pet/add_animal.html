<!DOCTYPE html>
<html lang="hr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodaj ljubimca — Memio.pet</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f8f6f0;--surface:#ffffff;--ink:#1a1a2e;--ink2:#3d3d52;--gold:#c9a84c;--line:#ddd9cc;--dim:#7a7a8c;--green:#28a745;--red:#dc3545;--top-bar:#1a1a2e;--top-text:#f8f6f0;--shadow:rgba(0,0,0,.06);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Space Grotesk',system-ui,sans-serif}
[data-theme="dark"]{--bg:#0f1012;--surface:#18191d;--ink:#edeae2;--ink2:#a09890;--gold:#e2c36d;--line:#2a2b30;--dim:#5a5b65;--green:#34d058;--red:#f87171;--top-bar:#09090b;--top-text:#edeae2;--shadow:rgba(0,0,0,.35)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;transition:background .25s,color .25s}
.top-bar{background:var(--top-bar);color:var(--top-text);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.top-bar-logo{color:var(--gold);text-decoration:none;font-family:var(--serif);font-size:1.25rem;font-weight:700}
.top-bar-logo span{color:var(--top-text)}
.theme-toggle{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:5px 11px;cursor:pointer;font-size:.95rem;color:var(--top-text);line-height:1;display:flex;align-items:center}
.container{max-width:600px;margin:0 auto;padding:28px 16px}
.card{background:var(--surface);border-radius:14px;box-shadow:0 2px 16px var(--shadow);margin-bottom:20px;overflow:hidden}
.card-body{padding:22px 24px}
.section-title{font-family:var(--serif);font-size:1.3rem;font-weight:700;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:.9rem;font-family:var(--sans);transition:border-color .2s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border-radius:8px;font-size:.88rem;font-weight:600;text-decoration:none;border:none;cursor:pointer;transition:all .2s;font-family:var(--sans)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{opacity:.85}
.btn-outline{background:none;border:1px solid var(--line);color:var(--ink)}.btn-outline:hover{border-color:var(--gold)}
.msg{padding:10px 14px;border-radius:8px;font-size:.82rem;margin-bottom:10px}
.msg.error{background:rgba(220,53,69,.12);border:1px solid rgba(220,53,69,.3);color:var(--red)}
.msg.success{background:rgba(40,167,69,.12);border:1px solid rgba(40,167,69,.3);color:var(--green)}
.photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px;display:none}
.page-footer{text-align:center;padding:28px 16px;font-size:.76rem;color:var(--dim)}
.page-footer a{color:var(--gold);text-decoration:none}
@media(max-width:500px){
  .field-row{grid-template-columns:1fr}
  .container{padding:20px 12px}
}
</style>
<script>
(function(){var s=localStorage.getItem('memio-theme');var d=window.matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));})();
</script>
</head>
<body>

<div class="top-bar">
  <a href="{% url 'memio_pet:breeder_dashboard' %}" class="top-bar-logo">Memio<span>.pet</span></a>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="{% url 'memio_pet:breeder_dashboard' %}" style="color:var(--top-text);text-decoration:none;font-size:.82rem">← Natrag</a>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
</div>

<div class="container">

  {% if messages %}
  <div style="margin-bottom:16px">
    {% for msg in messages %}
    <div class="msg {{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <div class="card">
    <div class="card-body">
      <h1 class="section-title">🐾 Dodaj ljubimca</h1>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="field">
          <label>Ime ljubimca</label>
          <input type="text" name="name" placeholder="Rex, Bella, Luna..." required autofocus>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Vrsta</label>
            <select name="vrsta">
              {% for val, label in vrsta_choices %}
              <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label>Spol</label>
            <select name="spol">
              {% for val, label in spol_choices %}
              <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="field">
          <label>Pasmina</label>
          <input type="text" name="breed" placeholder="Njemački ovčar, Labrador...">
        </div>

        <div class="field-row">
          <div class="field">
            <label>Mikročip broj</label>
            <input type="text" name="chip_number" placeholder="191000000123456" inputmode="numeric">
          </div>
          <div class="field">
            <label>Datum rođenja</label>
            <input type="date" name="date_of_birth">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Težina (kg)</label>
            <input type="number" name="weight_kg" step="0.1" min="0" placeholder="25.5">
          </div>
          <div class="field">
            <label>Boja / šara</label>
            <input type="text" name="color_description" placeholder="Crno-smeđa">
          </div>
        </div>

        <div class="field">
          <label>Fotografija</label>
          <input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)">
          <img id="photoPreview" class="photo-preview">
        </div>

        <div style="display:flex;gap:10px;margin-top:20px">
          <button type="submit" class="btn btn-gold">Spremi ljubimca</button>
          <a href="{% url 'memio_pet:breeder_dashboard' %}" class="btn btn-outline">Odustani</a>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="page-footer">
  <a href="/">Memio.pet</a> — Digitalni dom za tvog ljubimca<br>
  © 2026 <a href="https://limit-connect.com" style="color:var(--gold);text-decoration:none">Konjik d.o.o.</a> & NO LIMIT udruga
</div>

<script>
function previewPhoto(input){
  var img=document.getElementById('photoPreview');
  if(input.files&&input.files[0]){
    var reader=new FileReader();
    reader.onload=function(e){img.src=e.target.result;img.style.display='block';};
    reader.readAsDataURL(input.files[0]);
  }
}
(function(){var t=document.documentElement.getAttribute('data-theme')||'light';var btn=document.getElementById('themeBtn');if(btn)btn.textContent=t==='dark'?'☀️':'🌙';})();
function toggleTheme(){var h=document.documentElement;var c=h.getAttribute('data-theme')||'light';var n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('memio-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';}
</script>
</body>
</html>
