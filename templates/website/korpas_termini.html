<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezerviraj termin — Korpaš Servis | Vladislavci</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#0e1a14;--green:#1a3d2b;--green2:#2d6a47;--gold: #c9a84c;--white:#fff}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
a{text-decoration:none;color:var(--gold)}
.back{display:inline-flex;align-items:center;gap:.5rem;padding:1.2rem 1.5rem;font-size:.82rem;color:rgba(255,255,255,.5);transition:color .2s}
.back:hover{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:1rem 1.5rem 4rem}
.hero-mini{text-align:center;padding:2rem 0 2.5rem}
.hero-mini .icon{width:64px;height:64px;border-radius:18px;background:rgba(45,106,71,.2);border:1px solid rgba(45,106,71,.4);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#4ade80;margin:0 auto 1rem}
.hero-mini h1{font-size:1.8rem;font-weight:900;margin-bottom:.4rem}
.hero-mini p{font-size:.9rem;color:rgba(255,255,255,.5)}
.form-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:2rem}
.form-group{margin-bottom:1.25rem}
label{display:block;font-size:.78rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.75rem 1rem;color:var(--white);font-size:.9rem;font-family:inherit;transition:border-color .2s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:rgba(201,168,76,.05)}
select option{background:#1a2a1a;color:var(--white)}
textarea{resize:vertical;min-height:80px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn-submit{width:100%;padding:1rem;background:linear-gradient(135deg,var(--green2),var(--green));border:none;border-radius:12px;color:var(--white);font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.5rem}
.btn-submit:hover{background:linear-gradient(135deg,#3d8a5a,#2d6a47);transform:translateY(-1px);box-shadow:0 6px 20px rgba(45,106,71,.35)}
.success{display:none;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:16px;padding:2rem;text-align:center;margin-top:1rem}
.success i{font-size:2.5rem;color:#22c55e;margin-bottom:1rem;display:block}
.success h3{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}
.success p{font-size:.85rem;color:rgba(255,255,255,.6)}
.info-strip{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.info-item{flex:1;min-width:140px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1rem;text-align:center}
.info-item i{color:var(--gold);margin-bottom:.4rem;display:block}
.info-item span{font-size:.78rem;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<a href="/korpas/" class="back"><i class="fas fa-arrow-left"></i> Korpaš Grupa</a>
<div class="wrap">
  <div class="hero-mini">
    <div class="icon"><i class="fas fa-wrench"></i></div>
    <h1>Rezerviraj termin</h1>
    <p>Korpaš Servis — Vladislavci · Pon–Pet 08–17h · Sub 08–13h</p>
  </div>

  <div class="info-strip">
    <div class="info-item"><i class="fas fa-clock"></i><span>Potvrda u 2h</span></div>
    <div class="info-item"><i class="fas fa-car"></i><span>Osobna i teretna</span></div>
    <div class="info-item"><i class="fas fa-phone"></i><span>+385 91 391 2621</span></div>
  </div>

  <div class="form-card" id="formCard">
    <form id="terminForm">
      {% csrf_token %}
      <div class="form-group">
        <label>Ime i prezime</label>
        <input type="text" name="ime" placeholder="Vaše ime" required>
      </div>
      <div class="form-group">
        <label>Telefon</label>
        <input type="tel" name="telefon" placeholder="+385..." required>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Vrsta vozila</label>
          <select name="vrsta_vozila" required>
            <option value="">— odaberi —</option>
            <option value="osobno">Osobno vozilo</option>
            <option value="teretno">Teretno vozilo</option>
            <option value="kombi">Kombi / Van</option>
            <option value="ostalo">Ostalo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Usluga</label>
          <select name="usluga" required>
            <option value="">— odaberi —</option>
            <option value="vulkanizacija">Vulkanizacija</option>
            <option value="mehanika">Mehanička dijagnostika</option>
            <option value="obd">OBD dijagnostika</option>
            <option value="ulje">Zamjena ulja i filtera</option>
            <option value="registracija">Priprema za registraciju</option>
            <option value="ugradnja">Ugradnja opreme</option>
            <option value="ostalo">Ostalo</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>Datum</label>
          <input type="date" name="datum" required>
        </div>
        <div class="form-group">
          <label>Vrijeme</label>
          <select name="vrijeme" required>
            <option value="">— odaberi —</option>
            <option>08:00</option><option>08:30</option><option>09:00</option>
            <option>09:30</option><option>10:00</option><option>10:30</option>
            <option>11:00</option><option>11:30</option><option>12:00</option>
            <option>13:00</option><option>13:30</option><option>14:00</option>
            <option>14:30</option><option>15:00</option><option>15:30</option>
            <option>16:00</option><option>16:30</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Napomena (neobavezno)</label>
        <textarea name="napomena" placeholder="Opis problema, model vozila..."></textarea>
      </div>
      <button type="submit" class="btn-submit"><i class="fas fa-calendar-check"></i> Pošalji zahtjev za termin</button>
    </form>
  </div>

  <div class="success" id="successMsg">
    <i class="fas fa-check-circle"></i>
    <h3>Termin primljen!</h3>
    <p>Kontaktirat ćemo vas u roku 2 sata za potvrdu termina.<br>Hvala što koristite Korpaš Servis.</p>
  </div>
</div>

<script>
document.getElementById('terminForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const data = new FormData(this);
  const csrfToken = data.get('csrfmiddlewaretoken');
  const payload = {};
  data.forEach((v, k) => { if(k !== 'csrfmiddlewaretoken') payload[k] = v; });

  try {
    const r = await fetch('/korpas/termini/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
      body: JSON.stringify(payload)
    });
    if (r.ok) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    }
  } catch(err) {
    alert('Greška pri slanju. Pokušajte ponovo ili nazovite +385 91 391 2621.');
  }
});

// Set min date to today
const dateInput = document.querySelector('input[name="datum"]');
if(dateInput) dateInput.min = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
