{% extends "base.html" %}
{% block shell_mode %}focus{% endblock %}
{% load i18n %}
{% block title %}Nova sekcija{% endblock %}
{% block extra_css %}
<!-- responsive: fenix-tokens.css -->
{% endblock %}
{% block content %}
<div class="fx-m-auto" style="max-width:600px">
<div class="d-flex justify-content-between align-items-center fx-mb-6">
  <h4 class="fx-text-gold fx-m-0"><i class="fas fa-layer-group"></i> Nova sekcija</h4>
  <a href="{% url 'udruge:sekcija_list' %}" class="btn btn-ghost btn-sm">Odustani</a>
</div>

<div class="card fx-p-5">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Naziv sekcije *</label>
      <input type="text" name="name" required placeholder="Npr. Tamburaski sastav, Seniori, Kadeti..." class="fx-w-full fx-rounded-sm fx-fs-md fx-text-body fx-bg-dark fx-b fx-p-5-75">
    </div>
    <div class="mb-3">
      <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Opis</label>
      <textarea name="description" rows="3" placeholder="Opis sekcije..." class="fx-w-full fx-rounded-sm fx-fs-md fx-text-body fx-bg-dark fx-b fx-p-5-75" style="resize:vertical"></textarea>
    </div>
    <div class="fx-mb-6">
      <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Max clanova (0 = neograniceno)</label>
      <input type="number" name="max_members" value="0" min="0" class="fx-rounded-sm fx-fs-md fx-text-body fx-bg-dark fx-b fx-p-5-75" style="width:120px">
    </div>
    <button type="submit" class="btn btn-gold fx-w-full">Kreiraj sekciju</button>
  </form>
</div>
</div>
{% endblock %}
