{% extends "base.html" %}
{% block title %}{% if golub %}Uredi goluba{% else %}Novi golub{% endif %}{% endblock %}
{% block content %}
<div class="container-fluid" style="max-width:700px">
<h2 class="mb-3"><i class="fas fa-dove"></i> {% if golub %}Uredi goluba: {{ golub.prsten_broj }}{% else %}Novi golub{% endif %}</h2>
<form method="post" enctype="multipart/form-data" class="card bg-dark border-secondary">{% csrf_token %}<div class="card-body">
<div class="mb-3"><label class="form-label">Golubinjak</label>
  <select name="golubinjak" required class="form-select bg-dark text-light border-secondary">
    <option value="">-- Odaberi golubinjak --</option>
    {% for gj in golubinjaci %}<option value="{{ gj.pk }}" {% if golub.golubinjak_id == gj.pk or selected_golubinjak == gj.pk %}selected{% endif %}>{{ gj.naziv }}</option>{% endfor %}
  </select></div>
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">Broj prstena</label><input type="text" name="prsten_broj" value="{{ golub.prsten_broj|default:'' }}" required class="form-control bg-dark text-light border-secondary" placeholder="HR-2026-12345"></div>
  <div class="col-md-6"><label class="form-label">Naziv</label><input type="text" name="naziv" value="{{ golub.naziv|default:'' }}" class="form-control bg-dark text-light border-secondary" placeholder="Ime goluba"></div>
</div>
<div class="row mb-3">
  <div class="col-md-4"><label class="form-label">Spol</label>
    <select name="spol" required class="form-select bg-dark text-light border-secondary">
      {% for code, label in spol_choices %}<option value="{{ code }}" {% if golub.spol == code %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Boja</label>
    <select name="boja" class="form-select bg-dark text-light border-secondary">
      <option value="">-- Boja --</option>
      {% for code, label in boja_choices %}<option value="{{ code }}" {% if golub.boja == code %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Datum izliježanja</label><input type="date" name="datum_izlijeganja" value="{{ golub.datum_izlijeganja|date:'Y-m-d'|default:'' }}" class="form-control bg-dark text-light border-secondary"></div>
</div>
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">Otac</label>
    <select name="otac" class="form-select bg-dark text-light border-secondary">
      <option value="">-- Otac --</option>
      {% for m in muzjaci %}<option value="{{ m.pk }}" {% if golub.otac_id == m.pk %}selected{% endif %}>{{ m.prsten_broj }} — {{ m.naziv|default:"" }}</option>{% endfor %}
    </select></div>
  <div class="col-md-6"><label class="form-label">Majka</label>
    <select name="majka" class="form-select bg-dark text-light border-secondary">
      <option value="">-- Majka --</option>
      {% for z in zenke %}<option value="{{ z.pk }}" {% if golub.majka_id == z.pk %}selected{% endif %}>{{ z.prsten_broj }} — {{ z.naziv|default:"" }}</option>{% endfor %}
    </select></div>
</div>

<!-- FOTOGRAFIJA — mobilna kamera + file upload -->
<div class="mb-3">
  <label class="form-label"><i class="fas fa-camera"></i> Fotografija goluba</label>
  {% if golub.fotografija %}
  <div class="mb-2"><img src="{{ golub.fotografija.url }}" class="rounded border border-secondary" style="max-height:150px"></div>
  {% endif %}
  <div class="d-flex gap-2 flex-wrap">
    <label class="btn btn-outline-warning mb-0" style="cursor:pointer">
      <i class="fas fa-camera"></i> Slikaj kamerom
      <input type="file" name="fotografija" accept="image/*" capture="environment" class="d-none" onchange="previewImg(this)">
    </label>
    <label class="btn btn-outline-secondary mb-0" style="cursor:pointer">
      <i class="fas fa-folder-open"></i> Iz galerije
      <input type="file" name="fotografija" accept="image/*" class="d-none" onchange="previewImg(this)">
    </label>
  </div>
  <div id="img-preview" class="mt-2"></div>
</div>

<div class="mb-3"><label class="form-label">Napomena</label><textarea name="napomena" rows="3" class="form-control bg-dark text-light border-secondary">{{ golub.napomena|default:'' }}</textarea></div>
</div><div class="card-footer d-flex justify-content-between">
<a href="{% url 'udruge:golub_list' %}" class="btn btn-outline-secondary">Odustani</a>
<button type="submit" class="btn btn-warning">{% if golub %}Spremi izmjene{% else %}Spremi goluba{% endif %}</button></div></form></div>

<script>
function previewImg(input) {
  if (input.files && input.files[0]) {
    // Disable the other file input so only one is submitted
    var allInputs = document.querySelectorAll('input[name="fotografija"]');
    allInputs.forEach(function(inp) { if (inp !== input) inp.value = ''; });

    var reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('img-preview').innerHTML =
        '<img src="' + e.target.result + '" class="rounded border border-warning" style="max-height:200px">' +
        '<br><small class="text-success mt-1 d-block"><i class="fas fa-check"></i> Fotografija učitana</small>';
    };
    reader.readAsDataURL(input.files[0]);
  }
}
</script>
{% endblock %}
