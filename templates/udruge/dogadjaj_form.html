{% extends "base.html" %}
{% block shell_mode %}focus{% endblock %}
{% load i18n %}
{% block title %}Novi dogadjaj{% endblock %}
{% block extra_css %}
<!-- responsive: fenix-tokens.css -->
{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="{% url 'udruge:dogadjaj_list' %}" class="fx-fs-base fx-no-underline fx-text-gold">&laquo; Svi dogadjaji</a>
</div>
<h4 class="fx-text-gold" style="margin:0 0 1rem">Novi dogadjaj</h4>

<form method="post">
  {% csrf_token %}
  <div class="card mb-3 fx-p-4">
    <div class="d-grid fx-gap-3 fx-grid-2-equal">
      <div class="fx-col-full">
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Naziv *</label>
        <input type="text" name="name" required class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Tip</label>
        <select name="event_type" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          {% for val, lbl in type_choices %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Status</label>
        <select name="status" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          {% for val, lbl in status_choices %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Pocetak *</label>
        <input type="datetime-local" name="start_date" required class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Kraj</label>
        <input type="datetime-local" name="end_date" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Lokacija</label>
        <input type="text" name="location" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Online link</label>
        <input type="url" name="online_url" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Max polaznika (0=neogr.)</label>
        <input type="number" name="max_attendees" value="0" min="0" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Budzet (EUR)</label>
        <input type="number" name="budget" value="0" step="0.01" min="0" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Cijena ulaznice (EUR)</label>
        <input type="number" name="ticket_price" value="0" step="0.01" min="0" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div class="d-flex align-items-center fx-col-full fx-p-5-0" style="gap:1.5rem">
        <label class="fx-fs-base d-flex fx-text-body align-items-center fx-gap-1">
          <input type="checkbox" name="is_free" checked> Besplatan
        </label>
        <label class="fx-fs-base d-flex fx-text-body align-items-center fx-gap-1">
          <input type="checkbox" name="registration_required"> Prijava obavezna
        </label>
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Rok za prijavu</label>
        <input type="datetime-local" name="registration_deadline" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Povezana kampanja</label>
        <select name="kampanja" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          <option value="">-- Bez kampanje --</option>
          {% for k in kampanje %}<option value="{{ k.pk }}">{{ k.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="fx-col-full">
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Opis</label>
        <textarea name="description" rows="4" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b" style="resize:vertical"></textarea>
      </div>
      <div class="fx-col-full">
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Napomene</label>
        <textarea name="notes" rows="2" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b" style="resize:vertical"></textarea>
      </div>
    </div>
  </div>
  <div class="d-flex fx-gap-2">
    <button type="submit" class="btn btn-gold">Spremi dogadjaj</button>
    <a href="{% url 'udruge:dogadjaj_list' %}" class="btn btn-ghost">Odustani</a>
  </div>
</form>
{% endblock %}
