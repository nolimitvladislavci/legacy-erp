{% extends "base.html" %}
{% load i18n %}
{% block title %}Nova stavka — Knjiga primitaka{% endblock %}
{% block content %}
<style>
    .form-card { max-width: 640px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
    .form-card h1 { font-size: 1.3rem; margin: 0 0 24px; color: var(--gold, var(--gold,#c9a84c)); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); color: var(--text); font-size: 0.9rem; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn-gold { background: var(--gold,#c9a84c); color:var(--text); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; width: 100%; }
    .btn-gold:hover { background: #b8943f; }
    .btn-back { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
</style>

<div class="form-card">
    <a href="{% url 'udruge:knjiga_primitaka' %}" class="btn-back"><i class="fas fa-arrow-left"></i> Natrag na knjigu</a>
    <h1><i class="fas fa-book"></i> Nova stavka</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label>Datum *</label>
                <input type="date" name="datum" required>
            </div>
            <div class="form-group">
                <label>Iznos (EUR) *</label>
                <input type="number" name="iznos" step="0.01" min="0.01" required placeholder="100.00">
            </div>
        </div>
        <div class="form-group">
            <label>Opis *</label>
            <input type="text" name="opis" required placeholder="Opis stavke...">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Vrsta *</label>
                <select name="vrsta" required>
                    {% for val, label in vrsta_choices %}
                    <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Izvor *</label>
                <select name="izvor" required>
                    {% for val, label in izvor_choices %}
                    <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Broj dokumenta</label>
            <input type="text" name="dokument" placeholder="npr. UPL-001/2026">
        </div>
        <div class="form-group">
            <label>Napomena</label>
            <textarea name="napomena" placeholder="Dodatne napomene..."></textarea>
        </div>
        <div class="mt-3">
          <label class="fx-fw-semibold fx-fs-base fx-text-gold">Prilog (fotografija)</label>
          <div id="knjiga-photo-preview" class="fx-hidden" style="margin:.5rem 0"></div>
          <button type="button" onclick="if(window.FenixCamera)FenixCamera.quick('knjiga-photo-preview',{onReady:function(r){document.getElementById('knjiga_photo_b64').value=r.b64}})" class="fx-rounded fx-pointer fx-fs-base fx-text-gold" style="background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);padding:.5rem 1rem">📷 Fotografiraj dokument</button>
          <input type="hidden" name="photo_b64" id="knjiga_photo_b64">
        </div>
        <button type="submit" class="btn-gold"><i class="fas fa-save"></i> Spremi stavku</button>
    </form>
</div>

{% endblock %}
