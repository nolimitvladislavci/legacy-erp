{% extends "base.html" %}
{% load i18n %}
{% block title %}Nova kampanja{% endblock %}
{% block extra_css %}
<!-- responsive: fenix-tokens.css -->
{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="{% url 'udruge:kampanja_list' %}" class="fx-fs-base fx-no-underline fx-text-gold">&laquo; Sve kampanje</a>
</div>
<h4 class="fx-text-gold" style="margin:0 0 1rem">Nova kampanja</h4>

<form method="post">
  {% csrf_token %}
  <div class="card mb-3 fx-p-4">
    <div class="d-grid fx-gap-3 fx-grid-2-equal">
      <div class="fx-col-full">
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Naziv *</label>
        <input type="text" name="name" required class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Tip kampanje</label>
        <select name="campaign_type" id="campaign_type" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          {% for val, lbl in type_choices %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Status</label>
        <select name="status" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          {% for val, lbl in status_choices %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Pocetak *</label>
        <input type="date" name="start_date" required class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Kraj</label>
        <input type="date" name="end_date" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Financijski cilj (EUR)</label>
        <input type="number" name="goal_amount" value="0" step="0.01" min="0" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>
      <div>
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Cilj clanova</label>
        <input type="number" name="goal_members" value="0" min="0" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
      </div>

      <!-- EU Fond fields (shown/hidden by JS) -->
      <div id="eu_fields" class="fx-hidden fx-bt fx-mt-2 fx-col-full" style="padding-top:.75rem">
        <div class="fx-fs-note fx-text-blue fx-fw-semibold mb-2">EU Fond polja</div>
        <div class="d-grid fx-gap-3 fx-grid-2-equal">
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Sifra EU projekta</label>
            <input type="text" name="eu_project_code" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          </div>
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">EU program (ESF+, ERDF...)</label>
            <input type="text" name="eu_program" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          </div>
        </div>
      </div>

      <div class="fx-col-full">
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Opis</label>
        <textarea name="description" rows="4" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b" style="resize:vertical"></textarea>
      </div>
      <div class="fx-col-full">
        <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Napomene</label>
        <textarea name="notes" rows="2" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b" style="resize:vertical"></textarea>
      </div>
    </div>
  </div>
  <div class="d-flex fx-gap-2">
    <button type="submit" class="btn btn-gold">Spremi kampanju</button>
    <a href="{% url 'udruge:kampanja_list' %}" class="btn btn-ghost">Odustani</a>
  </div>
</form>

<script>
document.getElementById('campaign_type').addEventListener('change', function(){
  document.getElementById('eu_fields').style.display = this.value === 'eu_fond' ? 'block' : 'none';
});
</script>
{% endblock %}
