{% extends "base.html" %}
{% load i18n %}
{% block title %}Nova email kampanja{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="{% url 'udruge:email_kampanja_list' %}" class="fx-fs-base fx-no-underline fx-text-gold">&laquo; Sve email kampanje</a>
</div>
<h4 class="fx-text-gold" style="margin:0 0 1rem">Nova email kampanja</h4>

<form method="post" id="emailForm">
  {% csrf_token %}
  <div class="d-grid fx-gap-4 fx-grid-2-equal">
    <!-- Left: Form -->
    <div>
      <div class="card mb-3 fx-p-4">
        <h5 class="fx-fs-base fx-text-gold" style="margin:0 0 .75rem">Osnovno</h5>
        <div class="d-grid fx-gap-3">
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Naziv kampanje *</label>
            <input type="text" name="name" required class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          </div>
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Tip</label>
            <select name="email_type" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
              {% for val, lbl in type_choices %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Predmet emaila *</label>
            <input type="text" name="subject" required class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
          </div>
        </div>
      </div>

      <div class="card mb-3 fx-p-4">
        <h5 class="fx-fs-base fx-text-gold" style="margin:0 0 .75rem">Targeting</h5>
        <div class="d-grid fx-gap-3">
          <label class="fx-fs-base d-flex fx-text-body align-items-center fx-gap-1">
            <input type="checkbox" name="target_all_members" checked> Svi aktivni clanovi s emailom ({{ member_count }})
          </label>
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Vezana kampanja</label>
            <select name="target_kampanja" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
              <option value="">-- Bez veze --</option>
              {% for k in kampanje %}<option value="{{ k.pk }}">{{ k.name }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Vezani dogadjaj</label>
            <select name="target_dogadjaj" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b">
              <option value="">-- Bez veze --</option>
              {% for d in dogadjaji %}<option value="{{ d.pk }}">{{ d.name }} ({{ d.start_date|date:"d.m.Y" }})</option>{% endfor %}
            </select>
          </div>
        </div>
      </div>

      <div class="card mb-3 fx-p-4">
        <div class="d-flex justify-content-between align-items-center fx-mb-4">
          <h5 class="fx-fs-base fx-text-gold fx-m-0">Sadrzaj</h5>
          <button type="submit" name="ai_generate" value="1" class="btn btn-ghost btn-sm fx-text-gold" style="border-color:var(--gold)">AI Generiraj sadrzaj</button>
        </div>
        <div class="d-grid fx-gap-3">
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">HTML sadrzaj</label>
            <textarea name="body_html" id="body_html" rows="10" class="fx-w-full fx-rounded-sm fx-fs-note fx-text-body fx-p-2 fx-bg-dark fx-b fx-font-mono" style="resize:vertical"></textarea>
          </div>
          <div>
            <label class="fx-fs-body-sm fx-text-muted d-block mb-1">Tekst verzija (fallback)</label>
            <textarea name="body_text" rows="4" class="fx-w-full fx-rounded-sm fx-fs-body fx-text-body fx-p-2 fx-bg-dark fx-b" style="resize:vertical"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Preview -->
    <div>
      <div class="card fx-p-4" style="position:sticky;top:1rem">
        <h5 class="fx-fs-base fx-text-gold" style="margin:0 0 .75rem">Pregled</h5>
        <div id="preview" class="fx-rounded-sm fx-text-dark fx-fs-body fx-bg-card fx-p-4" style="min-height:300px">
          <p class="fx-text-muted text-center" style="margin-top:3rem">Unesite HTML sadrzaj za pregled...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex fx-gap-2 mt-3">
    <button type="submit" class="btn btn-gold">Spremi kao nacrt</button>
    <a href="{% url 'udruge:email_kampanja_list' %}" class="btn btn-ghost">Odustani</a>
  </div>
</form>

<script>
document.getElementById('body_html').addEventListener('input', function(){
  document.getElementById('preview').innerHTML = this.value || '<p class="fx-text-muted text-center" style="margin-top:3rem">Unesite HTML sadrzaj za pregled...</p>';
});
</script>
{% endblock %}
