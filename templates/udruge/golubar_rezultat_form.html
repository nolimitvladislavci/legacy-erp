{% extends "base.html" %}
{% block title %}Dodaj rezultat{% endblock %}
{% block content %}
<div class="container-fluid" style="max-width:700px">
<h2 class="mb-3"><i class="fas fa-trophy"></i> Dodaj rezultat</h2>
<div class="card bg-dark border-secondary mb-3"><div class="card-body">
  <div style="font-size:.72rem;text-transform:uppercase;color:#c9a84c;margin-bottom:.5rem;letter-spacing:.05em">Utrka</div>
  <div style="font-size:.85rem">
    <strong style="color:#c9a84c">{{ utrka.naziv }}</strong>
    &nbsp;|&nbsp;
    <span class="text-muted">Datum:</span> {{ utrka.datum|date:"d.m.Y" }}
    &nbsp;|&nbsp;
    <span class="text-muted">Udaljenost:</span> {{ utrka.udaljenost_km }} km
  </div>
</div></div>
<form method="post" class="card bg-dark border-secondary">{% csrf_token %}<div class="card-body">
<div class="mb-3"><label class="form-label">Golub</label>
  <select name="golub" required class="form-select bg-dark text-light border-secondary">
    <option value="">-- Odaberi goluba --</option>
    {% for g in golubovi %}<option value="{{ g.pk }}">{{ g.prsten_broj }} — {{ g.naziv|default:"" }}</option>{% endfor %}
  </select></div>
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">Plasman</label><input type="number" name="placiranje" min="1" required class="form-control bg-dark text-light border-secondary"></div>
  <div class="col-md-6"><label class="form-label">Plasman ukupno</label><input type="number" name="placiranje_ukupno" min="1" class="form-control bg-dark text-light border-secondary"></div>
</div>
<div class="row mb-3">
  <div class="col-md-4"><label class="form-label">Brzina (m/min)</label><input type="number" name="brzina_mpm" step="0.01" class="form-control bg-dark text-light border-secondary"></div>
  <div class="col-md-4"><label class="form-label">Vrijeme dolaska</label><input type="datetime-local" name="vrijeme_dolaska" class="form-control bg-dark text-light border-secondary"></div>
  <div class="col-md-4"><label class="form-label">Bodovi</label><input type="number" name="bodovi" step="0.01" class="form-control bg-dark text-light border-secondary"></div>
</div>
</div><div class="card-footer d-flex justify-content-between">
<a href="{% url 'udruge:golubar_utrka_detail' utrka.pk %}" class="btn btn-outline-secondary">Odustani</a>
<button type="submit" class="btn btn-warning">Spremi rezultat</button></div></form></div>
{% endblock %}
