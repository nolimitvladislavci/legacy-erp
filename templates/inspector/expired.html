{% load i18n %}
<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Token istekao</title>
<style>body{font-family:system-ui;background:#0f0f0f;color:#e5e5e5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{text-align:center;max-width:400px;padding:3rem}.box h1{color:var(--red);font-size:4rem;margin-bottom:1rem}
.box p{color:var(--text-muted);font-size:1.1rem;line-height:1.6}</style>
</head><body><div class="box">
<h1><i class="fas fa-lock"></i></h1>
<h2 class="fx-text-red">Pristup istekao</h2>
<p>Ovaj inspekcijski link vise nije valjan. Kontaktirajte firmu za novi QR kod.</p>
<p class="fx-fs-base fx-text-dim mt-3">Token: ...{{ token.token|truncatechars:12 }}<br>Istekao: {{ token.expires_at|date:"d.m.Y H:i" }}</p>
</div></body></html>
