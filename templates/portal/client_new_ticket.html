{% extends "portal/base_b2b.html" %}

{% block title %}Novi tiket — Klijentski Portal{% endblock %}

{% block content %}
<div class="flex-between mb-3">
  <h1 style="font-family:var(--font-heading);font-size:1.4rem;color:var(--gold);font-weight:700">
    <i class="fas fa-plus-circle" style="font-size:1rem;opacity:.6;margin-right:8px"></i>
    Novi tiket za podršku
  </h1>
  <a href="{% url 'client_portal:dashboard' token %}" class="btn btn-ghost btn-sm">
    <i class="fas fa-arrow-left"></i> Natrag
  </a>
</div>

<div class="b2b-card" style="max-width:640px">
  <form method="post">
    {% csrf_token %}

    <div class="mb-2">
      <label class="b2b-label" for="subject">Naslov *</label>
      <input type="text" name="subject" id="subject" class="b2b-input" required
             placeholder="Kratki opis problema ili zahtjeva" maxlength="200">
    </div>

    <div class="mb-2">
      <label class="b2b-label" for="category">Kategorija</label>
      <select name="category" id="category" class="b2b-select">
        {% for code, label in categories %}
        <option value="{{ code }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-2">
      <label class="b2b-label" for="priority">Prioritet</label>
      <select name="priority" id="priority" class="b2b-select">
        <option value="low">Nizak</option>
        <option value="normal" selected>Normalan</option>
        <option value="high">Visok</option>
        <option value="urgent">Hitno</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="b2b-label" for="description">Opis *</label>
      <textarea name="description" id="description" class="b2b-textarea" required
                placeholder="Detaljno opišite problem ili zahtjev..."
                style="min-height:140px"></textarea>
    </div>

    <div class="flex gap-1">
      <button type="submit" class="btn btn-gold">
        <i class="fas fa-paper-plane"></i> Pošalji tiket
      </button>
      <a href="{% url 'client_portal:dashboard' token %}" class="btn btn-ghost">Odustani</a>
    </div>
  </form>
</div>
{% endblock %}
