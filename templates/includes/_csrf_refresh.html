<script>
/* ── FENIX CSRF — Jednostavno i pouzdano ──────────────────────
   1. Na form submit injektiraj token iz cookiea
   2. Svakih 8 min tiho osvježi token u pozadini
   3. HTMX i fetch dobiju X-CSRFToken header
   NIKAD ne blokiraj form submit. NIKAD preventDefault.
   ──────────────────────────────────────────────────────────── */
(function(){
  function getCsrf(){
    var m=document.cookie.match(/csrftoken=([^;]+)/);
    return m?m[1]:'';
  }
  function setCsrf(token){
    document.cookie='csrftoken='+token+';path=/;SameSite=Lax';
    document.querySelectorAll('[name=csrfmiddlewaretoken]').forEach(function(el){
      el.value=token;
    });
  }

  // 1. Na SVAKI form submit — sinkrono injektiraj svjež token
  document.addEventListener('submit', function(e){
    var csrfInput = e.target.querySelector('[name=csrfmiddlewaretoken]');
    if(csrfInput) csrfInput.value = getCsrf();
  }, true);

  // 2. Tihi refresh svakih 8 minuta (ne blokira ništa)
  setInterval(function(){
    if(document.hidden) return;
    fetch('/api/csrf-token/',{credentials:'same-origin'})
      .then(function(r){return r.json();})
      .then(function(d){ if(d.token) setCsrf(d.token); })
      .catch(function(){});
  }, 8*60*1000);

  // 3. HTMX header
  document.addEventListener('htmx:configRequest', function(e){
    e.detail.headers['X-CSRFToken'] = getCsrf();
  });

  // 4. Fetch interceptor
  var _fetch = window.fetch;
  window.fetch = function(url, opts){
    opts = opts || {};
    if(opts.method && opts.method.toUpperCase() !== 'GET'){
      opts.headers = opts.headers || {};
      if(!opts.headers['X-CSRFToken']) opts.headers['X-CSRFToken'] = getCsrf();
    }
    return _fetch(url, opts);
  };
})();
</script>
