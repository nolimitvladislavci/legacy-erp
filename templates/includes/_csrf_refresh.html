<script>
/* ── FENIX CSRF AUTO-REFRESH ─────────────────────────────────────
   1. Svakih 8 minuta tiho osvježi token (session traje 12h)
   2. Interceptira fetch() i XMLHttpRequest — pri csrf_error retry
   3. Na svaki form submit injektira svjež token
   ──────────────────────────────────────────────────────────────── */
(function(){
  function getCsrf(){
    var m=document.cookie.match(/csrftoken=([^;]+)/);
    return m?m[1]:'';
  }

  function setCsrf(token){
    document.cookie='csrftoken='+token+';path=/;SameSite=Lax';
    document.querySelectorAll('[name=csrfmiddlewaretoken]').forEach(function(el){
      el.value=token;
    });
  }

  function showTokenToast(){
    var t=document.createElement('div');
    t.textContent='✅ Token ponovno učitan';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);'
      +'background:#166534;color:#4ade80;padding:8px 20px;border-radius:20px;'
      +'font-size:.78rem;font-weight:600;z-index:99999;opacity:0;'
      +'transition:all .35s;pointer-events:none;white-space:nowrap;'
      +'border:1px solid rgba(74,222,128,.3);';
    document.body.appendChild(t);
    requestAnimationFrame(function(){
      t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
    });
    setTimeout(function(){
      t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';
      setTimeout(function(){document.body.removeChild(t);},400);
    },2500);
  }

  function refreshToken(cb,silent){
    fetch('/api/csrf-token/',{credentials:'same-origin'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.token){
          setCsrf(d.token);
          if(!silent) showTokenToast();
          if(cb) cb(d.token);
        }
      })
      .catch(function(){});
  }

  // 1. Refresh svakih 8 minuta dok je tab aktivan
  setInterval(function(){
    if(!document.hidden) refreshToken(null,true);
  }, 8*60*1000);

  // 2. Na form submit — injektiraj svjež token u hidden input
  document.addEventListener('submit', function(e){
    var form = e.target;
    var csrfInput = form.querySelector('[name=csrfmiddlewaretoken]');
    if(csrfInput){
      csrfInput.value = getCsrf();
    }
  }, true);

  // 3. HTMX — osvježi token prije svakog requesta
  document.addEventListener('htmx:configRequest', function(e){
    e.detail.headers['X-CSRFToken'] = getCsrf();
  });

  // 4. Interceptiraj fetch — pri csrf_error auto-retry
  var _fetch = window.fetch;
  window.fetch = function(url, opts){
    opts = opts || {};
    if(opts.method && opts.method.toUpperCase() !== 'GET'){
      opts.headers = opts.headers || {};
      if(!opts.headers['X-CSRFToken']){
        opts.headers['X-CSRFToken'] = getCsrf();
      }
    }
    return _fetch(url, opts).then(function(resp){
      if(resp.status === 200){
        // Provjeri je li csrf_error JSON
        var ct = resp.headers.get('content-type')||'';
        if(ct.includes('application/json')){
          return resp.clone().json().then(function(d){
            if(d && d.csrf_error && d.new_token){
              setCsrf(d.new_token);
              showTokenToast();
              // Retry isti request s novim tokenom
              opts.headers['X-CSRFToken'] = d.new_token;
              return _fetch(url, opts);
            }
            return resp;
          }).catch(function(){ return resp; });
        }
      }
      return resp;
    });
  };
})();
</script>
