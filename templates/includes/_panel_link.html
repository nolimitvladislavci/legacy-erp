<a href="{{ href }}" style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border,#334155);border-radius:7px;text-decoration:none;color:var(--text,#e2e8f0);font-size:.82rem;font-weight:600;transition:border-color .15s" onmouseover="this.style.borderColor='var(--gold,#c9a84c)'" onmouseout="this.style.borderColor='var(--border,#334155)'">
  <i class="fas {{ icon }}" style="width:14px;color:var(--gold,#c9a84c)"></i>{{ label }}
</a>
