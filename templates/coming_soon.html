{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ module_name }} — Uskoro{% endblock %}
{% block page_title %}{{ module_name }}{% endblock %}
{% block content %}
<div class="stat-card text-center py-5" style="max-width:600px;margin:40px auto">
  <i class="{{ module_icon }}" style="font-size:3.5rem;color:var(--gold);margin-bottom:20px;display:block"></i>
  <h3 style="font-family:'Cormorant Garamond',serif;font-weight:400;margin-bottom:12px">{{ module_name }}</h3>
  <p class="text-muted" style="font-size:.95rem;line-height:1.6">
    {{ module_description }}
  </p>
  <div style="margin-top:24px;padding:12px 20px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);display:inline-block">
    <i class="fas fa-tools" style="color:var(--gold);margin-right:8px"></i>
    <span style="font-size:.82rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--gold)">U pripremi — Sprint 2</span>
  </div>
</div>
{% endblock %}
