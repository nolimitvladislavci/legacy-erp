{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ module_name }} — Uskoro{% endblock %}
{% block page_title %}{{ module_name }}{% endblock %}
{% block content %}
<div class="stat-card text-center py-5" style="max-width:600px;margin:40px auto">
  <i class="{{ module_icon }} fx-text-gold mb-4 d-block" style="font-size:3.5rem"></i>
  <h3 class="fx-fw-normal mb-3" style="font-family:'Cormorant Garamond',serif">{{ module_name }}</h3>
  <p class="text-muted fx-fs-normal fx-lh-normal">
    {{ module_description }}
  </p>
  <div class="mt-4 d-inline-block" style="padding:12px 20px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2)">
    <i class="fas fa-tools fx-text-gold fx-mr-3"></i>
    <span class="fx-fs-note fx-fw-semibold fx-text-gold fx-uppercase fx-ls-1">U pripremi — Sprint 2</span>
  </div>
</div>
{% endblock %}
