{% extends 'base.html' %}
{% block shell_mode %}focus{% endblock %}
{% load i18n %}
{% block extra_css %}
<!-- responsive: fenix-tokens.css -->
{% endblock %}
{% block content %}
<!-- lang: see topbar -->

<div class="fenix-stat">
    <h4><i class="fas fa-plus-circle me-2"></i>{% trans "Novi račun" %}</h4>
    <form method="post" action="{% url 'invoicing:invoice_save' %}">
        {% csrf_token %}
        <div class="row mt-4">
            <div class="col-md-8 mb-3">
                <label class="form-label fw-bold">{% trans "Naziv klijenta" %}</label>
                <input type="text" name="client_name" class="form-control" required placeholder="{% trans "VODOCOMP d.o.o." %}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label fw-bold">{% trans "Datum" %}</label>
                <input type="date" name="date_issued" class="form-control" value="{% now 'Y-m-d' %}">
            </div>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">{% trans "Spremi i nastavi" %}</button>
            <a href="{% url 'invoicing:index' %}" class="btn btn-outline-secondary">{% trans "Odustani" %}</a>
        </div>
    </form>
</div>
{% endblock %}
