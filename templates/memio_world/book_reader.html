{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ lang|default:'hr' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>{{ title }} — PLAY.EU</title>
<meta name="theme-color" content="#2c1810">
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=MedievalSharp&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   PLAY.EU BOOK READER v2 — "Budućnost, ne poljski WC"
   Codex layout: slika lijevo, tekst desno, rukopisni font
   Per-page zvučnik (TTS) + mikrofon (snimanje)
   ═══════════════════════════════════════════════════════════════ */

:root {
  --parchment: #f5e6c8;
  --parchment-light: #faf3e3;
  --parchment-dark: #e8d4a8;
  --ink: #2c1810;
  --ink-light: #6b5a4e;
  --ink-faded: #9c8a7a;
  --gold: #c9a84c;
  --gold-glow: rgba(201,168,76,.35);
  --gold-dark: #8b6914;
  --spine: #5c3d1a;
  --red-accent: #8b2500;
  --page-shadow: rgba(44,24,16,.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a120a;
  color: var(--ink);
  font-family: 'MedievalSharp', 'Cormorant Garamond', Georgia, serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ═══ TOP BAR ═══ */
.top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 16px;
  background: rgba(0,0,0,.7); backdrop-filter: blur(10px);
  z-index: 50; flex-shrink: 0;
}
.top .brand {
  color: var(--gold); font-weight: 700; font-size: .85rem;
  letter-spacing: 1px; font-family: 'Space Grotesk', sans-serif;
  text-decoration: none;
}
.top .controls { display: flex; gap: 6px; align-items: center; }
.top .btn {
  background: none; border: 1px solid rgba(255,255,255,.15); color: #ccc;
  padding: 4px 10px; border-radius: 6px; font-size: .75rem; cursor: pointer;
  transition: .15s; font-family: 'Space Grotesk', sans-serif;
}
.top .btn:hover, .top .btn.active { border-color: var(--gold); color: var(--gold); }

/* ═══ PROGRESS BAR ═══ */
.progress-bar { height: 3px; background: rgba(201,168,76,.15); flex-shrink: 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); transition: width .5s; }

/* ═══ CODEX CONTAINER ═══ */
.codex-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 12px; position: relative; overflow: hidden;
}

/* Open book — two facing pages */
.codex {
  display: flex; width: min(96vw, 1100px); height: min(82vh, 720px);
  border-radius: 6px; overflow: hidden;
  box-shadow:
    0 0 0 2px var(--gold-dark),
    0 8px 40px rgba(0,0,0,.5),
    0 2px 15px rgba(0,0,0,.3),
    inset 0 0 60px var(--page-shadow);
  position: relative;
  transition: opacity .4s;
}

/* Spine shadow in center */
.codex::after {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 30px;
  transform: translateX(-50%); z-index: 5; pointer-events: none;
  background: linear-gradient(90deg,
    transparent, rgba(44,24,16,.15) 30%,
    rgba(44,24,16,.25) 50%,
    rgba(44,24,16,.15) 70%, transparent);
}

/* Left page = illustration */
.codex-left {
  width: 50%; height: 100%; position: relative; overflow: hidden;
  background: var(--parchment-dark);
  border-right: 1px solid rgba(44,24,16,.1);
}
.codex-left img {
  width: 100%; height: 100%; object-fit: cover;
  transition: opacity .5s;
}
/* Placeholder when no image */
.codex-left .placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(145deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  color: var(--ink-faded); font-size: 4rem;
}
.codex-left .placeholder .pl-label {
  font-size: .9rem; margin-top: 12px;
  font-family: 'MedievalSharp', serif; color: var(--ink-faded);
}
/* Decorative border on image side */
.codex-left::after {
  content: ''; position: absolute; inset: 12px; pointer-events: none;
  border: 1px solid rgba(201,168,76,.2); border-radius: 2px;
}

/* Right page = text */
.codex-right {
  width: 50%; height: 100%; overflow: hidden;
  background: var(--parchment);
  display: flex; flex-direction: column;
  position: relative;
  /* Subtle parchment texture via gradient */
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(245,230,200,.5) 0%, transparent 70%),
    linear-gradient(180deg, var(--parchment-light) 0%, var(--parchment) 40%, var(--parchment-dark) 100%);
}

/* Page edge shadow (like real book pages) */
.codex-right::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 20px;
  background: linear-gradient(90deg, rgba(44,24,16,.08), transparent);
  z-index: 2; pointer-events: none;
}

/* Text content area */
.codex-text {
  flex: 1; overflow-y: auto; padding: 2.5rem 2rem 1rem 2.5rem;
  scrollbar-width: thin; scrollbar-color: var(--gold-dark) transparent;
}
.codex-text::-webkit-scrollbar { width: 4px; }
.codex-text::-webkit-scrollbar-track { background: transparent; }
.codex-text::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }

/* ═══ MANUSCRIPT TEXT STYLING ═══ */
.codex-text p {
  font-family: 'MedievalSharp', 'Cormorant Garamond', Georgia, serif;
  font-size: 1.35rem;
  line-height: 2;
  color: var(--ink);
  margin-bottom: .8em;
  text-indent: 1.5em;
  letter-spacing: .02em;
  text-align: justify;
  hyphens: auto;
}
.codex-text p:first-child { text-indent: 0; }

/* Drop cap — velika inicijala kao u srednjovjekovnim rukopisima */
.codex-text p:first-child::first-letter {
  font-family: 'Uncial Antiqua', 'MedievalSharp', cursive;
  font-size: 4.5rem;
  float: left;
  line-height: .75;
  margin: 4px 12px 0 0;
  color: var(--red-accent);
  text-shadow: 1px 1px 0 rgba(201,168,76,.4);
}

/* Page number */
.codex-page-num {
  text-align: center; padding: 8px; font-size: .8rem;
  color: var(--ink-faded); font-family: 'Uncial Antiqua', serif;
  letter-spacing: 2px;
}

/* ═══ PAGE TOOLS (speaker + mic) ═══ */
.page-tools {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; padding: 8px 16px;
  border-top: 1px solid rgba(44,24,16,.08);
  background: rgba(245,230,200,.5);
  flex-shrink: 0;
}

.tool-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1.5px solid var(--gold-dark);
  background: var(--parchment-light);
  color: var(--ink);
  font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
  position: relative;
}
.tool-btn:hover {
  background: var(--gold);
  color: #fff;
  box-shadow: 0 2px 12px var(--gold-glow);
  transform: scale(1.08);
}
.tool-btn.active {
  background: var(--gold);
  color: #fff;
  animation: pulse-glow 1.5s infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 var(--gold-glow); }
  50% { box-shadow: 0 0 0 8px rgba(201,168,76,0); }
}

.tool-btn .tool-label {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: .6rem; white-space: nowrap; color: var(--ink-faded);
  font-family: 'Space Grotesk', sans-serif; opacity: 0; transition: .2s;
}
.tool-btn:hover .tool-label { opacity: 1; }

/* Voice selector mini-dropdown */
.voice-select {
  font-size: .72rem; padding: 3px 8px; border-radius: 6px;
  border: 1px solid rgba(44,24,16,.2); background: var(--parchment-light);
  color: var(--ink); font-family: 'Space Grotesk', sans-serif;
  cursor: pointer;
}

/* Recording indicator */
.rec-indicator {
  width: 8px; height: 8px; border-radius: 50%;
  background: #d32f2f; display: none;
  animation: rec-blink 1s infinite;
}
.rec-indicator.on { display: inline-block; }
@keyframes rec-blink {
  0%, 100% { opacity: 1; } 50% { opacity: .3; }
}

/* ═══ COVER PAGE ═══ */
.codex.is-cover .codex-left { display: none; }
.codex.is-cover .codex-right { width: 100%; }

.cover-inner {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 3rem 2rem; text-align: center;
  background: linear-gradient(145deg, #2c1810 0%, #4a2c1a 40%, #2c1810 100%);
  position: relative; overflow: hidden;
}
.cover-inner::before {
  content: ''; position: absolute; inset: 16px;
  border: 2px solid rgba(201,168,76,.35); border-radius: 4px;
  pointer-events: none;
}
.cover-inner::after {
  content: ''; position: absolute; inset: 20px;
  border: 1px solid rgba(201,168,76,.15); border-radius: 3px;
  pointer-events: none;
}
.cover-bg {
  position: absolute; inset: 0; object-fit: cover; opacity: .12;
}
.cover-ornament {
  font-size: 2rem; color: var(--gold); opacity: .6; margin-bottom: 1rem;
  letter-spacing: 12px;
}
.cover-title {
  font-family: 'Uncial Antiqua', 'MedievalSharp', cursive;
  font-size: 2.8rem; font-weight: 400; color: var(--parchment);
  line-height: 1.2; margin-bottom: .5rem;
  text-shadow: 0 2px 12px rgba(0,0,0,.5);
  animation: fadeUp .8s ease-out both;
}
.cover-author {
  font-family: 'MedievalSharp', serif;
  font-size: 1.1rem; color: var(--gold); font-style: italic;
  margin-bottom: 2rem; animation: fadeUp .8s .2s ease-out both;
}
.cover-open {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  color: var(--parchment); border: none;
  padding: 16px 48px; border-radius: 12px;
  font-size: 1.15rem; font-weight: 700; cursor: pointer;
  font-family: 'Uncial Antiqua', serif;
  letter-spacing: 1px;
  box-shadow: 0 4px 24px var(--gold-glow);
  transition: .25s; animation: fadeUp .8s .4s ease-out both;
}
.cover-open:hover { transform: scale(1.06); box-shadow: 0 6px 36px var(--gold-glow); }
.cover-badges {
  display: flex; gap: 8px; margin-top: 1.5rem; flex-wrap: wrap;
  justify-content: center; animation: fadeUp .8s .6s ease-out both;
}
.cover-badge {
  font-size: .7rem; padding: 4px 12px; border-radius: 12px;
  border: 1px solid rgba(201,168,76,.35); color: var(--gold);
  font-family: 'Space Grotesk', sans-serif;
}

/* ═══ NAVIGATION ═══ */
.nav-arrows {
  position: absolute; inset: 0; display: flex;
  pointer-events: none; z-index: 10;
}
.nav-prev, .nav-next {
  flex: 1; display: flex; align-items: center; pointer-events: auto;
  cursor: pointer; padding: 0 8px; opacity: 0; transition: opacity .25s;
}
.nav-prev:hover, .nav-next:hover { opacity: 1; }
.nav-prev { justify-content: flex-start; }
.nav-next { justify-content: flex-end; }
.nav-arrow {
  width: 44px; height: 44px;
  background: rgba(0,0,0,.55); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--gold); font-size: 1.4rem;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(201,168,76,.2);
  transition: .2s;
}
.nav-arrow:hover {
  background: rgba(0,0,0,.7); border-color: var(--gold);
}

/* ═══ AUDIO BAR (global story audio) ═══ */
.audio-bar {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: rgba(0,0,0,.7); backdrop-filter: blur(10px); flex-shrink: 0;
}
.audio-btn {
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  color: var(--parchment); border: none;
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: .15s;
}
.audio-btn:hover { transform: scale(1.08); }
.audio-progress {
  flex: 1; height: 4px; background: rgba(255,255,255,.1);
  border-radius: 2px; cursor: pointer; position: relative;
}
.audio-progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width .1s; }
.audio-time { font-size: .72rem; color: #999; font-family: 'Space Grotesk', sans-serif; min-width: 60px; text-align: right; }
.audio-narrator { font-size: .72rem; color: var(--gold); font-family: 'Space Grotesk', sans-serif; }
.audio-bar.hidden { display: none; }

/* ═══ PAGE TRANSITION ═══ */
.codex.page-turning { opacity: 0; transition: opacity .25s; }
.codex.page-entering { opacity: 0; animation: codexEnter .4s .05s ease-out forwards; }
@keyframes codexEnter {
  from { opacity: 0; transform: translateX(8px); }
  to { opacity: 1; transform: none; }
}

/* ═══ FULLSCREEN ═══ */
.fullscreen-active .top { position: absolute; top: 0; left: 0; right: 0; opacity: 0; transition: opacity .3s; z-index: 50; }
.fullscreen-active .top:hover { opacity: 1; }
.fullscreen-active .codex { width: 100vw; height: 100dvh; border-radius: 0; }

/* ═══ RESPONSIVE — Mobile ═══ */
@media (max-width: 768px) {
  .codex {
    flex-direction: column;
    width: 100vw; height: calc(100dvh - 90px);
    border-radius: 0;
  }
  .codex::after { display: none; }
  .codex-left {
    width: 100%; height: 38%;
    border-right: none; border-bottom: 1px solid rgba(44,24,16,.1);
  }
  .codex-left::after { inset: 6px; }
  .codex-right { width: 100%; height: 62%; }
  .codex-right::before { display: none; }
  .codex-text {
    padding: 1.5rem 1.2rem .8rem 1.4rem;
  }
  .codex-text p {
    font-size: 1.2rem;
    line-height: 1.85;
  }
  .codex-text p:first-child::first-letter {
    font-size: 3.5rem;
  }
  .cover-title { font-size: 2rem; }
  .codex.is-cover .codex-left { display: none; }
  .codex.is-cover .codex-right { width: 100%; height: 100%; }
  .nav-prev, .nav-next { opacity: .4; }
  .codex-wrap { padding: 0; }
  .page-tools { gap: 8px; padding: 6px 12px; }
  .tool-btn { width: 36px; height: 36px; font-size: .95rem; }
}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: none; }
}

/* ═══ PhD UPGRADE — ambijent, particles, drop-cap, shadows ═══ */

/* Ambient glow */
.ambient-glow {
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 30%, rgba(201,168,76,.04) 0%, transparent 70%);
}
.ambient-glow::after {
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 80%, rgba(139,97,20,.03) 0%, transparent 50%);
  animation:ambPulse 8s ease-in-out infinite alternate;
}
@keyframes ambPulse { 0%{opacity:.3} 100%{opacity:.8} }

/* Floating particles — fireflies */
.firefly {
  position:fixed;width:3px;height:3px;border-radius:50%;
  background:var(--gold);opacity:0;pointer-events:none;z-index:1;
  animation:flyUp linear infinite;
}
@keyframes flyUp {
  0%{opacity:0;transform:translateY(0) scale(.5)}
  15%{opacity:.5}
  85%{opacity:.3}
  100%{opacity:0;transform:translateY(-35vh) scale(0)}
}

/* Drop cap */
.drop-cap::first-letter {
  float:left;font-size:3.4em;line-height:.78;font-weight:700;
  color:var(--gold);margin:.04em .14em 0 0;
  font-family:"Cormorant Garamond",serif;
  text-shadow:1px 1px 0 rgba(201,168,76,.15);
}

/* Paper grain overlay */
.codex::after {
  content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  background:url("data:image/svg+xml,%3Csvg xmlns=\x27http://www.w3.org/2000/svg\x27 width=\x274\x27 height=\x274\x27%3E%3Ccircle cx=\x272\x27 cy=\x272\x27 r=\x27.3\x27 fill=\x27%232c1810\x27 fill-opacity=\x27.015\x27/%3E%3C/svg%3E");
  mix-blend-mode:multiply;border-radius:inherit;
}

/* Book spine highlight */
.codex-spine::after {
  content:"";position:absolute;top:5%;bottom:5%;left:50%;width:1px;
  background:linear-gradient(180deg,transparent,var(--gold-dark),transparent);
  opacity:.15;
}

/* Night mode */
body.night-mode { --parchment:#1e1a14;--parchment-light:#252018;--parchment-dark:#151210;--ink:#d4c4a0;--ink-light:#b8a888 }
body.night-mode .codex { box-shadow:0 0 40px rgba(0,0,0,.8) }

/* Print */
@media print {
  body{background:#fff}
  .top,.audio-bar,.progress-bar,.ambient-glow,.firefly,.codex-spine{display:none!important}
  .codex{box-shadow:none;width:100%;height:auto}
}
</style>
</head>
<body id="bookBody">
<div class="ambient-glow"></div>

<!-- Top Bar -->
<div class="top" id="topBar">
  <a href="{% url 'memio_world:story_list' %}" class="brand">🏰 PLAY.EU</a>
  <div class="controls">
    {% for lc in languages %}
    <button class="btn lang-btn {% if lc == lang %}active{% endif %}" data-lang="{{ lc }}" onclick="switchLang('{{ lc }}')">
      {{ lc|upper }}
    </button>
    {% endfor %}
    <button class="btn" onclick="toggleNight()" title="Noćni mod">☽</button>
    <button class="btn" onclick="toggleAutoNext()" id="btnAuto" title="Auto-čitanje">▶▶</button>
    <button class="btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
  </div>
</div>

<!-- Progress -->
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<!-- Codex (open book) -->
<div class="codex-wrap" id="codexWrap">
  <div class="codex" id="codex">
    <!-- Left page: illustration -->
    <div class="codex-left" id="codexLeft">
      <div class="placeholder" id="imgPlaceholder">
        <span>🖼</span>
        <span class="pl-label">{% trans "Ilustracija uskoro" %}</span>
      </div>
      <img id="codexImg" src="" alt="" style="display:none;" loading="eager">
    </div>
    <!-- Right page: text -->
    <div class="codex-right" id="codexRight">
      <div class="codex-text" id="codexText"></div>
      <div class="codex-page-num" id="pageNum"></div>
      <div class="page-tools" id="pageTools">
        <button class="tool-btn" id="btnSpeak" onclick="speakPage()" title="{% trans 'Čitaj naglas' %}">
          🔊
          <span class="tool-label">{% trans "Čitaj" %}</span>
        </button>
        <button class="tool-btn" id="btnMic" onclick="toggleRecording()" title="{% trans 'Snimi svoj glas' %}">
          🎤
          <span class="tool-label">{% trans "Snimi" %}</span>
        </button>
        <span class="rec-indicator" id="recDot"></span>
        <button class="tool-btn" id="btnPlayRec" onclick="playRecording()" title="{% trans 'Preslušaj snimku' %}" style="display:none;">
          🔁
          <span class="tool-label">{% trans "Preslušaj" %}</span>
        </button>
        <select class="voice-select" id="voiceSelect" onchange="onVoiceChange()">
          <option value="tts">{% trans "Generički glas" %}</option>
          <option value="baka">{% trans "Baka čita" %} 👵</option>
          <option value="djed">{% trans "Djed čita" %} 👴</option>
          <option value="mama">{% trans "Mama čita" %} 👩</option>
          <option value="tata">{% trans "Tata čita" %} 👨</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Navigation arrows -->
  <div class="nav-arrows">
    <div class="nav-prev" onclick="prevPage()"><div class="nav-arrow">‹</div></div>
    <div class="nav-next" onclick="nextPage()"><div class="nav-arrow">›</div></div>
  </div>
</div>

<!-- Global Audio Player (for pre-recorded full narration) -->
<div class="audio-bar {% if not has_audio %}hidden{% endif %}" id="audioBar">
  <button class="audio-btn" id="audioPlayBtn" onclick="toggleGlobalAudio()">▶</button>
  <div class="audio-progress" onclick="seekGlobalAudio(event)">
    <div class="audio-progress-fill" id="audioFill" style="width:0%"></div>
  </div>
  <span class="audio-time" id="audioTime">0:00</span>
  <span class="audio-narrator">🎙 {% trans "Baka čita" %}</span>
</div>

<audio id="audioEl" preload="auto" {% if audio_url %}src="{{ audio_url }}"{% endif %}></audio>

<script>
/* ═══════════════════════════════════════════════════════════════
   PLAY.EU Codex Engine v2
   ═══════════════════════════════════════════════════════════════ */

var PAGES = {{ pages_json|safe }};
var LANG = '{{ lang }}';
var LANGS_DATA = {{ langs_data|safe }};
var TOTAL = PAGES.length;
var currentPage = 0;
var isFullscreen = false;

/* ═══ PAGE ILLUSTRATION PLACEHOLDERS (by story section) ═══ */
var SECTION_ICONS = [
  '🏰', '👶', '🌿', '🥬', '🧙‍♀️', '😨', '👧', '💇‍♀️', '🗼', '🔒',
  '🎵', '🐴', '🤴', '🌙', '❤️', '🪡', '✂️', '😈', '🌿', '😢',
  '💧', '👁️', '🌳', '👫', '😭', '✨', '👀', '🏇', '👨‍👩‍👧‍👦', '🏰'
];

/* ═══ RENDER CURRENT PAGE ═══ */
function renderPage() {
  var pg = PAGES[currentPage];
  var codex = document.getElementById('codex');
  var codexLeft = document.getElementById('codexLeft');
  var codexRight = document.getElementById('codexRight');
  var codexText = document.getElementById('codexText');
  var pageNum = document.getElementById('pageNum');
  var imgEl = document.getElementById('codexImg');
  var placeholder = document.getElementById('imgPlaceholder');
  var pageTools = document.getElementById('pageTools');

  // Animate transition
  codex.classList.remove('page-entering');
  codex.classList.add('page-turning');

  setTimeout(function() {
    if (pg.type === 'cover') {
      /* ═══ COVER ═══ */
      codex.classList.add('is-cover');
      pageTools.style.display = 'none';

      codexText.innerHTML =
        '<div class="cover-inner">' +
          (pg.cover_img ? '<img class="cover-bg" src="' + pg.cover_img + '" alt="">' : '') +
          '<div class="cover-ornament">✦ ✦ ✦</div>' +
          '<div class="cover-title">' + esc(pg.title) + '</div>' +
          (pg.author ? '<div class="cover-author">' + esc(pg.author) + '</div>' : '') +
          '<button class="cover-open" onclick="nextPage()">{% trans "Otvori knjigu" %} →</button>' +
          '<div class="cover-badges">' +
            (pg.type_label ? '<span class="cover-badge">' + esc(pg.type_label) + '</span>' : '') +
            (pg.country ? '<span class="cover-badge">' + esc(pg.country) + '</span>' : '') +
            (pg.reading_time ? '<span class="cover-badge">' + pg.reading_time + ' min</span>' : '') +
          '</div>' +
        '</div>';
      pageNum.textContent = '';
    } else {
      /* ═══ CONTENT PAGE ═══ */
      codex.classList.remove('is-cover');
      pageTools.style.display = 'flex';

      // Left: illustration or placeholder
      if (pg.image) {
        imgEl.src = pg.image;
        imgEl.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        imgEl.style.display = 'none';
        placeholder.style.display = 'flex';
        var icon = SECTION_ICONS[(currentPage - 1) % SECTION_ICONS.length] || '📖';
        placeholder.innerHTML = '<span>' + icon + '</span>' +
          '<span class="pl-label">{% trans "Ilustracija uskoro" %}</span>';
      }

      // Right: text with manuscript styling
      codexText.innerHTML = pg.text || '';
      pageNum.innerHTML = '— ' + (pg.page_num || currentPage) + ' —';

      // Check for saved recording
      checkRecording();
    }

    codex.classList.remove('page-turning');
    codex.classList.add('page-entering');

    // Scroll text to top
    codexText.scrollTop = 0;
  }, 200);

  updateProgress();
}

/* ═══ NAVIGATION ═══ */
function nextPage() {
  if (currentPage >= TOTAL - 1) return;
  stopSpeaking();
  currentPage++;
  renderPage();
}

function prevPage() {
  if (currentPage <= 0) return;
  stopSpeaking();
  currentPage--;
  renderPage();
}

function updateProgress() {
  var pct = TOTAL > 1 ? (currentPage / (TOTAL - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ═══ SWIPE ═══ */
var touchStartX = 0, touchStartY = 0;
document.getElementById('codexWrap').addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: true});
document.getElementById('codexWrap').addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) nextPage(); else prevPage();
  }
});

/* Keyboard */
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'Escape' && isFullscreen) toggleFullscreen();
});

/* ═══ LANGUAGE SWITCH ═══ */
function switchLang(lc) {
  LANG = lc;
  if (LANGS_DATA[lc]) {
    PAGES = LANGS_DATA[lc];
    TOTAL = PAGES.length;
    currentPage = Math.min(currentPage, TOTAL - 1);
    renderPage();
  }
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.lang === lc);
  });
  // Update global audio
  var audioEl = document.getElementById('audioEl');
  var newSrc = LANGS_DATA['audio_' + lc] || '';
  if (newSrc && newSrc !== audioEl.src) {
    audioEl.src = newSrc;
    audioEl.load();
  }
  document.documentElement.lang = lc;
}

/* ═══ PER-PAGE TTS (zvučnik) ═══ */
var currentUtterance = null;
var ttsVoices = [];
var ttsAutoNext = false;

/* Profili glasova — rate i pitch */
var VOICE_PROFILES = {
  'tts':  { rate: 0.85, pitch: 1.05, label: 'Glas' },
  'baka': { rate: 0.72, pitch: 1.25, label: 'Baka' },
  'djed': { rate: 0.75, pitch: 0.75, label: 'Djed' },
  'mama': { rate: 0.85, pitch: 1.15, label: 'Mama' },
  'tata': { rate: 0.80, pitch: 0.88, label: 'Tata' }
};

/* Predloži jezik → preferirani jezici za glas (od najboljeg prema fallbacku) */
var LANG_PREFERENCE = {
  'hr': ['hr', 'hr-HR', 'hr-BA', 'bs', 'sr', 'cs', 'sk', 'pl', 'en'],
  'de': ['de', 'de-DE', 'de-AT', 'de-CH', 'en'],
  'en': ['en', 'en-GB', 'en-US', 'en-AU', 'en-IE', 'de', 'fr'],
  'fr': ['fr', 'fr-FR', 'fr-BE', 'fr-CA', 'en'],
  'it': ['it', 'it-IT', 'en'],
  'es': ['es', 'es-ES', 'es-MX', 'en'],
  'tr': ['tr', 'tr-TR', 'en']
};

/* Učitaj glasove čim su dostupni */
function loadTTSVoices() {
  ttsVoices = speechSynthesis.getVoices();
}
if (typeof speechSynthesis !== 'undefined') {
  loadTTSVoices();
  speechSynthesis.addEventListener('voiceschanged', loadTTSVoices);
}

function getPlainText() {
  /* Extract plain text from current page HTML */
  var div = document.createElement('div');
  var pg = PAGES[currentPage] || {};
  /* Cover page: combine title + author */
  if (pg.type === 'cover') {
    return [pg.title || '', pg.author || ''].filter(Boolean).join('. ');
  }
  /* Moral page */
  if (pg.type === 'moral') {
    var d2 = document.createElement('div');
    d2.innerHTML = pg.text || '';
    return 'Pouka: ' + (d2.textContent || d2.innerText || '');
  }
  div.innerHTML = pg.text || '';
  return (div.textContent || div.innerText || '').trim();
}

function pickVoice(preferredLang) {
  if (!ttsVoices.length) ttsVoices = speechSynthesis.getVoices();
  var prefs = LANG_PREFERENCE[preferredLang] || ['en'];

  /* 1. Exact match */
  for (var p = 0; p < prefs.length; p++) {
    var pref = prefs[p].toLowerCase();
    for (var i = 0; i < ttsVoices.length; i++) {
      if (ttsVoices[i].lang.toLowerCase() === pref) return ttsVoices[i];
    }
  }
  /* 2. Prefix match */
  for (var p = 0; p < prefs.length; p++) {
    var pref = prefs[p].toLowerCase();
    for (var i = 0; i < ttsVoices.length; i++) {
      if (ttsVoices[i].lang.toLowerCase().startsWith(pref)) return ttsVoices[i];
    }
  }
  /* 3. Any available voice (never return null) */
  return ttsVoices[0] || null;
}

function speakPage() {
  var btn = document.getElementById('btnSpeak');
  if (!('speechSynthesis' in window)) {
    btn.title = 'Vaš preglednik ne podržava čitanje naglas';
    btn.textContent = '🔇';
    return;
  }

  /* Toggle off */
  if (btn.classList.contains('active')) {
    speechSynthesis.cancel();
    btn.classList.remove('active');
    btn.textContent = '🔊';
    return;
  }

  var text = getPlainText();
  if (!text) { nextPage(); return; } /* Skip cover/empty pages */

  var profile = VOICE_PROFILES[document.getElementById('voiceSelect').value] || VOICE_PROFILES['tts'];

  function doSpeak() {
    var utter = new SpeechSynthesisUtterance(text);
    var voice = pickVoice(LANG);
    if (voice) {
      utter.voice = voice;
      utter.lang = voice.lang;
    } else {
      /* Last resort: set lang without voice object */
      var langMap = {'hr':'hr-HR','de':'de-DE','en':'en-GB','fr':'fr-FR','it':'it-IT'};
      utter.lang = langMap[LANG] || 'en-GB';
    }
    utter.rate   = profile.rate;
    utter.pitch  = profile.pitch;
    utter.volume = 1.0;

    btn.classList.add('active');
    btn.textContent = '⏸';

    utter.onend = function() {
      btn.classList.remove('active');
      btn.textContent = '🔊';
      /* Auto-nastavak na sljedeću stranicu */
      if (ttsAutoNext && currentPage < TOTAL - 1) {
        setTimeout(function() { nextPage(); setTimeout(speakPage, 600); }, 300);
      }
    };
    utter.onerror = function(e) {
      if (e.error === 'canceled' || e.error === 'interrupted') return;
      console.warn('TTS error:', e.error, '| voice:', voice && voice.name, '| lang:', utter.lang);
      btn.classList.remove('active');
      btn.textContent = '🔊';
      /* Pokušaj bez specifičnog glasa */
      if (voice) {
        var u2 = new SpeechSynthesisUtterance(text);
        u2.rate = profile.rate; u2.pitch = profile.pitch; u2.volume = 1.0;
        u2.onend = function() { btn.classList.remove('active'); btn.textContent = '🔊'; };
        speechSynthesis.speak(u2);
      }
    };

    /* Chrome stabilizacija: cancel → wait → speak */
    speechSynthesis.cancel();
    setTimeout(function() { speechSynthesis.speak(utter); }, 80);
  }

  /* Čekaj glasove ako još nisu učitani */
  if (ttsVoices.length > 0) {
    doSpeak();
  } else if (speechSynthesis.getVoices().length > 0) {
    ttsVoices = speechSynthesis.getVoices();
    doSpeak();
  } else {
    speechSynthesis.onvoiceschanged = function() {
      ttsVoices = speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = null;
      doSpeak();
    };
    setTimeout(function() {
      if (!speechSynthesis.speaking && btn.classList.contains('active')) {
        ttsVoices = speechSynthesis.getVoices();
        doSpeak();
      }
    }, 500);
  }
}

function stopSpeaking() {
  if (typeof speechSynthesis !== 'undefined' && speechSynthesis.speaking) speechSynthesis.cancel();
  var btn = document.getElementById('btnSpeak');
  if (btn) { btn.classList.remove('active'); btn.textContent = '🔊'; }
}

function toggleAutoNext() {
  ttsAutoNext = !ttsAutoNext;
  var btn = document.getElementById('btnAuto');
  if (!btn) return;
  if (ttsAutoNext) {
    btn.classList.add('active');
    btn.title = 'Auto-čitanje: UKLJUČENO — klikni za isključivanje';
    if (!speechSynthesis.speaking) speakPage();
  } else {
    btn.classList.remove('active');
    btn.title = 'Auto-čitanje: ISKLJUČENO';
    stopSpeaking();
  }
}

/* ═══ PER-PAGE MICROPHONE (snimanje) ═══ */
var mediaRecorder = null;
var recordedChunks = [];
var isRecording = false;
var recordings = {}; /* key: "slug_lang_pagenum" -> Blob */

function getRecKey() {
  return '{{ story.slug }}_' + LANG + '_' + currentPage;
}

async function toggleRecording() {
  var btn = document.getElementById('btnMic');
  var dot = document.getElementById('recDot');

  if (isRecording) {
    /* Stop */
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('active');
    dot.classList.remove('on');
    return;
  }

  /* Start */
  try {
    var stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRecorder = new MediaRecorder(stream, {mimeType: 'audio/webm'});
    recordedChunks = [];

    mediaRecorder.ondataavailable = function(e) {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = function() {
      var blob = new Blob(recordedChunks, {type: 'audio/webm'});
      var key = getRecKey();
      recordings[key] = blob;
      /* Save to IndexedDB */
      saveRecordingToDB(key, blob);
      /* Show playback button */
      document.getElementById('btnPlayRec').style.display = 'flex';
      /* Stop mic access */
      stream.getTracks().forEach(function(t) { t.stop(); });
    };

    mediaRecorder.start();
    isRecording = true;
    btn.classList.add('active');
    dot.classList.add('on');
  } catch(err) {
    console.warn('Mic access denied:', err);
  }
}

function playRecording() {
  var key = getRecKey();
  var blob = recordings[key];
  if (!blob) {
    /* Try loading from IndexedDB */
    loadRecordingFromDB(key, function(b) {
      if (b) { recordings[key] = b; _playBlob(b); }
    });
    return;
  }
  _playBlob(blob);
}

function _playBlob(blob) {
  var url = URL.createObjectURL(blob);
  var a = new Audio(url);
  var btn = document.getElementById('btnPlayRec');
  btn.classList.add('active');
  a.onended = function() { btn.classList.remove('active'); URL.revokeObjectURL(url); };
  a.play();
}

function checkRecording() {
  var key = getRecKey();
  var btn = document.getElementById('btnPlayRec');
  if (recordings[key]) {
    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';
    loadRecordingFromDB(key, function(b) {
      if (b) { recordings[key] = b; btn.style.display = 'flex'; }
    });
  }
}

/* ═══ IndexedDB for recordings ═══ */
var dbReady = false;
var db = null;

function openDB(cb) {
  if (db) { cb(db); return; }
  var req = indexedDB.open('PlayEU_Recordings', 1);
  req.onupgradeneeded = function(e) {
    e.target.result.createObjectStore('recordings');
  };
  req.onsuccess = function(e) { db = e.target.result; cb(db); };
  req.onerror = function() { cb(null); };
}

function saveRecordingToDB(key, blob) {
  openDB(function(db) {
    if (!db) return;
    var tx = db.transaction('recordings', 'readwrite');
    tx.objectStore('recordings').put(blob, key);
  });
}

function loadRecordingFromDB(key, cb) {
  openDB(function(db) {
    if (!db) { cb(null); return; }
    var tx = db.transaction('recordings', 'readonly');
    var req = tx.objectStore('recordings').get(key);
    req.onsuccess = function() { cb(req.result || null); };
    req.onerror = function() { cb(null); };
  });
}

/* ═══ Voice change ═══ */
function onVoiceChange() {
  var val = document.getElementById('voiceSelect').value;
  /* Ako govori, ponovo pokreni s novim glasom */
  if (typeof speechSynthesis !== 'undefined' && speechSynthesis.speaking) {
    speechSynthesis.cancel();
    setTimeout(speakPage, 150);
  }
}

/* ═══ FULLSCREEN ═══ */
function toggleFullscreen() {
  var body = document.getElementById('bookBody');
  if (!isFullscreen) {
    if (body.requestFullscreen) body.requestFullscreen();
    else if (body.webkitRequestFullscreen) body.webkitRequestFullscreen();
    body.classList.add('fullscreen-active');
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    body.classList.remove('fullscreen-active');
  }
  isFullscreen = !isFullscreen;
}

/* ═══ GLOBAL AUDIO ═══ */
var audioEl = document.getElementById('audioEl');
var audioPlaying = false;

function toggleGlobalAudio() {
  if (audioPlaying) audioEl.pause(); else audioEl.play();
}
audioEl.addEventListener('play', function() {
  audioPlaying = true;
  document.getElementById('audioPlayBtn').textContent = '⏸';
});
audioEl.addEventListener('pause', function() {
  audioPlaying = false;
  document.getElementById('audioPlayBtn').textContent = '▶';
});
audioEl.addEventListener('timeupdate', function() {
  var pct = audioEl.duration ? (audioEl.currentTime / audioEl.duration) * 100 : 0;
  document.getElementById('audioFill').style.width = pct + '%';
  var m = Math.floor(audioEl.currentTime / 60);
  var s = Math.floor(audioEl.currentTime % 60);
  document.getElementById('audioTime').textContent = m + ':' + (s < 10 ? '0' : '') + s;
});
function seekGlobalAudio(e) {
  var rect = e.currentTarget.getBoundingClientRect();
  var pct = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = pct * audioEl.duration;
}

/* ═══ UTILS ═══ */
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ═══ INIT ═══ */
renderPage();

/* Page turn sound — synthesized paper rustle */
var _audioCtx;
function playPageTurn() {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var buf = _audioCtx.createBuffer(1, _audioCtx.sampleRate * 0.12, _audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0; i<d.length; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(d.length*0.25)) * 0.06;
    var s = _audioCtx.createBufferSource(); s.buffer = buf;
    var f = _audioCtx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1800;
    s.connect(f); f.connect(_audioCtx.destination); s.start();
  } catch(e){}
}

/* Haptic */
function haptic(ms) { if(navigator.vibrate) navigator.vibrate(ms||6); }

/* Particles — fireflies */
function spawnFireflies() {
  for (var i=0; i<6; i++) {
    var p = document.createElement("div"); p.className="firefly";
    p.style.left = (Math.random()*100)+"vw";
    p.style.top = (55+Math.random()*40)+"vh";
    p.style.animationDuration = (7+Math.random()*9)+"s";
    p.style.animationDelay = (Math.random()*8)+"s";
    p.style.width = p.style.height = (2+Math.random()*2)+"px";
    document.body.appendChild(p);
    setTimeout(function(el){el.remove()}.bind(null,p), 20000);
  }
}
spawnFireflies(); setInterval(spawnFireflies, 16000);

/* Night mode */
function toggleNight() { document.body.classList.toggle("night-mode"); }

/* Keyboard: N for night */
document.addEventListener("keydown", function(e) {
  if (e.key==="n"||e.key==="N") toggleNight();
});

/* Drop-cap: add class to first paragraph */
var _origShowPage = typeof showPage === "function" ? showPage : null;
if (_origShowPage) {

/* Inject page turn + haptic into navigation */
var _origNext = typeof nextPage === "function" ? nextPage : null;
var _origPrev = typeof prevPage === "function" ? prevPage : null;
if (_origNext) {
  var _rn = nextPage;
  nextPage = function() { playPageTurn(); haptic(8); _rn(); };
}
if (_origPrev) {
  var _rp = prevPage;
  prevPage = function() { playPageTurn(); haptic(5); _rp(); };
}

/* ═══ GLOBAL AUDIO INIT — preload voices ═══ */
(function() {
  /* Chrome needs a user gesture to unlock audio context */
  /* Pre-load voices on page load */
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.getVoices();

      speechSynthesis.onvoiceschanged = function() {

      };

  }

  /* Chrome workaround: speechSynthesis can get "stuck" */
  /* Periodically check and unstick it */
  setInterval(function() {
    if (speechSynthesis.speaking && !speechSynthesis.pending) {
      /* Might be stuck - the user will need to click again */
    }
  }, 5000);

  /* Auto-read toggle */
  var autoRead = localStorage.getItem('playeu_autoread') === 'true';
  window._playeu_autoRead = autoRead;

})();
