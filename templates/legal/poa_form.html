{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div class="fenix-card space-y-4">
      <h3 class="text-sm font-semibold">Punomoć</h3>
      <div>
        <label class="fenix-label">Naslov *</label>
        <input name="title" class="form-input" required placeholder="Punomoć za zastupanje pred tijelima javne vlasti">
      </div>
      <div>
        <label class="fenix-label">Vrsta punomoći</label>
        <select name="poa_type" class="form-input">
          {% for val, label in type_choices %}
          <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fenix-label">Vlastodavac (daje punomoć) *</label>
          <input name="principal_name" class="form-input" required
                 value="{{ company.name }}" placeholder="Tvrtka ili fizička osoba">
        </div>
        <div>
          <label class="fenix-label">OIB vlastodavca</label>
          <input name="principal_oib" class="form-input" maxlength="11" value="{{ company.oib }}">
        </div>
        <div>
          <label class="fenix-label">Opunomoćenik (prima punomoć) *</label>
          <input name="agent_name" class="form-input" required placeholder="Ime i prezime ili tvrtka">
        </div>
        <div>
          <label class="fenix-label">OIB opunomoćenika</label>
          <input name="agent_oib" class="form-input" maxlength="11">
        </div>
      </div>
      <div>
        <label class="fenix-label">Opseg ovlasti *</label>
        <textarea name="scope" class="form-input" rows="4" required
                  placeholder="Opišite za što opunomoćenik ima ovlast..."></textarea>
      </div>
      <div>
        <label class="fenix-label">Ograničenja</label>
        <textarea name="restrictions" class="form-input" rows="2"
                  placeholder="Što opunomoćenik NE smije..."></textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fenix-label">Na snazi od *</label>
          <input type="date" name="valid_from" class="form-input" required>
        </div>
        <div>
          <label class="fenix-label">Na snazi do</label>
          <input type="date" name="valid_until" class="form-input">
          <label class="flex items-center gap-2 mt-2 cursor-pointer">
            <input type="checkbox" name="is_indefinite">
            <span class="text-xs text-fenix-ink/60">Neodređeno</span>
          </label>
        </div>
      </div>
    </div>
    <div class="flex gap-3">
      <button type="submit" class="fenix-btn fenix-btn-primary">Spremi</button>
      <a href="{% url 'legal:poa_list' %}" class="fenix-btn fenix-btn-ghost">Odustani</a>
    </div>
  </form>
</div>
{% endblock %}
