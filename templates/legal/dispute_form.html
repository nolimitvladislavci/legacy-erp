{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div class="fenix-card space-y-4">
      <h3 class="text-sm font-semibold">Osnovni podaci</h3>
      <div>
        <label class="fenix-label">Naslov spora *</label>
        <input name="title" class="form-input" required placeholder="Kratki opis spora">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fenix-label">Vrsta</label>
          <select name="dispute_type" class="form-input">
            {% for val, label in type_choices %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="fenix-label">Prioritet</label>
          <select name="priority" class="form-input">
            {% for val, label in priority_choices %}
            <option value="{{ val }}" {% if val == 'medium' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="fenix-label">Rok za odgovor</label>
          <input type="date" name="deadline" class="form-input">
        </div>
        <div>
          <label class="fenix-label">Datum ročišta</label>
          <input type="date" name="court_date" class="form-input">
        </div>
      </div>
      <div>
        <label class="fenix-label">Traženi iznos (€)</label>
        <input type="number" name="amount_claimed" class="form-input" step="0.01" placeholder="0.00">
      </div>
    </div>

    <div class="fenix-card space-y-4">
      <h3 class="text-sm font-semibold">Protustrana</h3>
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="fenix-label">Naziv / ime *</label>
          <input name="opponent_name" class="form-input" required placeholder="Naziv tvrtke ili ime osobe">
        </div>
        <div>
          <label class="fenix-label">OIB</label>
          <input name="opponent_oib" class="form-input" maxlength="11">
        </div>
        <div>
          <label class="fenix-label">Kontakt</label>
          <input name="opponent_contact" class="form-input" placeholder="email ili telefon">
        </div>
      </div>
    </div>

    <div class="fenix-card">
      <label class="fenix-label">Opis spora *</label>
      <textarea name="description" class="form-input" rows="5" required
                placeholder="Detaljan opis što se desilo, što je sporno..."></textarea>
      <p class="text-xs text-fenix-ink/50 mt-1">AI će automatski analizirati i dati rizik score i preporuku.</p>
      <div class="mt-3">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="self_assign" class="rounded">
          <span class="text-sm">Preuzimam ovaj spor na sebe</span>
        </label>
      </div>
    </div>

    <div class="flex gap-3">
      <button type="submit" class="fenix-btn fenix-btn-primary">Spremi spor</button>
      <a href="{% url 'legal:dispute_list' %}" class="fenix-btn fenix-btn-ghost">Odustani</a>
    </div>
  </form>
</div>
{% endblock %}
