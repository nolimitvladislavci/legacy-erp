{% extends "base.html" %}
{% load i18n %}
{% block title %}Kuhinja — Narudzbe{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="fas fa-utensils me-2"></i>Kuhinja — Aktivne narudzbe</h4>
        <span class="badge bg-secondary" id="orderCount">...</span>
    </div>

    <div id="orders-container">
        <div class="text-center text-muted py-5">Ucitavam narudzbe...</div>
    </div>
</div>

<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script>
// Poll every 8 seconds
function loadOrders(){
    fetch('{% url "gastro_menu:kitchen_orders" %}')
        .then(r=>r.text())
        .then(html=>{
            document.getElementById('orders-container').innerHTML=html;
            const cards=document.querySelectorAll('.order-card');
            document.getElementById('orderCount').textContent=cards.length+' narudzbi';
        })
        .catch(()=>{});
}
loadOrders();
setInterval(loadOrders,8000);

function updateStatus(orderId,newStatus){
    fetch('{% url "gastro_menu:kitchen_status" %}',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRFToken':'{{ csrf_token }}'},
        body:JSON.stringify({order_id:orderId,status:newStatus})
    }).then(r=>r.json()).then(d=>{
        if(d.ok)loadOrders();
        else alert(d.error);
    });
}
</script>
{% endblock %}
