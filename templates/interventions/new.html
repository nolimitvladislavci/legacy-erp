{% extends "base.html" %}
{% load i18n %}
{% block page_title %}Nova intervencija{% endblock %}
{% block content %}
<!-- lang: topbar -->
      <div class="ni-field">
        <label>{% trans "Adresa intervencije *" %}</label>
        <input type="text" name="address" placeholder="{% trans "Ul. sv. Dominika 5, Split" %}" required>
      </div>
      <div class="ni-grid">
        <div class="ni-field">
          <label>{% trans "Ime klijenta *" %}</label>
          <input type="text" name="client_name" placeholder="{% trans "Ivan Horvat" %}" required>
        </div>
        <div class="ni-field">
          <label>{% trans "Telefon klijenta *" %}</label>
          <input type="tel" name="client_phone" placeholder="+385 91 234 5678" required>
        </div>
      </div>
      <div class="ni-field">
        <label>{% trans "Opis problema" %}</label>
        <textarea name="description" placeholder="{% trans "Dodatni detalji..." %}"></textarea>
      </div>
      <div class="ni-actions">
        <button type="submit" class="btn-primary">{% trans "Kreiraj intervenciju" %}</button>
        <a href="{% url 'interventions:kanban' %}" class="btn-secondary">{% trans "Odustani" %}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
