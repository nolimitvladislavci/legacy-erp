{% extends "base.html" %}
{% load i18n %}
{% block title %}Inspekcija QR - LIMIT CONNECT{% endblock %}

{% block extra_css %}
<style>
.qr-container {
    max-width: 500px;
    margin: 0 auto;
    text-align: center;
    padding: 2rem 1rem;
}
.qr-card {
    background: var(--bg-card);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 4px 20px var(--shadow);
}
.qr-card img {
    border-radius: 8px;
    max-width: 100%;
    height: auto;
}
.qr-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 1.5rem;
}
.scope-badge {
    display: inline-block;
    padding: 0.4rem 1rem;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.9rem;
    color: #fff;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.scope-badge.sanitarna { background: #dc2626; }
.scope-badge.hapih { background: #f59e0b; }
.scope-badge.jrdz { background: #3b82f6; }
.scope-badge.vetis { background: #16a34a; }
.qr-url {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    font-family: monospace;
    font-size: 0.8rem;
    word-break: break-all;
    color: var(--text-secondary);
    margin: 1rem 0;
    cursor: pointer;
    user-select: all;
}
.qr-expire {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin: 1rem 0;
}
.qr-expire i { color: #f59e0b; }
.qr-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 1.5rem;
}
.qr-actions .btn {
    min-height: 48px;
    font-weight: 600;
    padding: 0.5rem 1.5rem;
    border-radius: 10px;
}
@media print {
    .no-print { display: none !important; }
    .qr-card { border-color: #000; box-shadow: none; }
}
</style>
{% endblock %}

{% block content %}
<div class="qr-container">
    <div class="qr-card">
        <div class="qr-title">
            <i class="fas fa-qrcode"></i> Pokažite ovaj QR kod inspektoru
        </div>

        <span class="scope-badge {{ scope }}">{{ scope|upper }}</span>

        <div style="margin: 1.5rem 0;">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data={{ qr_url|urlencode }}"
                 alt="QR kod za inspekciju" width="300" height="300">
        </div>

        <div class="qr-url" title="Kliknite za kopiranje">{{ qr_url }}</div>

        <div class="qr-expire">
            <i class="fas fa-clock"></i> Vrijedi 24 sata
        </div>

        <div class="qr-actions no-print">
            <button class="btn btn-outline-secondary" onclick="window.print()">
                <i class="fas fa-print"></i> Print
            </button>
            <a href="{% url 'livestock:inspection_pdf' %}" class="btn btn-outline-primary">
                <i class="fas fa-file-pdf"></i> Generiraj PDF
            </a>
            <a href="{% url 'livestock:panic_button' %}" class="btn btn-outline-dark">
                <i class="fas fa-arrow-left"></i> Natrag
            </a>
        </div>
    </div>
</div>
{% endblock %}
