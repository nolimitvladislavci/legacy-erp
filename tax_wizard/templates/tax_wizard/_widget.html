{% load i18n %}
{% if show %}
<div class="tax-wizard-widget" style="background:rgba(201,146,42,0.08);border-left:3px solid #c9a84c;padding:8px 12px;margin-bottom:12px;border-radius:4px;font-size:.85rem;">
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:1.2rem;">📋</span>
    <div style="flex:1;">
      {% if trigger_message %}<strong>{{ trigger_message }}</strong><br>{% endif %}
      {% for d in upcoming_deadlines %}
      <div><strong>{{ d.template.form_type }}</strong> — rok: <strong>{{ d.deadline_date|date:"d.m.Y." }}</strong> ({{ d.deadline_date|timeuntil }})</div>
      {% endfor %}
    </div>
    <a href="{{ wizard_url }}" style="background:#c9a84c;color:#000;padding:4px 10px;border-radius:4px;font-size:.75rem;font-weight:600;text-decoration:none;">{% trans "Otvori" %}</a>
  </div>
</div>
{% endif %}
