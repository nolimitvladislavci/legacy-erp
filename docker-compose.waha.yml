services:
  waha:
    image: devlikeapro/waha:latest
    container_name: fina_waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.waha
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_DASHBOARD_ENABLED=true
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WAHA_LOG_LEVEL=info
      - WHATSAPP_HOOK_URL=http://172.17.0.1:8000/api/whatsapp/webhook/
      - WHATSAPP_HOOK_EVENTS=message
    volumes:
      - waha_sessions:/app/.sessions
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  waha_sessions:
