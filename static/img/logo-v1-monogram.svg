<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c96a"/>
      <stop offset="50%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#b89940"/>
    </linearGradient>
  </defs>
  
  <!-- LC Monogram — connected letters -->
  <g transform="translate(10, 10)">
    <!-- L shape -->
    <path d="M8 8 L8 82 L42 82" 
          fill="none" stroke="url(#gold-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- C shape (connected to L) -->
    <path d="M52 28 C52 14, 70 8, 84 8 C92 8, 98 12, 98 12 M52 62 C52 76, 70 82, 84 82 C92 82, 98 78, 98 78" 
          fill="none" stroke="url(#gold-grad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Connection bar L→C -->
    <line x1="42" y1="82" x2="52" y2="62" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- LIMIT text -->
  <text x="130" y="52" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="6" fill="#e2e8f0">
    LIMIT
  </text>
  
  <!-- CONNECT text -->
  <text x="130" y="88" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="300" letter-spacing="4" fill="#c9a84c">
    CONNECT
  </text>
  
  <!-- Tagline -->
  <text x="130" y="110" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#64748b">
    ENTERPRISE PLATFORM
  </text>
</svg>
