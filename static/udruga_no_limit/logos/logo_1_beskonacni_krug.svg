<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F0D080"/>
      <stop offset="100%" stop-color="#B8943A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FFFFFF"/>

  <!-- Vanjski otvoreni krug (prekid 10h-2h) -->
  <path d="M 115 53 A 170 170 0 1 1 285 53"
        fill="none" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>

  <!-- Fini gold unutarnji prsten -->
  <circle cx="200" cy="200" r="142" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.45"/>

  <!-- Male zlatne točke na krajevima prekida -->
  <circle cx="115" cy="53" r="7" fill="#C9A84C"/>
  <circle cx="285" cy="53" r="7" fill="#C9A84C"/>

  <!-- Beskonačno simbol -->
  <path d="M 125 200
           C 125 148 172 148 200 200
           C 228 252 275 252 275 200
           C 275 148 228 148 200 200
           C 172 252 125 252 125 200 Z"
        fill="none" stroke="url(#goldGrad1)" stroke-width="15"
        stroke-linejoin="round" filter="url(#softShadow)"/>

  <!-- Centralna točka -->
  <circle cx="200" cy="200" r="5" fill="#0F172A"/>

  <!-- NO LIMIT tekst -->
  <text x="200" y="345" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="700"
        fill="#0F172A" letter-spacing="7">NO LIMIT</text>

  <!-- Podnaslov -->
  <text x="200" y="368" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" font-weight="400"
        fill="#64748B" letter-spacing="3.5">EUROPSKA UDRUGA · 2026</text>
</svg>
