<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d6efd">
<title>LIMIT Connect — Offline</title>
<style>
  :root{--blue:#0d6efd;--dark:#1a1d21;--cyan:#0dcaf0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--dark);color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       min-height:100vh;text-align:center;padding:20px}
  .logo{font-size:2rem;font-weight:900;color:var(--blue);margin-bottom:8px;letter-spacing:2px}
  .icon{font-size:64px;margin-bottom:20px;opacity:.6}
  h1{color:var(--cyan);font-size:1.4rem;margin-bottom:12px}
  p{color:#94a3b8;font-size:.9rem;max-width:360px;line-height:1.6;margin-bottom:8px}
  .modules{margin:24px 0;text-align:left;max-width:320px;width:100%}
  .modules h3{font-size:.7rem;color:var(--cyan);margin-bottom:10px;text-transform:uppercase;letter-spacing:2px}
  .mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mod-item{padding:12px;background:rgba(13,110,253,.1);border-radius:8px;
            border:1px solid rgba(13,110,253,.2);font-size:.8rem;text-align:center;
            display:flex;align-items:center;gap:8px;justify-content:center}
  .mod-item .emoji{font-size:1.2rem}
  .retry{margin-top:24px;background:var(--blue);color:white;border:none;border-radius:10px;
         padding:14px 32px;font-size:1rem;font-weight:600;cursor:pointer;
         min-height:48px;min-width:200px}
  .retry:active{opacity:.8;transform:scale(.97)}
  .queue-info{margin-top:12px;font-size:.7rem;color:#475569}
  .pulse{animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
</style>
</head>
<body>
  <div class="logo">LC</div>
  <div class="icon pulse">&#9889;</div>
  
  <div class="modules">
    <h3>Dostupno offline</h3>
    <div class="mod-grid">
      <div class="mod-item"><span class="emoji">&#128722;</span> POS Blagajna</div>
      <div class="mod-item"><span class="emoji">&#9200;</span> Clock-in/out</div>
      <div class="mod-item"><span class="emoji">&#128247;</span> Scan dokumenata</div>
      <div class="mod-item"><span class="emoji">&#128203;</span> Offline zapisi</div>
    </div>
  </div>
  
  <h1>Nema internetske veze</h1>
  <p>Podaci se spremaju lokalno i automatski sinkroniziraju kad se veza uspostavi.</p>
  
  <button class="retry" onclick="window.location.reload()">&#8635; Pokusaj ponovo</button>
  
  <div class="queue-info" id="qi"></div>
  
  <script>
    try{var q=JSON.parse(localStorage.getItem('fina_offline_queue')||'[]');
    if(q.length)document.getElementById('qi').textContent=q.length+' stavki ceka na slanje'}catch(e){}
    window.addEventListener('online',function(){window.location.reload()});
  </script>
</body>
</html>
