{% load i18n %}
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% trans "LIMIT Connect – Offline" %}</title>
<style>
  :root{--gold:#c9a84c;--black:#0a0a0a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--black);color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       min-height:100vh;text-align:center;padding:20px}
  .icon{font-size:72px;margin-bottom:20px;opacity:.7}
  h1{color:var(--gold);font-size:1.6rem;margin-bottom:12px}
  p{color:#94a3b8;font-size:.95rem;max-width:340px;line-height:1.6}
  .retry-btn{margin-top:28px;background:rgba(201,168,76,.15);color:var(--gold);
             border:1px solid rgba(201,168,76,.4);border-radius:8px;
             padding:12px 28px;font-size:1rem;cursor:pointer}
  .retry-btn:active{opacity:.7}
  .queue-info{margin-top:16px;font-size:.75rem;color:#64748b}
</style>
</head>
<body>
  <div class="icon">&#9889;</div>
  <h1>{% trans "Nema veze s mrežom" %}</h1>
  <p>{% trans "GPS lokacije i statusne promjene bit će spremljene lokalno i automatski sinkronizirane
     čim se veza uspostavi." %}</p>
  <button class="retry-btn" onclick="window.location.reload()">{% trans "&#8635; Pokušaj ponovo" %}</button>
  <div class="queue-info" id="queue-info"></div>
  <script>
    // Show queued items count
    try {
      var q = JSON.parse(localStorage.getItem('fina_offline_queue') || '[]');
      if(q.length) {
        document.getElementById('queue-info').textContent =
          q.length + ' stavki čeka na slanje';
      }
    } catch(e){}

    // Auto-retry when back online
    window.addEventListener('online', function(){
      window.location.reload();
    });
  </script>
</body>
</html>
