name: QA Lab (Oracle + Time Machine)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # every night at 02:00 UTC

jobs:
  oracle:
    runs-on: ubuntu-latest
    name: Oracle AST Risk Analyzer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Oracle
        run: |
          python qa_lab/oracle/analyzer.py --all 2>&1 | tee oracle-report.txt
      - name: Upload Oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-report
          path: oracle-report.txt

  time_machine:
    runs-on: ubuntu-latest
    name: Time Machine Smoke Tests
    needs: oracle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Run smoke tests
        run: |
          python qa_lab/time_machine/smoke_runner.py
      - name: Upload Time Machine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-machine-report
          path: qa_lab/reports/time_machine_latest.json

  mutant:
    runs-on: ubuntu-latest
    name: Mutant Testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mutmut
        run: pip install mutmut
      - name: Run mutant
        run: python qa_lab/mutant/runner.py
