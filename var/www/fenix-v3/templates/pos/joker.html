<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>{{ company.name }} — POS</title>
<style>
:root {
  --gold: #D4AF37;
  --gold2: #b8962e;
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #252540;
  --surface3: #2e2e50;
  --border: #3a3a5c;
  --text: #e8e8f0;
  --text2: #9999bb;
  --green: #2ecc71;
  --red: #e74c3c;
  --blue: #3498db;
  --orange: #e67e22;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }

/* ─── LAYOUT ─── */
#app { display:flex; height:100vh; flex-direction:column; }
#main { display:flex; flex:1; overflow:hidden; }
#left  { display:flex; flex-direction:column; flex:1; min-width:0; border-right:1px solid var(--border); }
#right { width:340px; display:flex; flex-direction:column; flex-shrink:0; }

/* ─── TOPBAR ─── */
#topbar {
  display:flex; align-items:center; gap:10px;
  padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border);
  height:52px; flex-shrink:0;
}
#topbar .brand { font-weight:700; font-size:1rem; color:var(--gold); letter-spacing:1px; }
#topbar .cashier-info { font-size:.8rem; color:var(--text2); }
#topbar .cashier-name { font-weight:600; color:var(--text); }
#topbar .session-dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; margin-right:4px; }
.btn-top {
  background:var(--surface2); border:1px solid var(--border); color:var(--text2);
  padding:5px 12px; border-radius:6px; font-size:.75rem; cursor:pointer; transition:.15s;
}
.btn-top:hover { border-color:var(--gold); color:var(--gold); }
#topbar .spacer { flex:1; }

/* ─── CATEGORY BAR ─── */
#catbar {
  display:flex; gap:6px; padding:8px 10px; overflow-x:auto;
  background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0;
  scrollbar-width:none;
}
#catbar::-webkit-scrollbar { display:none; }
.cat-btn {
  flex-shrink:0; padding:6px 14px; border-radius:20px;
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text2); font-size:.8rem; font-weight:500; cursor:pointer; transition:.15s;
  white-space:nowrap;
}
.cat-btn:hover { border-color:var(--gold); color:var(--gold); }
.cat-btn.active { background:var(--gold); border-color:var(--gold); color:#000; font-weight:700; }

/* ─── PRODUCT GRID ─── */
#prodgrid {
  flex:1; overflow-y:auto; padding:10px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px;
  align-content:start;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.prod-card {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 10px; cursor:pointer; transition:.15s; text-align:center; user-select:none;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  min-height:90px; justify-content:center;
}
.prod-card:hover { border-color:var(--gold); background:var(--surface2); transform:scale(1.02); }
.prod-card:active { transform:scale(.97); }
.prod-name { font-size:.82rem; font-weight:600; line-height:1.2; }
.prod-price { font-size:1rem; font-weight:700; color:var(--gold); }

/* ─── TABLES GRID ─── */
#tablesgrid {
  flex:1; overflow-y:auto; padding:12px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:10px;
  align-content:start;
}
.table-card {
  background:var(--surface); border:2px solid var(--border); border-radius:12px;
  padding:14px 10px; cursor:pointer; text-align:center; transition:.15s; user-select:none;
}
.table-card.free { border-color:var(--green); }
.table-card.occupied { border-color:var(--orange); background:rgba(230,126,34,.12); }
.table-card:hover { transform:scale(1.04); }
.table-num { font-size:1.3rem; font-weight:800; }
.table-label { font-size:.72rem; color:var(--text2); }
.table-card.free .table-num { color:var(--green); }
.table-card.occupied .table-num { color:var(--orange); }

/* ─── RECEIPT ─── */
#receipt-header {
  padding:10px 12px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px; flex-shrink:0; min-height:52px;
}
#receipt-header .receipt-title { font-weight:700; font-size:.9rem; flex:1; }
#receipt-header .table-tag { font-size:.75rem; color:var(--gold); background:rgba(212,175,55,.15); padding:2px 8px; border-radius:10px; }

#receipt-items {
  flex:1; overflow-y:auto; padding:8px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.receipt-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text2); gap:8px; }
.receipt-empty .icon { font-size:2.5rem; opacity:.3; }

.ri { display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.05); }
.ri-name { flex:1; font-size:.85rem; line-height:1.2; }
.ri-qty { display:flex; align-items:center; gap:4px; }
.qty-btn { width:24px; height:24px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.1s; }
.qty-btn:hover { border-color:var(--gold); color:var(--gold); }
.qty-num { width:24px; text-align:center; font-weight:700; font-size:.9rem; }
.ri-total { font-weight:700; color:var(--gold); font-size:.9rem; min-width:50px; text-align:right; }
.ri-del { width:22px; height:22px; border-radius:4px; background:rgba(231,76,60,.2); border:none; color:var(--red); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.ri-del:hover { background:rgba(231,76,60,.4); }

#receipt-totals {
  padding:10px 12px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0;
}
.total-row { display:flex; justify-content:space-between; font-size:.82rem; color:var(--text2); margin-bottom:4px; }
.total-row.big { font-size:1.1rem; font-weight:800; color:var(--text); margin-top:6px; }
.total-row.big span:last-child { color:var(--gold); }

#pay-buttons { display:flex; gap:6px; padding:10px 12px; background:var(--surface); border-top:1px solid var(--border); flex-shrink:0; }
.pay-btn { flex:1; padding:12px 6px; border-radius:var(--radius); border:none; font-size:.85rem; font-weight:700; cursor:pointer; transition:.15s; }
.pay-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
.pay-btn:active { transform:translateY(0); }
.pay-cash { background:var(--green); color:#fff; }
.pay-card { background:var(--blue); color:#fff; }
.pay-split { background:var(--orange); color:#fff; }

/* ─── LOGIN OVERLAY ─── */
#login-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.85); backdrop-filter:blur(8px);
  z-index:100; display:flex; align-items:center; justify-content:center;
}
.login-box {
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:32px 28px; width:320px; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.login-logo { font-size:2rem; color:var(--gold); font-weight:800; margin-bottom:4px; }
.login-sub { font-size:.85rem; color:var(--text2); margin-bottom:24px; }
.login-cashier-select {
  display:flex; flex-direction:column; gap:8px; margin-bottom:16px;
}
.cashier-opt {
  padding:10px 16px; border-radius:8px; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); cursor:pointer; font-size:.9rem; font-weight:500; text-align:left; transition:.15s;
}
.cashier-opt:hover, .cashier-opt.selected { border-color:var(--gold); color:var(--gold); }
.pin-display {
  font-size:1.8rem; letter-spacing:12px; color:var(--gold); height:40px;
  display:flex; align-items:center; justify-content:center; margin-bottom:12px;
}
.pinpad { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px; }
.pin-key {
  padding:14px; border-radius:10px; background:var(--surface2); border:1px solid var(--border);
  color:var(--text); font-size:1.1rem; font-weight:600; cursor:pointer; transition:.15s;
}
.pin-key:hover { border-color:var(--gold); background:var(--surface3); }
.pin-key:active { transform:scale(.94); }
.pin-key.del { color:var(--red); }
.pin-key.enter { background:var(--gold); border-color:var(--gold); color:#000; }
.login-error { color:var(--red); font-size:.82rem; min-height:18px; margin-top:4px; }

/* ─── PAYMENT MODAL ─── */
#pay-modal {
  position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(6px);
  z-index:200; display:none; align-items:center; justify-content:center;
}
#pay-modal.open { display:flex; }
.pay-modal-box {
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:28px; width:360px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.pay-modal-title { font-size:1.1rem; font-weight:700; margin-bottom:16px; text-align:center; }
.pay-total-big { font-size:2rem; font-weight:800; color:var(--gold); text-align:center; margin-bottom:20px; }
.pay-methods { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:20px; }
.pay-method-btn {
  padding:14px 8px; border-radius:10px; border:2px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:.85rem; font-weight:600;
  cursor:pointer; transition:.15s; text-align:center;
}
.pay-method-btn:hover { border-color:var(--gold); }
.pay-method-btn.selected { border-color:var(--gold); background:rgba(212,175,55,.15); color:var(--gold); }
.pay-method-btn .pm-icon { font-size:1.3rem; display:block; margin-bottom:4px; }
.pay-cash-input { margin-bottom:16px; }
.pay-cash-input label { font-size:.82rem; color:var(--text2); display:block; margin-bottom:6px; }
.pay-cash-input input {
  width:100%; padding:10px 14px; border-radius:8px; background:var(--surface2);
  border:1px solid var(--border); color:var(--text); font-size:1rem; font-weight:700;
}
.pay-cash-input input:focus { outline:none; border-color:var(--gold); }
.change-row { display:flex; justify-content:space-between; padding:8px 0; font-size:.9rem; border-top:1px solid var(--border); margin-bottom:16px; }
.change-row .change-val { font-weight:800; color:var(--green); }
.pay-confirm-btn {
  width:100%; padding:14px; border-radius:10px; border:none;
  background:var(--gold); color:#000; font-size:1rem; font-weight:800; cursor:pointer; transition:.15s;
}
.pay-confirm-btn:hover { background:var(--gold2); }
.pay-confirm-btn:disabled { opacity:.4; cursor:not-allowed; }
.pay-cancel-btn {
  width:100%; padding:10px; margin-top:8px; border-radius:10px; border:1px solid var(--border);
  background:transparent; color:var(--text2); font-size:.85rem; cursor:pointer;
}
.pay-cancel-btn:hover { border-color:var(--red); color:var(--red); }

/* ─── SUCCESS OVERLAY ─── */
#success-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px);
  z-index:300; display:none; align-items:center; justify-content:center; flex-direction:column;
  gap:12px;
}
#success-overlay.open { display:flex; }
.success-icon { font-size:4rem; animation:pop .4s; }
.success-msg { font-size:1.3rem; font-weight:700; color:var(--green); }
.success-sub { font-size:.9rem; color:var(--text2); }
@keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.2)} 100%{transform:scale(1)} }

/* ─── TOAST ─── */
#toast {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--surface3); border:1px solid var(--border); color:var(--text);
  padding:10px 20px; border-radius:8px; font-size:.85rem; z-index:500;
  opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
}
#toast.show { opacity:1; }
#toast.err { border-color:var(--red); color:var(--red); }
#toast.ok { border-color:var(--green); color:var(--green); }

/* ─── MODE SWITCHER ─── */
#mode-bar { display:flex; gap:0; border-bottom:1px solid var(--border); flex-shrink:0; }
.mode-btn {
  flex:1; padding:8px; text-align:center; font-size:.78rem; font-weight:600;
  color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; transition:.15s;
  background:var(--surface); user-select:none;
}
.mode-btn.active { color:var(--gold); border-bottom-color:var(--gold); }

/* ─── RESPONSIVE ─── */
@media(max-width:700px) {
  #right { width:100%; position:fixed; bottom:0; left:0; height:45vh; border-top:2px solid var(--border); border-right:none; z-index:10; }
  #left { height:55vh; }
  #main { flex-direction:column; }
}
</style>
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar">
    <div class="brand">⚡ POS</div>
    <div>
      <div class="cashier-name" id="tb-cashier">—</div>
      <div class="cashier-info"><span class="session-dot" id="session-dot" style="background:var(--red)"></span><span id="tb-session">Nije prijavljen</span></div>
    </div>
    <div class="spacer"></div>
    <span id="tb-time" style="font-size:.8rem;color:var(--text2)"></span>
    <button class="btn-top" onclick="openTables()" id="btn-tables" style="display:none">🪑 Stolovi</button>
    <button class="btn-top" onclick="clearReceipt()">🗑 Briši</button>
    <button class="btn-top" onclick="logout()" id="btn-logout" style="display:none">⏏ Odjava</button>
  </div>

  <div id="main">
    <!-- LEFT: Categories + Products / Tables -->
    <div id="left">
      <!-- Mode switcher (only if gastro) -->
      {% if is_gastro %}
      <div id="mode-bar">
        <div class="mode-btn active" id="mode-prod" onclick="setMode('products')">🛍 Artikli</div>
        <div class="mode-btn" id="mode-tables" onclick="setMode('tables')">🪑 Stolovi</div>
      </div>
      {% endif %}

      <!-- Category bar -->
      <div id="catbar">
        <button class="cat-btn active" data-cat="all" onclick="filterCat('all',this)">Sve</button>
        <!-- dynamic -->
      </div>

      <!-- Products grid -->
      <div id="prodgrid"></div>

      <!-- Tables grid (hidden by default) -->
      <div id="tablesgrid" style="display:none"></div>
    </div>

    <!-- RIGHT: Receipt -->
    <div id="right">
      <div id="receipt-header">
        <span class="receipt-title">🧾 Račun</span>
        <span class="table-tag" id="receipt-table" style="display:none"></span>
        <button class="btn-top" onclick="newReceipt()" title="Novi račun" style="font-size:1rem">+</button>
      </div>
      <div id="receipt-items">
        <div class="receipt-empty" id="receipt-empty">
          <span class="icon">🛒</span>
          <span>Račun je prazan</span>
          <span style="font-size:.75rem;color:var(--text2)">Klikni na artikl za dodavanje</span>
        </div>
      </div>
      <div id="receipt-totals">
        <div class="total-row"><span>Osnovica</span><span id="tot-sub">0,00 €</span></div>
        <div class="total-row"><span>PDV</span><span id="tot-tax">0,00 €</span></div>
        <div class="total-row big"><span>UKUPNO</span><span id="tot-total">0,00 €</span></div>
      </div>
      <div id="pay-buttons">
        <button class="pay-btn pay-cash" onclick="openPayModal('cash')">💵 Gotovina</button>
        <button class="pay-btn pay-card" onclick="openPayModal('card')">💳 Kartica</button>
        <button class="pay-btn pay-split" onclick="openPayModal('split')">✂️ Split</button>
      </div>
    </div>
  </div>
</div>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">⚡ POS</div>
    <div class="login-sub">{{ company.name }}</div>

    <div class="login-cashier-select" id="cashier-list">
      <!-- filled by JS -->
    </div>

    <div class="pin-display" id="pin-display">····</div>
    <div class="pinpad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key del" onclick="pinDel()">⌫</button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key enter" onclick="pinEnter()">OK</button>
    </div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- PAYMENT MODAL -->
<div id="pay-modal">
  <div class="pay-modal-box">
    <div class="pay-modal-title">Naplata</div>
    <div class="pay-total-big" id="pay-amount-big">0,00 €</div>
    <div class="pay-methods">
      <div class="pay-method-btn selected" data-method="cash" onclick="selectPayMethod('cash')">
        <span class="pm-icon">💵</span>Gotovina
      </div>
      <div class="pay-method-btn" data-method="card" onclick="selectPayMethod('card')">
        <span class="pm-icon">💳</span>Kartica
      </div>
      <div class="pay-method-btn" data-method="split" onclick="selectPayMethod('split')">
        <span class="pm-icon">✂️</span>Split
      </div>
    </div>
    <div class="pay-cash-input" id="cash-input-row">
      <label>Primljeno (€)</label>
      <input type="number" id="cash-received" placeholder="0.00" step="0.01" oninput="calcChange()">
    </div>
    <div class="change-row" id="change-row" style="display:none">
      <span>Kusur</span><span class="change-val" id="change-val">0,00 €</span>
    </div>
    <button class="pay-confirm-btn" id="pay-confirm-btn" onclick="confirmPayment()">✓ NAPLATI</button>
    <button class="pay-cancel-btn" onclick="closePayModal()">Odustani</button>
  </div>
</div>

<!-- SUCCESS -->
<div id="success-overlay">
  <div class="success-icon">✅</div>
  <div class="success-msg" id="success-msg">Plaćeno!</div>
  <div class="success-sub" id="success-sub"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   FENIX POS — Joker Engine v2
   ═══════════════════════════════════════════════════════ */
const TERMINAL_ID = {{ terminal.pk }};
const IS_GASTRO   = {{ is_gastro|yesno:"true,false" }};
const PRODUCTS    = {{ products_json|safe }};
const CATEGORIES  = {{ categories_json|safe }};
const TABLES      = {{ tables_json|safe }};
const CASHIERS    = {{ cashiers_json|safe }};
const CONFIG      = {{ config_json|safe }};

let state = {
  session: null,
  cashier: null,
  receipt: null,          // { id, items:[], table_id, table_number }
  currentCat: 'all',
  mode: 'products',       // 'products' | 'tables'
  payMethod: 'cash',
};

const fmt = n => parseFloat(n||0).toFixed(2).replace('.',',') + ' €';

/* ─── TIME ─── */
function tickClock() {
  const d = new Date();
  document.getElementById('tb-time').textContent =
    d.toLocaleTimeString('hr',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock, 1000); tickClock();

/* ─── TOAST ─── */
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' '+type : '');
  setTimeout(() => el.className = '', 2200);
}

/* ─── CATEGORIES ─── */
function buildCatBar() {
  const bar = document.getElementById('catbar');
  bar.innerHTML = '<button class="cat-btn active" data-cat="all" onclick="filterCat(\'all\',this)">Sve</button>';
  CATEGORIES.forEach(c => {
    bar.innerHTML += `<button class="cat-btn" data-cat="${c.id}" onclick="filterCat('${c.id}',this)">${c.icon||''} ${c.name}</button>`;
  });
}

function filterCat(id, btn) {
  state.currentCat = id;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b===btn));
  buildProductGrid();
}

/* ─── PRODUCTS ─── */
function buildProductGrid() {
  const grid = document.getElementById('prodgrid');
  const prods = state.currentCat === 'all'
    ? PRODUCTS
    : PRODUCTS.filter(p => p.category_name === (CATEGORIES.find(c=>c.id==state.currentCat)||{}).name);
  grid.innerHTML = prods.map(p => `
    <div class="prod-card" onclick="addToReceipt(${p.id})">
      <div class="prod-name">${p.name}</div>
      <div class="prod-price">${fmt(p.price)}</div>
    </div>`).join('');
}

/* ─── TABLES ─── */
function buildTablesGrid() {
  const grid = document.getElementById('tablesgrid');
  if (!TABLES.length) {
    grid.innerHTML = '<div style="color:var(--text2);padding:20px;text-align:center">Nema stolova</div>';
    return;
  }
  grid.innerHTML = TABLES.map(t => `
    <div class="table-card ${t.is_occupied?'occupied':'free'}" onclick="selectTable(${t.id},'${t.name}')">
      <div class="table-num">${t.number}</div>
      <div class="table-label">${t.name}</div>
      <div class="table-label">${t.is_occupied?'🔴 Zauzet':'🟢 Slobodan'}</div>
    </div>`).join('');
}

function selectTable(id, name) {
  state.receipt = state.receipt || { id:null, items:[], table_id:null, table_number:null };
  state.receipt.table_id = id;
  state.receipt.table_number = name;
  setMode('products');
  updateReceiptHeader();
  toast(`Stol: ${name}`, 'ok');
}

function setMode(m) {
  state.mode = m;
  document.getElementById('prodgrid').style.display = m==='products' ? 'grid' : 'none';
  document.getElementById('tablesgrid').style.display = m==='tables' ? 'grid' : 'none';
  document.getElementById('catbar').style.display = m==='products' ? 'flex' : 'none';
  if (document.getElementById('mode-prod')) {
    document.getElementById('mode-prod').classList.toggle('active', m==='products');
    document.getElementById('mode-tables').classList.toggle('active', m==='tables');
  }
}

/* ─── RECEIPT ─── */
function addToReceipt(prodId) {
  if (!state.session) { toast('Morate se prijaviti!', 'err'); return; }
  const p = PRODUCTS.find(x => x.id === prodId);
  if (!p) return;
  if (!state.receipt) state.receipt = { id: null, items: [], table_id: null, table_number: null };

  const existing = state.receipt.items.find(i => i.id === prodId);
  if (existing) {
    existing.qty++;
  } else {
    state.receipt.items.push({ id: prodId, name: p.name, price: p.price, qty: 1, tax_rate: p.tax_value });
  }
  renderReceipt();

  // sync to backend
  posApi('/api/receipt/add/', {
    product_id: prodId, qty: 1,
    table_id: state.receipt.table_id,
  }).then(r => {
    if (r.ok) state.receipt.id = r.receipt?.id;
  });
}

function changeQty(prodId, delta) {
  if (!state.receipt) return;
  const item = state.receipt.items.find(i => i.id === prodId);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    state.receipt.items = state.receipt.items.filter(i => i.id !== prodId);
    posApi('/api/receipt/remove/', { product_id: prodId });
  } else {
    posApi('/api/receipt/add/', { product_id: prodId, qty: delta });
  }
  renderReceipt();
}

function renderReceipt() {
  const items = state.receipt ? state.receipt.items : [];
  const empty = document.getElementById('receipt-empty');
  const container = document.getElementById('receipt-items');

  if (!items.length) {
    empty.style.display = 'flex';
    container.innerHTML = '';
    container.appendChild(empty);
    updateTotals(0, 0, 0);
    return;
  }
  empty.style.display = 'none';

  let sub=0, tax=0;
  items.forEach(i => {
    sub += i.price * i.qty;
    tax += i.price * i.qty * i.tax_rate / (1 + i.tax_rate);
  });
  const total = sub;
  sub = total - tax;

  container.innerHTML = items.map(i => `
    <div class="ri">
      <div class="ri-name">${i.name}</div>
      <div class="ri-qty">
        <button class="qty-btn" onclick="changeQty(${i.id},-1)">−</button>
        <span class="qty-num">${i.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i.id},1)">+</button>
      </div>
      <div class="ri-total">${fmt(i.price*i.qty)}</div>
      <button class="ri-del" onclick="changeQty(${i.id},-99)">×</button>
    </div>`).join('');

  updateTotals(sub, tax, total);
  updateReceiptHeader();
}

function updateReceiptHeader() {
  const tag = document.getElementById('receipt-table');
  if (state.receipt && state.receipt.table_number) {
    tag.textContent = '🪑 ' + state.receipt.table_number;
    tag.style.display = 'inline';
  } else {
    tag.style.display = 'none';
  }
}

function updateTotals(sub, tax, total) {
  document.getElementById('tot-sub').textContent = fmt(sub);
  document.getElementById('tot-tax').textContent = fmt(tax);
  document.getElementById('tot-total').textContent = fmt(total);
  document.getElementById('pay-amount-big').textContent = fmt(total);
}

function getTotal() {
  if (!state.receipt || !state.receipt.items.length) return 0;
  return state.receipt.items.reduce((s, i) => s + i.price * i.qty, 0);
}

function clearReceipt() {
  state.receipt = null;
  renderReceipt();
  toast('Račun obrisan');
}

function newReceipt() {
  state.receipt = { id: null, items: [], table_id: null, table_number: null };
  renderReceipt();
}

/* ─── PAYMENT ─── */
function openPayModal(method) {
  if (!state.session) { toast('Morate se prijaviti!', 'err'); return; }
  if (!state.receipt || !state.receipt.items.length) { toast('Račun je prazan!', 'err'); return; }
  selectPayMethod(method);
  document.getElementById('pay-modal').classList.add('open');
  document.getElementById('cash-received').value = '';
  document.getElementById('change-row').style.display = 'none';
}

function closePayModal() {
  document.getElementById('pay-modal').classList.remove('open');
}

function selectPayMethod(m) {
  state.payMethod = m;
  document.querySelectorAll('.pay-method-btn').forEach(b => b.classList.toggle('selected', b.dataset.method===m));
  document.getElementById('cash-input-row').style.display = m==='cash' ? 'block' : 'none';
  document.getElementById('change-row').style.display = 'none';
}

function calcChange() {
  const received = parseFloat(document.getElementById('cash-received').value) || 0;
  const total = getTotal();
  const change = received - total;
  const row = document.getElementById('change-row');
  if (received > 0) {
    row.style.display = 'flex';
    document.getElementById('change-val').textContent = fmt(Math.max(0, change));
    document.getElementById('change-val').style.color = change >= 0 ? 'var(--green)' : 'var(--red)';
  }
}

async function confirmPayment() {
  const btn = document.getElementById('pay-confirm-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Obrađujem...';

  const total = getTotal();
  const received = parseFloat(document.getElementById('cash-received').value) || total;

  try {
    const r = await posApi('/api/pay/', {
      receipt_id: state.receipt?.id,
      payment_methods: [{ method: state.payMethod, amount: total }],
      cash_received: state.payMethod === 'cash' ? received : total,
    });

    closePayModal();

    if (r.ok) {
      showSuccess(`Plaćeno ${fmt(total)}`, state.payMethod === 'cash' ? `Kusur: ${fmt(Math.max(0, received - total))}` : '');
      state.receipt = null;
      renderReceipt();
    } else {
      toast(r.error || 'Greška pri naplati', 'err');
    }
  } catch(e) {
    toast('Greška: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '✓ NAPLATI';
  }
}

function showSuccess(msg, sub) {
  const ov = document.getElementById('success-overlay');
  document.getElementById('success-msg').textContent = msg;
  document.getElementById('success-sub').textContent = sub || '';
  ov.classList.add('open');
  setTimeout(() => ov.classList.remove('open'), 2500);
}

/* ─── LOGIN ─── */
let pinBuffer = '';
let selectedCashierId = CASHIERS.length === 1 ? CASHIERS[0].id : null;

function buildCashierList() {
  const list = document.getElementById('cashier-list');
  if (CASHIERS.length === 1) {
    list.innerHTML = `<div style="font-size:.9rem;color:var(--gold);margin-bottom:8px">👤 ${CASHIERS[0].name}</div>`;
    selectedCashierId = CASHIERS[0].id;
    return;
  }
  list.innerHTML = CASHIERS.map(c => `
    <button class="cashier-opt${c.id===selectedCashierId?' selected':''}"
            onclick="selectCashier(${c.id},this)">
      👤 ${c.name}
    </button>`).join('');
}

function selectCashier(id, el) {
  selectedCashierId = id;
  document.querySelectorAll('.cashier-opt').forEach(b => b.classList.remove('selected'));
  if (el) el.classList.add('selected');
  pinBuffer = '';
  updatePinDisplay();
  document.getElementById('login-error').textContent = '';
}

function pinKey(k) {
  if (pinBuffer.length >= 6) return;
  pinBuffer += k;
  updatePinDisplay();
  if (pinBuffer.length === 4) setTimeout(pinEnter, 200);
}

function pinDel() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDisplay();
}

function updatePinDisplay() {
  const d = document.getElementById('pin-display');
  d.textContent = '●'.repeat(pinBuffer.length) || '····';
}

async function pinEnter() {
  if (!selectedCashierId) { document.getElementById('login-error').textContent = 'Odaberite blagajnika'; return; }
  if (!pinBuffer) return;
  const errEl = document.getElementById('login-error');
  try {
    const r = await posApi('/api/login/', {
      terminal_id: TERMINAL_ID,
      pin: pinBuffer,
      cashier_id: selectedCashierId,
    });
    if (r.ok) {
      state.session = { id: r.session_id };
      state.cashier = r.cashier;
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('tb-cashier').textContent = r.cashier.name;
      document.getElementById('session-dot').style.background = 'var(--green)';
      document.getElementById('tb-session').textContent = 'Aktivna sesija';
      document.getElementById('btn-logout').style.display = '';
      if (IS_GASTRO) document.getElementById('btn-tables').style.display = '';
      toast(`Dobrodošao/la, ${r.cashier.name}!`, 'ok');
    } else {
      errEl.textContent = r.error || 'Greška';
      pinBuffer = '';
      updatePinDisplay();
    }
  } catch(e) {
    errEl.textContent = 'Greška veze';
    pinBuffer = '';
    updatePinDisplay();
  }
}

function logout() {
  posApi('/api/session/close/', { session_id: state.session?.id }).then(() => {
    state.session = null;
    state.cashier = null;
    state.receipt = null;
    renderReceipt();
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('tb-cashier').textContent = '—';
    document.getElementById('session-dot').style.background = 'var(--red)';
    document.getElementById('tb-session').textContent = 'Nije prijavljen';
    document.getElementById('btn-logout').style.display = 'none';
    document.getElementById('btn-tables').style.display = 'none';
    pinBuffer = '';
    updatePinDisplay();
  });
}

function openTables() { setMode('tables'); }

/* ─── API ─── */
function posApi(url, data) {
  return fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCsrf(),
    },
    body: JSON.stringify(data),
  }).then(r => r.json());
}

function getCsrf() {
  const m = document.cookie.match(/csrftoken=([^;]+)/);
  return m ? m[1] : '';
}

/* ─── KEYBOARD ─── */
document.addEventListener('keydown', e => {
  const overlay = document.getElementById('login-overlay');
  if (overlay.style.display !== 'none') {
    if (e.key >= '0' && e.key <= '9') pinKey(e.key);
    if (e.key === 'Backspace') pinDel();
    if (e.key === 'Enter') pinEnter();
  }
});

/* ─── INIT ─── */
buildCatBar();
buildProductGrid();
if (IS_GASTRO) buildTablesGrid();
buildCashierList();
renderReceipt();
