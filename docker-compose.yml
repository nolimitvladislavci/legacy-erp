# fina-connect Docker Compose
# Base: Ubuntu 24.04 (isti OS kao host = venv symlinki rade)

services:

  fina-web:
    build:
      context: /var/www/fina-connect
      dockerfile: Dockerfile
    image: fina-connect:local
    container_name: fina_web
    restart: always
    working_dir: /var/www/fina-connect
    command: [
      "/var/www/fina-connect/venv/bin/gunicorn", "core.wsgi:application",
      "--bind", "0.0.0.0:8004",
      "--workers", "6",
      "--threads", "2",
      "--timeout", "300",
      "--max-requests", "1000",
      "--max-requests-jitter", "50",
      "--graceful-timeout", "30",
      "--log-level", "info"
    ]
    volumes:
      - /var/www/fina-connect:/var/www/fina-connect:ro
      - /var/www/fina-connect/media:/var/www/fina-connect/media:rw
      - /var/log/fina-connect:/var/log/fina-connect:rw
    env_file:
      - /var/www/fina-connect/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=core.settings
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8004/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  fina-celery:
    image: fina-connect:local
    container_name: fina_celery
    restart: always
    working_dir: /var/www/fina-connect
    command: [
      "/var/www/fina-connect/venv/bin/celery", "-A", "core", "worker",
      "--loglevel=info", "--concurrency=4"
    ]
    volumes:
      - /var/www/fina-connect:/var/www/fina-connect:ro
      - /var/www/fina-connect/media:/var/www/fina-connect/media:rw
      - /var/log/fina-connect:/var/log/fina-connect:rw
    env_file:
      - /var/www/fina-connect/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=core.settings
    network_mode: host
    depends_on:
      fina-web:
        condition: service_healthy
