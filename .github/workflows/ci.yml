name: FINA-Connect CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fina_test
          POSTGRES_USER: fina
          POSTGRES_PASSWORD: fina_test_pw
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libglib2.0-dev             libxml2-dev libxslt1-dev libffi-dev libssl-dev libjpeg-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Django check
        env:
          DB_NAME: fina_test
          DB_USER: fina
          DB_PASSWORD: fina_test_pw
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: test-secret-key-not-for-production
        run: python manage.py check

      - name: Run tests
        env:
          DB_NAME: fina_test
          DB_USER: fina
          DB_PASSWORD: fina_test_pw
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: test-secret-key-not-for-production
        run: python manage.py test --verbosity=1

      - name: Lint with ruff
        run: ruff check . --ignore=E501,F401 || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/fina-connect
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt -q
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            supervisorctl restart fina-connect
            echo "Deployed at $(date)"
