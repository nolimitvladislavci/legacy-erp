repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix, --select, "F401,F811,F841,E712"]
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: django-check
        name: Django System Check
        entry: bash -c '/var/www/fina-connect/venv/bin/python manage.py check 2>/dev/null'
        language: system
        pass_filenames: false
        always_run: true
