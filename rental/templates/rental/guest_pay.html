<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plaćanje — {{ booking.rental_property.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --gold: #c9a84c; --dark-bg: #0d0d1a; --card-bg: #1a1a2e; }
    body { background: var(--dark-bg); color: #e0e0e0; min-height: 100vh; font-family: 'Barlow', sans-serif; }
    .text-gold { color: var(--gold) !important; }
    .pay-card { background: var(--card-bg); border: 1px solid #2a2a3d; border-radius: 12px; }
    .btn-gold { background: var(--gold); color: #0d0d1a; border: none; font-weight: 600; }
    .btn-gold:hover { background: #b8963e; color: #0d0d1a; }
    .amount-display { font-size: 2.5rem; font-weight: 700; color: var(--gold); }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <div style="max-width: 440px; width: 100%;">

    <div class="text-center mb-4">
      <i class="bi bi-credit-card-2-front display-3 text-gold"></i>
      <h3 class="mt-2 mb-0">Plaćanje</h3>
      <p class="text-muted">{{ booking.rental_property.name }}</p>
    </div>

    <div class="pay-card p-4 mb-4">
      <div class="d-flex justify-content-between mb-2">
        <span class="text-muted">Gost</span>
        <strong>{{ booking.guest_name }}</strong>
      </div>
      <div class="d-flex justify-content-between mb-2">
        <span class="text-muted">Check-in</span>
        <span>{{ booking.check_in|date:"d.m.Y" }}</span>
      </div>
      <div class="d-flex justify-content-between mb-3">
        <span class="text-muted">Check-out</span>
        <span>{{ booking.check_out|date:"d.m.Y" }}</span>
      </div>
      <hr style="border-color: #2a2a3d;">
      <div class="text-center py-3">
        <small class="text-muted d-block mb-1">Ukupan iznos</small>
        <div class="amount-display">{{ booking.total_price|floatformat:2 }} €</div>
      </div>
    </div>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-gold btn-lg w-100 py-3">
        <i class="bi bi-lock-fill me-2"></i>Plati {{ booking.total_price|floatformat:2 }} €
      </button>
    </form>

    <div class="text-center mt-4">
      <small class="text-muted">
        <i class="bi bi-shield-check me-1"></i>Sigurno plaćanje putem Stripe
      </small>
      <br>
      <small class="text-muted mt-2 d-block">LIMIT Connect &middot; Rental</small>
    </div>
  </div>
</body>
</html>
