<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partneri — No Limit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--gold:#c9a84c;--text:#e0e0e0;--muted:#888;--font:'Space Grotesk',system-ui,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.8}
a{color:var(--gold);text-decoration:none}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:1px}
.nav-brand span{color:var(--gold)}
.content{max-width:700px;margin:40px auto;padding:0 24px}
h1{font-size:1.8rem;color:#fff;margin-bottom:32px;text-align:center}
.partner{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;display:flex;align-items:center;gap:20px}
.partner-flag{font-size:2.5rem}
.partner h3{color:#fff;font-size:1.1rem;margin-bottom:4px}
.partner p{color:var(--muted);font-size:.9rem;margin:0}
.partner-cta{border-style:dashed;text-align:center;display:block;padding:24px}
footer{background:var(--surface);border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--muted);font-size:.85rem;margin-top:60px}
</style>
</head>
<body>
<nav>
    <a href="/" class="nav-brand"><span>No</span> Limit</a>
    <a href="/" style="color:var(--muted);font-size:.9rem">← Natrag</a>
</nav>
<div class="content">
    <h1>Partneri</h1>
    <div class="partner">
        <div class="partner-flag">🇩🇪</div>
        <div>
            <h3>Viskovic Bau</h3>
            <p>Nufringen, Njemačka — Poslovni partner i pokrovitelj</p>
        </div>
    </div>
    <div class="partner">
        <div class="partner-flag">🇭🇷</div>
        <div>
            <h3>Konjik d.o.o.</h3>
            <p>Osijek, Hrvatska — Tehnološki partner, razvoj svih platformi</p>
        </div>
    </div>
    <a href="/kontakt/" class="partner partner-cta">
        <div style="color:var(--gold);font-weight:600;font-size:1.1rem">Postanite partner</div>
        <div style="color:var(--muted);font-size:.9rem;margin-top:4px">Sponzor, partner, EU ko-aplikant — javite nam se</div>
    </a>
</div>
<footer><p>© 2026 No-limit udruga | <a href="/">no-limit.world</a></p></footer>
</body>
</html>
