<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partneri — No Limit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--gold:#c9a84c;--text:#e0e0e0;--muted:#888;--font:'Space Grotesk',system-ui,sans-serif}

[data-theme="light"]{
  --bg:#f5f2ec;--surface:#ffffff;--slate:#edeae3;--border:#d6cfc4;
  --gold:#8a6d1e;--gold-light:#b8942a;--white:#1a1209;--dim:#5a4e3e;
  --green:#15803d;--blue:#1d4ed8;--purple:#6d28d9;--dark:#edeae3;
}
[data-theme="light"] body{background:var(--bg);color:var(--white)}
[data-theme="light"] nav.scrolled{background:rgba(245,242,236,.96)!important;border-bottom-color:var(--border)!important}
[data-theme="light"] .hamburger span{background:var(--white)}
.theme-toggle{width:34px;height:34px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:.2s;flex-shrink:0}
.theme-toggle:hover{border-color:var(--gold);color:var(--gold)}

body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.8}
a{color:var(--gold);text-decoration:none}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:1px}
.nav-brand span{color:var(--gold)}
.content{max-width:700px;margin:40px auto;padding:0 24px}
h1{font-size:1.8rem;color:#fff;margin-bottom:32px;text-align:center}
.partner{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;display:flex;align-items:center;gap:20px}
.partner-flag{font-size:2.5rem}
.partner h3{color:#fff;font-size:1.1rem;margin-bottom:4px}
.partner p{color:var(--muted);font-size:.9rem;margin:0}
.partner-cta{border-style:dashed;text-align:center;display:block;padding:24px}
footer{background:var(--surface);border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--muted);font-size:.85rem;margin-top:60px}
</style>
</head>
<body>
<nav>
    <a href="/" class="nav-brand"><span>No</span> Limit</a>
    <a href="/" style="color:var(--muted);font-size:.9rem">← Natrag</a>
<button class="theme-toggle" id="themeToggle" aria-label="Tema"><span id="themeIcon">☀️</span></button>
</nav>
<div class="content">
    <h1>Partneri</h1>
    <div class="partner">
        <div class="partner-flag">🇩🇪</div>
        <div>
            <h3>Viskovic Bau</h3>
            <p>Nufringen, Njemačka — Poslovni partner i pokrovitelj</p>
        </div>
    </div>
    <div class="partner">
        <div class="partner-flag">🇭🇷</div>
        <div>
            <h3>Konjik d.o.o.</h3>
            <p>Osijek, Hrvatska — Tehnološki partner, razvoj svih platformi</p>
        </div>
    </div>
    <a href="/kontakt/" class="partner partner-cta">
        <div style="color:var(--gold);font-weight:600;font-size:1.1rem">Postanite partner</div>
        <div style="color:var(--muted);font-size:.9rem;margin-top:4px">Sponzor, partner, EU ko-aplikant — javite nam se</div>
    </a>
</div>
<footer><p>© 2026 No-limit udruga | <a href="/">no-limit.world</a></p></footer>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('themeToggle'),icon=document.getElementById('themeIcon');
  function setTheme(t){root.setAttribute('data-theme',t);if(icon)icon.textContent=t==='light'?'🌙':'☀️';try{localStorage.setItem('nl-theme',t)}catch(e){}}
  var saved='';try{saved=localStorage.getItem('nl-theme')||''}catch(e){}
  setTheme(saved||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  if(btn)btn.addEventListener('click',function(){setTheme((root.getAttribute('data-theme')||'dark')==='dark'?'light':'dark')});
})();
</script>
</body>
</html>
