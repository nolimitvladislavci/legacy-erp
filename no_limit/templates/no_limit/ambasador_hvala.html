<!DOCTYPE html>
<html lang="hr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hvala! — No Limit</title>
<link rel="stylesheet" href="/static/css/nolimit-portal.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<nav class="nl-nav">
    <a href="/" class="nl-nav-brand" style="text-decoration:none"><span>No</span> Limit</a>
<button class="theme-toggle" id="themeToggle" aria-label="Tema"><span id="themeIcon">☀️</span></button>
</nav>
<div style="max-width:600px;margin:80px auto;padding:0 24px;text-align:center">
    <div style="font-size:4rem;margin-bottom:24px">🎉</div>
    <h1 style="color:var(--white);font-size:1.8rem;margin-bottom:12px">Hvala na prijavi!</h1>
    <p style="color:var(--text-dim);font-size:1.1rem;margin-bottom:32px">
        Vaša prijava je zaprimljena. Javit ćemo se u roku 48 sati.
    </p>
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:32px">
        U međuvremenu, pogledajte naše projekte i dokumentaciju:
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a href="/" class="nl-btn nl-btn-gold"><i class="fas fa-home"></i> Početna</a>
        <a href="/statut/" class="nl-btn nl-btn-outline"><i class="fas fa-file-contract"></i> Statut</a>
        <a href="/dokumenti/ambasadorski-ugovor.pdf" class="nl-btn nl-btn-outline"><i class="fas fa-file-pdf"></i> Ugovor A1</a>
    </div>
</div>
<footer class="nl-footer" style="position:fixed;bottom:0;width:100%">
    <p>© 2026 No-limit udruga | <a href="/">no-limit.world</a></p>
</footer>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('themeToggle'),icon=document.getElementById('themeIcon');
  function setTheme(t){root.setAttribute('data-theme',t);if(icon)icon.textContent=t==='light'?'🌙':'☀️';try{localStorage.setItem('nl-theme',t)}catch(e){}}
  var saved='';try{saved=localStorage.getItem('nl-theme')||''}catch(e){}
  setTheme(saved||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  if(btn)btn.addEventListener('click',function(){setTheme((root.getAttribute('data-theme')||'dark')==='dark'?'light':'dark')});
})();
</script>
</body>
</html>
