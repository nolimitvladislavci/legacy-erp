<!DOCTYPE html>
<html lang="hr">
<head><meta charset="UTF-8"><title>Token nije pronađen — eArhivator</title>
<style>
body { font-family: system-ui, sans-serif; background: #f9fafb;
       display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.box { max-width: 440px; text-align: center; padding: 2rem; }
.icon { font-size: 4rem; margin-bottom: 1rem; }
h1 { font-size: 1.5rem; font-weight: 800; color: #1A0A00; margin-bottom: .5rem; }
p  { color: #6b7280; font-size: .9rem; line-height: 1.6; }
.token { font-family: monospace; background: #f3f4f6; border-radius: 8px;
         padding: .25rem .75rem; font-size: .9rem; color: #374151; }
</style></head>
<body>
<div class="box">
  <div class="icon">🔍</div>
  <h1>Token nije pronađen</h1>
  <p>Seal token <span class="token">{{ token }}</span> ne postoji u ChainBlock registru.</p>
  <p style="margin-top:.75rem">Moguće da je token netočan ili da blok još nije kreiran.</p>
</div>
</body>
</html>
