# Kelava — ekran za otpad (otpad_katalog/ekran). Uključuje se u server blok genesis.limit-connect.com:
#   include /etc/nginx/snippets/otpad.conf;
# Ekran nema vlastitu prijavu, pa je iza HTTP Basic prijave (isti obrazac kao /ehox/) dok ne dobije GenesisLogin.
location = /otpad { return 301 https://$host/otpad/; }
location ^~ /otpad/ {
    auth_basic "Kelava otpad";
    auth_basic_user_file /etc/nginx/.otpad_htpasswd;
    client_max_body_size 16m;                       # slika do 15 MB (ekran sam odbija veće, 413)
    proxy_pass http://127.0.0.1:8130/;              # skida prefiks /otpad/; ekran koristi relativne putanje
    proxy_set_header Host $http_host;               # ekran uspoređuje Origin s Host (zaštita POST-a); $http_host nosi i port
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000" always;   # add_header u lokaciji ne nasljeđuje serverski HSTS
    add_header X-Robots-Tag "noindex, nofollow" always;
}
