[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "W"]
# F: Pyflakes (unused imports, undefined names, etc.)
# E9: Runtime errors (syntax errors, etc.)
# W: Warnings
# NOT including E (style) yet — too many hits for first pass

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["ALL"]
"*/tests*" = ["ALL"]
"backups/*" = ["ALL"]
"tmp/*" = ["ALL"]
"simulation/*" = ["ALL"]
"TASK_ARCHIVE/*" = ["ALL"]
"tools/*" = ["ALL"]
"venv/*" = ["ALL"]
