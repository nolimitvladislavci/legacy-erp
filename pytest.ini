[pytest]
DJANGO_SETTINGS_MODULE = core.settings_test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --create-db --no-migrations --ignore=scripts --ignore=venv --ignore=backups --ignore=tmp --ignore=simulation --ignore=loadtest --ignore=pos/scripts
